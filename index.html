<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a8173" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Конверты — учёт денег</title>
<script>
  /* Применяем тему как можно раньше — чтобы не было вспышки светлого фона. */
  (function(){ try{
    var t = localStorage.getItem('konverty_theme') || 'auto';
    var eff = t==='auto' ? ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light') : t;
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){} })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6fb;
    --card: #ffffff;
    --card2: #f2f4f9;
    --card-border: transparent;
    --line: #eef0f6;
    --txt: #2b2f39;
    --muted: #616876;
    --accent: #3bb8ab;
    --accent-d: #2fa093;
    --accent-soft: #e6f7f4;
    --green: #197d5e;       /* 1.1.0: текст/суммы ≥ 4,5:1 на белом и на фоне страницы (был #1f9d77 — 3,4:1) */
    --red: #cf222e;         /* 1.1.0: было #e0434e — 4,1:1 */
    --red-soft: #fdeaea;
    --blue: #5b8def;
    --amber: #f0b429;
    /* Акцентные градиенты и свечения (шапка, кнопки, тотал-карточка) */
    /* 1.1.0: заливки, на которых лежит БЕЛЫЙ текст (шапка, карточка «Свободные деньги», итоги, кнопки), — тот же бирюзовый оттенок, но глубже: белый ≥ 4,6:1 (на мятном #46c4b6 было 2,1:1).
       Три роли цвета: --accent — декор (полосы, значки, подложки); --accent-solid — заливка под текстом; --accent-text — текст-акцент на светлом/тёмном фоне. --on-grad — цвет текста на градиентных поверхностях. */
    --grad1: #0a8173;
    --grad2: #066b60;
    --accent-solid: #0a8173;
    --on-grad: #ffffff;
    --ov: rgba(0,0,0,.17); --ov-strong: rgba(0,0,0,.28);   /* подложки/разделители на заливках: затемняют фон под белым текстом (светлая подложка снижала контраст до 3,1:1) */
    --on-accent: #ffffff;
    --accent-glow: rgba(59,184,171,.30);
    --accent-glow-strong: rgba(59,184,171,.50);
    --header-shadow: rgba(52,168,155,.28);
    --input-focus-bg: #ffffff;
    --toast-bg: #2a2e37;
    --toast-txt: #ffffff;
    --danger-bg: #fdecec;
    --danger-txt: #ef5f68;
    --warn-bg: #fff8e8;
    --warn-line: #f4e6bf;
    --warn-txt: #8f6711;
    --inv-bg: #fdf3dc;
    --inv-txt: #8f6408;
    --shadow: 0 3px 14px rgba(40,50,80,.05), 0 1px 4px rgba(40,50,80,.04);
    --shadow-sm: 0 1px 2px rgba(40,50,80,.05), 0 2px 8px rgba(40,50,80,.04);   /* для плоских списков: едва заметная опора вместо тени у каждой строки */
    --shadow-lift: 0 8px 24px rgba(40,50,80,.10);
    /* Дизайн-система: единая шкала радиусов, отступов, зон нажатия и переходов (одинаково во всех темах) */
    --r-xs: 8px; --r-sm: 11px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
    --sp-1: 6px; --sp-2: 10px; --sp-3: 14px; --sp-4: 18px; --sp-5: 24px;
    --tap: 44px; --ease: .18s cubic-bezier(.2,.7,.3,1);
    --radius: 18px;
    --sbw: 256px;              /* ширина боковой навигации на ПК */
    --content-max: 1140px;     /* макс. ширина контента на ПК */
    --hero-over: #ffd7cd;      /* светлый коралл для полосы «лимит превышен» на hero (всегда на акцентном фоне) */
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  /* ===== Тёмная — тёплый графит с фирменной бирюзой ===== */
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c;
    --card: #1e222b;
    --card2: #262b36;
    --card-border: #2c313d;
    --line: #2a2f3a;
    --txt: #e7eaf0;
    --muted: #8b93a3;
    --accent: #3ec7b8;
    --accent-d: #2fa093;
    --accent-soft: #163430;
    --green: #35c692;
    --red: #f4707a;
    --red-soft: #3a2226;
    --grad1: #0a8173;
    --grad2: #066b60;
    --accent-solid: #0a8173;
    --header-shadow: rgba(0,0,0,.45);
    --accent-glow: rgba(0,0,0,.35);
    --accent-glow-strong: rgba(20,120,110,.45);
    --input-focus-bg: #262b36;
    --toast-bg: #f0f2f6;
    --toast-txt: #1a1d24;
    --danger-bg: #3a2226;
    --danger-txt: #f4707a;
    --warn-bg: #322a17;
    --warn-line: #4d4223;
    --warn-txt: #e6c56a;
    --inv-bg: #3a3018;
    --inv-txt: #e6c56a;
    --shadow: 0 3px 14px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.24);
    --shadow-lift: 0 10px 30px rgba(0,0,0,.45);
  }

  /* ===== Полночь — глубокий индиго с синим акцентом ===== */
  html[data-theme="midnight"] {
    color-scheme: dark;
    --bg: #0f1226;
    --card: #181c39;
    --card2: #21274a;
    --card-border: #2a3057;
    --line: #262c50;
    --txt: #e6e9f7;
    --muted: #8b91c0;
    --accent: #6c8cff;
    --accent-d: #5872e6;
    --accent-soft: #1c2350;
    --green: #4bd0a0;
    --red: #ff7b8a;
    --red-soft: #35203a;
    --grad1: #4c63e0;
    --grad2: #5a47d8;
    --accent-solid: #4c63e0;
    --on-accent: #ffffff;
    --header-shadow: rgba(0,0,0,.5);
    --accent-glow: rgba(108,140,255,.28);
    --accent-glow-strong: rgba(108,140,255,.5);
    --input-focus-bg: #21274a;
    --toast-bg: #eef0fb;
    --toast-txt: #171a33;
    --danger-bg: #35203a;
    --danger-txt: #ff7b8a;
    --warn-bg: #2c2740;
    --warn-line: #443c66;
    --warn-txt: #d7b56a;
    --inv-bg: #2f2a4a;
    --inv-txt: #d7b56a;
    --shadow: 0 3px 14px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.26);
    --shadow-lift: 0 10px 30px rgba(0,0,0,.5);
  }

  /* ===== Сепия — тёплая бумага с терракотой ===== */
  html[data-theme="sepia"] {
    color-scheme: light;
    --bg: #f3ece0;
    --card: #fbf6ee;
    --card2: #efe6d6;
    --card-border: #e7dcc8;
    --line: #eadfce;
    --txt: #43382a;
    --muted: #6b5c40;
    --accent: #c8794a;
    --accent-d: #b0653a;
    --accent-soft: #f6e6d7;
    --green: #4d6f3c;
    --red: #aa3e37;
    --red-soft: #f6ddd6;
    --grad1: #ac6227;
    --grad2: #985328;
    --accent-solid: #b25f2d;
    --accent-text: #95542d;
    --header-shadow: rgba(176,101,58,.28);
    --accent-glow: rgba(200,121,74,.28);
    --accent-glow-strong: rgba(200,121,74,.45);
    --input-focus-bg: #fbf6ee;
    --toast-bg: #43382a;
    --toast-txt: #fbf6ee;
    --danger-bg: #f6ddd6;
    --danger-txt: #cf5b52;
    --warn-bg: #f7ecd2;
    --warn-line: #e6d3a6;
    --warn-txt: #806526;
    --inv-bg: #f2e2c4;
    --inv-txt: #7c5e1f;
    --shadow: 0 3px 14px rgba(120,90,50,.08), 0 1px 4px rgba(120,90,50,.05);
    --shadow-lift: 0 8px 24px rgba(120,90,50,.14);
  }

  /* ===== Океан — светлая с прохладным синим ===== */
  html[data-theme="ocean"] {
    color-scheme: light;
    --bg: #eef4f8;
    --card: #ffffff;
    --card2: #e7eef4;
    --card-border: transparent;
    --line: #e2eaf1;
    --txt: #23323f;
    --muted: #566d7e;
    --accent: #2f8fd6;
    --accent-d: #2678b8;
    --accent-soft: #e0f0fb;
    --green: #16765f;
    --red: #cc222e;
    --red-soft: #fdeaea;
    --grad1: #167aba;
    --grad2: #2169a7;
    --accent-solid: #1e7abe;
    --accent-text: #216ea7;
    --header-shadow: rgba(47,127,196,.26);
    --accent-glow: rgba(47,143,214,.28);
    --accent-glow-strong: rgba(47,143,214,.45);
    --input-focus-bg: #ffffff;
    --toast-bg: #23323f;
    --toast-txt: #ffffff;
    --danger-bg: #fdecec;
    --danger-txt: #ef5f68;
    --warn-bg: #fff5df;
    --warn-line: #f2e2b6;
    --warn-txt: #8a6d1e;
    --inv-bg: #fdf3dc;
    --inv-txt: #8f6408;
    --shadow: 0 3px 14px rgba(30,70,110,.06), 0 1px 4px rgba(30,70,110,.05);
    --shadow-lift: 0 8px 24px rgba(30,70,110,.12);
  }

  /* ===== Монарх — глубокий индиго с коралловым акцентом ===== */
  html[data-theme="monarch"] {
    color-scheme: dark;
    --bg:#0e1424; --card:#18203a; --card2:#222c4d; --card-border:#2b3659; --line:#273152;
    --txt:#e8ebf7; --muted:#8d96b8;
    --accent:#ff6a5d; --accent-d:#e8513f; --accent-soft:#3a2230;
    --green:#3fd08a; --red:#fb6f84; --red-soft:#3a2026;
    --grad1:#ff7a5e; --grad2:#ee5a46; --on-accent:#2b0f0a; --on-grad:#2b0f0a; --accent-solid:var(--accent); --ov:rgba(255,255,255,.22); --ov-strong:rgba(255,255,255,.34);
    --header-shadow:rgba(0,0,0,.5); --accent-glow:rgba(255,106,93,.28); --accent-glow-strong:rgba(255,106,93,.5);
    --input-focus-bg:#222c4d; --toast-bg:#eef0fb; --toast-txt:#141a2e;
    --danger-bg:#3a2026; --danger-txt:#fb6f84; --warn-bg:#332a14; --warn-line:#4d4223; --warn-txt:#e6c56a;
    --inv-bg:#2f2a4a; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.26); --shadow-lift:0 10px 30px rgba(0,0,0,.5);
  }

  /* ===== Уголь — почти чёрный графит с лаймовым акцентом ===== */
  html[data-theme="charcoal"] {
    color-scheme: dark;
    --bg:#0c0e10; --card:#16191d; --card2:#1e2227; --card-border:#272c32; --line:#23282d;
    --txt:#e9edea; --muted:#9ca69e;
    --accent:#b6e34b; --accent-d:#9ccb3a; --accent-soft:#232f19;
    --green:#4ccf9b; --red:#ff6b73; --red-soft:#331f22;
    --grad1:#242a30; --grad2:#15181c; --on-accent:#17230a; --accent-solid:var(--accent); --ov:rgba(255,255,255,.12); --ov-strong:rgba(255,255,255,.22);
    --header-shadow:rgba(0,0,0,.5); --accent-glow:rgba(182,227,75,.22); --accent-glow-strong:rgba(182,227,75,.42);
    --input-focus-bg:#1e2227; --toast-bg:#eef0ee; --toast-txt:#16191d;
    --danger-bg:#331f22; --danger-txt:#ff6b73; --warn-bg:#2e2914; --warn-line:#4a4223; --warn-txt:#e6c56a;
    --inv-bg:#2b2a18; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3); --shadow-lift:0 10px 30px rgba(0,0,0,.55);
  }

  /* ===== Аметист — глубокий фиолетовый ===== */
  html[data-theme="amethyst"] {
    color-scheme: dark;
    --bg:#15102a; --card:#1e1740; --card2:#281f52; --card-border:#342a63; --line:#2e2558;
    --txt:#ece8fb; --muted:#9a90c8;
    --accent:#a06bff; --accent-d:#8657e6; --accent-soft:#241a4a;
    --green:#4bd0a0; --red:#ff7b8a; --red-soft:#351f3a;
    --grad1:#8251ff; --grad2:#6938dd; --accent-solid:#8251ff; --on-accent:#ffffff;
    --header-shadow:rgba(0,0,0,.5); --accent-glow:rgba(160,107,255,.3); --accent-glow-strong:rgba(160,107,255,.5);
    --input-focus-bg:#281f52; --toast-bg:#efecfb; --toast-txt:#1a1333;
    --danger-bg:#351f3a; --danger-txt:#ff7b8a; --warn-bg:#2f2740; --warn-line:#473c66; --warn-txt:#d7b56a;
    --inv-bg:#2f2a4a; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.34), 0 1px 3px rgba(0,0,0,.28); --shadow-lift:0 10px 30px rgba(0,0,0,.52);
  }

  /* ===== Изумруд — глубокий зелёный с тёплым золотом ===== */
  html[data-theme="emerald"] {
    color-scheme: dark;
    --bg:#0b1512; --card:#122420; --card2:#1a302a; --card-border:#243f37; --line:#203a33;
    --txt:#e6f0ea; --muted:#9dbaac;
    --accent:#e0b24a; --accent-d:#c89a32; --accent-soft:#2e2714;
    --green:#3fd0a0; --red:#ff7b84; --red-soft:#331f22;
    --grad1:#1d6b54; --grad2:#134a3b; --on-accent:#241c08; --accent-solid:var(--accent); --ov:rgba(255,255,255,.12); --ov-strong:rgba(255,255,255,.22);
    --header-shadow:rgba(0,0,0,.45); --accent-glow:rgba(224,178,74,.28); --accent-glow-strong:rgba(224,178,74,.5);
    --input-focus-bg:#1a302a; --toast-bg:#eaf0ec; --toast-txt:#122420;
    --danger-bg:#331f22; --danger-txt:#ff7b84; --warn-bg:#2e2914; --warn-line:#4a4223; --warn-txt:#e6c56a;
    --inv-bg:#2b2a18; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3); --shadow-lift:0 10px 30px rgba(0,0,0,.52);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:16px; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased; }
  body { padding-bottom: calc(78px + var(--safe-b)); }
  h1,h2,h3 { margin:0; font-weight:700; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select, textarea { font-family:inherit; font-size:16px; }
  .muted { color:var(--muted); } .green { color:var(--green); } .red { color:var(--red); }
  .hidden { display:none !important; } a { color:var(--accent-text); }
  .skip-link { position:fixed; left:12px; top:-60px; z-index:100; background:var(--card); color:var(--txt); border:2px solid var(--accent); border-radius:var(--r-md); padding:10px 14px; font-weight:700; text-decoration:none; transition:top var(--ease); }
  .skip-link:focus { top:12px; }
  /* Иконки интерфейса (навигация и системные действия): единый набор из спрайта в начале <body>, одна толщина линии, размеры 16/18/22/26 */
  .ic { width:22px; height:22px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
  .ic.xs { width:16px; height:16px; } .ic.sm { width:18px; height:18px; } .ic.lg { width:26px; height:26px; }
  /* Текстовый акцент с достаточным контрастом на светлых и тёмных темах (смесь акцента с цветом текста темы) */
  html { --accent-text: color-mix(in srgb, var(--accent) 74%, var(--txt)); }
  html { --green-soft: color-mix(in srgb, var(--green) 9%, var(--card)); }   /* фон «хорошего» значка (рост дохода): зелёный в любой теме, а не --accent-soft */
  html[data-theme="light"], html:not([data-theme]) { --accent-text: #0a7a6d; }     /* 4,7:1 на фоне страницы, карточке и мягкой подложке (смесь давала 3,4:1) */
  /* Доступность: видимый фокус с клавиатуры (WCAG 2.4.7) */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  /* Доступность: уважаем «уменьшить движение» (prefers-reduced-motion) */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
    #splash .sp-bars i { animation:none !important; transform:none !important; }
  }
  [role="button"], .op, .acc, .env, .menu-item, .cat-item, .fund-row, .theme-card { -webkit-tap-highlight-color:transparent; }
  /* Состояние disabled для кнопок */
  .btn[disabled], .btn.off { opacity:.5; pointer-events:none; }
  /* Единые плавные переходы для интерактивных поверхностей */
  .op,.acc,.env,.menu-item,.list-item,.btn,.echip,.chip,.theme-card,.icon-btn,.seg button,.mini-seg button,.scope-btn,.notice-btn { transition: background var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease), filter var(--ease), color var(--ease); }
  /* Наведение мышью (только там, где есть настоящий hover) */
  @media (hover:hover){
    .op:hover, .acc:hover, .env:hover, .menu-item:hover, .list-item:hover { background:var(--card2); }
    .btn:hover { filter:brightness(1.04); }
    .echip:hover, .chip:hover, .cat-item:hover, .theme-card:hover { border-color:var(--accent); }
  }

  header { position:relative; z-index:20; color:var(--on-grad);
    background: linear-gradient(135deg, var(--grad1), var(--grad2));
    padding: calc(var(--safe-t) + 14px) 18px 16px; border-radius:0 0 var(--r-xl) var(--r-xl); box-shadow:0 4px 18px var(--header-shadow); }
  header .h-top { display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:19px; letter-spacing:.2px; font-weight:800; }
  .h-sum { display:flex; gap:10px; margin-top:14px; }
  .h-sum .box { flex:1; background:var(--ov); border-radius:var(--r-md); padding:10px 13px; }
  .h-sum .box .l { font-size:12px; font-weight:600; }
  .h-sum .box .v { font-weight:800; font-size:16px; margin-top:2px; }
  .h-free { margin-top:9px; display:flex; gap:8px; flex-wrap:wrap; }
  .h-free .hf { display:inline-flex; align-items:center; gap:5px; background:var(--ov); border-radius:var(--r-md); padding:8px 12px; min-height:var(--tap); font-size:13px; cursor:pointer; white-space:nowrap; }
  .h-free .hf b { font-size:14px; font-weight:800; }
  .h-free .hf:active { background:var(--ov-strong); }
  .h-free .hf:focus-visible { outline:2px solid currentColor; outline-offset:2px; }

  main { padding:14px; max-width:640px; margin:0 auto; outline:none; }
  .screen { display:none; } .screen.active { display:block; animation:fade .22s ease; }
  /* Экраны без оранжевого баннера — учитываем вырез/статус-бар телефона сверху */
  #screen-home, #screen-accounts, #screen-more { padding-top: var(--safe-t); }
  @keyframes fade { from{opacity:0; transform:translateY(4px)} to{opacity:1;transform:none} }

  .card { background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card.tight { padding:12px 15px; }
  .section-title { font-size:12.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:20px 6px 9px; font-weight:700; }

  .ops-filter { margin-bottom:6px; }
  .search-row { display:flex; gap:8px; align-items:stretch; }
  .search-inp { flex:1; }
  .search-wrap { position:relative; flex:1; min-width:0; }
  .search-wrap .search-ic { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; display:grid; }
  .search-wrap .search-inp { width:100%; padding-left:40px; }
  .scope-btn { flex:0 0 auto; min-width:var(--tap); min-height:var(--tap); display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--card2); color:var(--muted); font-weight:700; border-radius:var(--r-md); padding:0 14px; font-size:14px; white-space:nowrap; }
  .scope-btn:active { transform:scale(.98); }
  .scope-btn.on { background:var(--accent-soft); color:var(--accent-text); }
  .scope-btn .fcount { background:var(--accent-solid); color:var(--on-accent); border-radius:999px; font-size:12px; min-width:18px; height:18px; display:inline-grid; place-items:center; padding:0 5px; }
  .ops-filter-panel { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
  /* Полоса выбора периода (под баннером на Операциях/Анализе) */
  .period-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .per-nav { display:flex; align-items:center; gap:2px; background:var(--card2); border-radius:var(--r-md); padding:3px; }
  .per-nav button { width:44px; height:44px; border-radius:var(--r-sm); color:var(--txt); font-size:20px; display:grid; place-items:center; }
  .per-nav button:disabled { opacity:.3; pointer-events:none; }
  .per-nav button:not(:disabled):active { background:var(--card); transform:scale(.94); }
  .per-nav span { font-weight:700; font-size:14px; min-width:124px; text-align:center; }
  .per-all { background:var(--card2); color:var(--muted); font-weight:700; border-radius:var(--r-md); padding:0 15px; min-height:42px; font-size:13px; white-space:nowrap; }
  .per-all.active { background:var(--accent-soft); color:var(--accent-text); }
  .per-all:active { transform:scale(.98); }
  /* Календарь-сетка */
  .cal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:4px 2px 14px; }
  .cal-nav { display:flex; align-items:center; gap:2px; }
  .cal-nav > button:not(.btn) { width:44px; height:44px; border-radius:var(--r-sm); font-size:20px; color:var(--txt); display:grid; place-items:center; }
  .cal-nav > button:not(.btn):active { background:var(--card2); }
  .cal-title { font-weight:800; font-size:16px; min-width:132px; text-align:center; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-wd { text-align:center; font-size:11px; color:var(--muted); font-weight:700; padding:0 0 2px; }
  .cal-cell { min-height:58px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm); padding:5px 4px 4px; cursor:pointer; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
  .cal-cell.empty { background:transparent; border:none; cursor:default; }
  .cal-cell.today { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .cal-cell .cal-d { font-size:12.5px; font-weight:600; color:var(--muted); }
  .cal-cell.today .cal-d { color:var(--accent-text); }
  .cal-cell.has { background:var(--card2); }
  .cal-dots { display:flex; flex-wrap:wrap; gap:3px; }
  .cal-dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .cal-cell.past { opacity:.5; }
  .cal-cell.today.past { opacity:1; }
  .cal-legend { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:10px 0 2px; font-size:11.5px; color:var(--muted); }
  .cal-legend span { display:inline-flex; align-items:center; gap:5px; }
  .cal-legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  @media (hover:hover){ .cal-cell.has:hover { border-color:var(--accent); } }
  @media (max-width:560px){ .cal-cell { min-height:48px; } .cal-grid { gap:3px; } }
  .due-box { background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:var(--r-lg); padding:12px 14px; margin-bottom:12px; }
  .due-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; color:var(--warn-txt); font-size:14px; }
  .due-row { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px dashed var(--warn-line); }
  .due-row:first-of-type { border-top:none; }

  .day-head { display:flex; justify-content:space-between; padding:15px 6px 7px; }
  .day-head .d { font-weight:700; font-size:14px; }
  .day-head .s { color:var(--muted); font-size:13px; }
  .op { display:flex; align-items:center; gap:12px; padding:12px 15px; background:var(--card); border-radius:var(--r-lg); margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer; }
  .op:active { background:var(--card2); transform:scale(.995); }
  .cat-ic { width:44px; height:44px; border-radius:var(--r-md); display:grid; place-items:center; font-size:21px; flex:0 0 auto; color:#fff; }
  .op .oi { flex:1; min-width:0; }
  .op .ot { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .op .os { color:var(--muted); font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .op .oa { font-weight:800; white-space:nowrap; font-size:16px; }
  /* Мультивыбор операций (0.14.0) */
  .sel-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 2px 10px; padding:8px 10px; background:var(--card); border-radius:var(--r-md); box-shadow:var(--shadow); }
  .sel-bar > span { margin-right:auto; font-weight:700; font-size:13.5px; }
  .op.op-pick { cursor:pointer; }
  .op.op-pick.on { background:var(--accent-soft); }
  .op-chk { flex:0 0 22px; width:22px; height:22px; border-radius:7px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--on-accent); font-size:13px; font-weight:800; }
  .op.op-pick.on .op-chk { background:var(--accent-solid); border-color:var(--accent-solid); }
  /* Разделяем соседние иконки-кнопки, чтобы не промахиваться (особенно удаление рядом с восстановлением) */
  .icon-btn + .icon-btn { margin-left:8px; }
  /* Аффорданс свайп-удаления операции: при свайпе строка краснеет и показывает 🗑 */
  .op.swiping { background:var(--red-soft) !important; }
  .op.swiping::after { content:'🗑'; position:absolute; top:0; bottom:0; right:16px; display:flex; align-items:center; font-size:18px; opacity:.85; pointer-events:none; }

  .empty { text-align:center; color:var(--muted); padding:44px 20px; }
  .empty.inline { padding:22px 16px; }   /* компактная заглушка внутри секции/карточки */
  .empty .big { font-size:44px; margin-bottom:10px; }
  /* Утилиты (замена повторяющихся инлайнов) */
  .nowrap-strong { font-weight:800; white-space:nowrap; }
  .ta-r { text-align:right; }
  .prog.sm { height:7px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--accent-solid); color:var(--on-accent);
    font-weight:700; border-radius:var(--r-md); padding:14px 16px; font-size:15px; width:100%; min-height:var(--tap); box-shadow:0 4px 12px var(--accent-glow); }
  .btn:active { transform:scale(.98); }
  .btn.sec { background:var(--card2); color:var(--txt); box-shadow:none; }
  .btn.danger { background:var(--danger-bg); color:var(--danger-txt); box-shadow:none; }
  .btn.small { padding:9px 13px; font-size:13.5px; width:auto; min-height:0; box-shadow:none; }
  /* В плотных рядах действий (мультивыбор, «Пора внести») поднимаем тап-цель до 44px — a11y */
  .sel-bar .btn.small, .due-top .btn.small, .due-row .btn.small { min-height:var(--tap); }
  .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Account & envelope rows */
  .acc { display:flex; align-items:center; gap:13px; padding:14px 15px; background:var(--card); border-radius:var(--r-lg); margin-bottom:9px; box-shadow:var(--shadow); }
  .acc .info { flex:1; min-width:0; }
  .acc .name { font-weight:600; display:flex; flex-wrap:wrap; gap:3px 7px; align-items:center; }   /* длинная плашка («инвест · 10% сверху») уходит под название целиком, а не сжимает его */
  .acc .name .nm { min-width:0; overflow-wrap:anywhere; }
  .acc .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .acc .bal { text-align:right; font-weight:800; white-space:nowrap; }
  .acc .bal small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .env { display:flex; align-items:center; gap:12px; padding:12px 15px; background:var(--card); border-radius:var(--r-lg); margin-bottom:8px; box-shadow:var(--shadow); }
  .env .dot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .env .info { flex:1; min-width:0; }
  .env .name { font-weight:600; }
  .env .pct { color:var(--muted); font-size:12px; margin-top:2px; }
  .env .bal { text-align:right; font-weight:700; white-space:nowrap; }
  .env .bal small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .badge { font-size:10.5px; padding:3px 8px; border-radius:999px; background:var(--card2); color:var(--muted); font-weight:700; }
  .badge.inv { color:var(--inv-txt); background:var(--inv-bg); }

  .total-card { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color:var(--on-grad); border-color:transparent; box-shadow:0 8px 22px var(--header-shadow); }
  .total-card .l { font-size:13px; font-weight:600; }
  .total-card .a { font-size:clamp(26px,8vw,34px); font-weight:800; margin-top:3px; letter-spacing:-.5px; overflow-wrap:anywhere; }
  .total-card .cur { margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; }
  .total-card .cur .b { background:var(--ov); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row + .row { margin-top:10px; }

  /* Analysis */
  .donut-wrap { display:flex; justify-content:center; padding:6px 0 2px; }
  .cat-line { display:flex; align-items:center; gap:12px; padding:10px 2px; }
  .cat-line .ci { width:36px; height:36px; border-radius:var(--r-md); display:grid; place-items:center; font-size:17px; color:#fff; flex:0 0 auto; }
  .cat-line .cinfo { flex:1; min-width:0; }
  .cat-line .cname { font-weight:600; font-size:14.5px; display:flex; justify-content:space-between; gap:8px; }
  .cat-line .bar { height:7px; border-radius:4px; background:var(--card2); margin-top:6px; overflow:hidden; }
  .cat-line .bar > i { display:block; height:100%; border-radius:4px; }
  .cat-line .cpct { color:var(--muted); font-size:12px; font-weight:700; min-width:46px; text-align:right; }
  .mchart { display:flex; align-items:flex-end; gap:6px; height:120px; padding:6px 2px 0; }
  .mcol { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; cursor:pointer; padding-top:4px; }
  .mcol.active { background:var(--card2); border-radius:var(--r-md); }
  .mcol .mbars { flex:1; display:flex; align-items:flex-end; gap:3px; width:100%; justify-content:center; }
  .mcol .mb { width:30%; max-width:15px; border-radius:5px 5px 0 0; min-height:2px; }
  .mcol .mb.inc { background:var(--green); } .mcol .mb.exp { background:var(--red); }
  .mcol .mlab { font-size:11px; color:var(--muted); font-weight:600; }
  .mcol.active .mlab { color:var(--txt); }
  .legend { display:flex; gap:16px; justify-content:center; margin-top:8px; font-size:12px; color:var(--muted); }
  .legend .lg { display:flex; align-items:center; gap:5px; }
  .legend .lg i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .mini-seg { display:flex; gap:4px; margin-bottom:8px; background:var(--card2); border-radius:var(--r-md); padding:4px; }
  .mini-seg button { flex:1; padding:8px; min-height:var(--tap); border-radius:var(--r-sm); font-size:12.5px; font-weight:700; color:var(--muted); background:transparent; }
  .mini-seg button.active { background:var(--card); color:var(--txt); box-shadow:var(--shadow); }

  .seg { display:flex; background:var(--card2); border-radius:var(--r-md); padding:4px; gap:4px; }
  .seg button { flex:1; padding:11px; border-radius:var(--r-sm); font-weight:700; font-size:14px; color:var(--muted); }
  .seg button.active { background:var(--card); color:var(--txt); box-shadow:var(--shadow); }

  label.field { display:block; margin-bottom:14px; }
  label.field > span { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .input, select.input, textarea.input { width:100%; background:var(--card2); border:1.5px solid transparent; color:var(--txt);
    border-radius:var(--r-md); padding:13px 14px; outline:none; }
  .input:focus { border-color:var(--accent); background:var(--input-focus-bg); }
  textarea.input { resize:vertical; min-height:60px; }
  .two { display:grid; grid-template-columns:1fr 116px; gap:10px; }
  .two-eq { grid-template-columns:1fr 1fr; }   /* равные колонки — для диапазонов «с/по», «от/до» */
  .bal-tag { font-size:10px; font-weight:800; color:var(--red); text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }
  /* Режим повышенного контраста ОС: приближаем приглушённый текст к основному и усиливаем линии — во всех 9 темах сразу */
  @media (prefers-contrast: more) {
    :root, html[data-theme] { --muted: color-mix(in srgb, var(--txt) 72%, var(--bg)); --line: color-mix(in srgb, var(--txt) 32%, var(--bg)); --card-border: color-mix(in srgb, var(--txt) 32%, var(--bg)); }
    .echip, .chip, .scope-btn, .input { border-width:2px; }
    :focus-visible { outline-width:3px; }
  }
  .three { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Нижняя навигация (телефон): Главная · Операции · ＋ · Счета · Ещё. Анализ и прочее — в «Ещё». Подписи 12px, зона нажатия ≥44px. */
  nav.tabbar { position:fixed; left:50%; transform:translateX(-50%); width:100%; max-width:640px; bottom:0; z-index:25; background:var(--card);
    border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + var(--safe-b)); align-items:center; gap:2px;
    box-shadow:0 -4px 18px rgba(40,50,80,.06); }
  nav.tabbar button.tab { flex:1 1 0; min-width:0; min-height:var(--tap); color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:12px; padding:5px 2px; font-weight:600; border-radius:var(--r-md); }
  nav.tabbar button.tab .ic { width:24px; height:24px; }
  nav.tabbar button.tab .tl { line-height:1.1; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  nav.tabbar button.tab.active { color:var(--accent-text); font-weight:700; }
  nav.tabbar button.tab.active .ic { stroke-width:2.1; }
  .addbtn { flex:0 0 auto; width:54px; height:54px; border-radius:50%; margin:0 8px;
    background: linear-gradient(135deg, var(--grad1), var(--grad2)); color:var(--on-grad); display:grid; place-items:center;
    box-shadow:0 8px 20px var(--accent-glow-strong); }
  .addbtn .ic { stroke-width:2.2; }
  .addbtn:active { transform:scale(.94); }

  /* ===== Боковая навигация (только ПК) ===== */
  .sidenav { display:none; }
  .sidenav .sn-brand { display:flex; align-items:center; gap:11px; padding:2px 10px 20px; font-weight:800; font-size:18px; letter-spacing:.2px; }
  .sidenav .sn-logo { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:var(--on-grad);
    background:linear-gradient(135deg,var(--grad1),var(--grad2)); box-shadow:0 6px 16px var(--header-shadow); flex:0 0 auto; }
  .sidenav .sn-nav { display:flex; flex-direction:column; gap:3px; }
  .sidenav .snav { display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:11px 14px; border-radius:var(--r-md);
    color:var(--muted); font-weight:600; font-size:15px; min-height:46px; }
  .sidenav .snav .si { width:24px; height:24px; display:grid; place-items:center; flex:0 0 auto; }
  .sidenav .snav.active { background:var(--accent-soft); color:var(--accent-text); font-weight:700; }
  .sidenav .snav.active .ic { stroke-width:2.1; }
  .sidenav .sn-sp { flex:1 1 auto; min-height:8px; }
  .sidenav .sn-add { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:12px; width:100%;
    background:linear-gradient(135deg,var(--grad1),var(--grad2)); color:var(--on-grad); font-weight:700; font-size:15px;
    border-radius:var(--r-md); padding:14px; min-height:var(--tap); box-shadow:0 8px 20px var(--accent-glow-strong); }
  .sidenav .sn-add:active { transform:scale(.98); }
  .sidenav .sn-ver { text-align:center; color:var(--muted); font-size:11px; opacity:.7; padding-top:14px; }
  .sidenav .sn-sep { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:14px 10px 5px; font-weight:700; }
  @media (hover:hover){ .sidenav .snav:not(.active):hover { background:var(--card2); color:var(--txt); } .sidenav .sn-add:hover { filter:brightness(1.05); } }

  /* ===== Десктопная раскладка: сайдбар + широкий контент, нижний таб-бар скрыт ===== */
  @media (min-width:980px) {
    nav.tabbar { display:none !important; }
    .sidenav { display:flex; flex-direction:column; gap:3px; position:fixed; top:0; left:0; bottom:0; width:var(--sbw);
      background:var(--card); border-right:1px solid var(--line); padding:22px 14px calc(18px + var(--safe-b)); z-index:30; overflow-y:auto; }
    body { padding-bottom:28px; padding-left:var(--sbw); }
    /* Шапка — аккуратный баннер в колонке контента, а не заливка на всю ширину */
    header { position:static; width:calc(100% - 48px); max-width:calc(var(--content-max) - 48px); margin:18px auto 0; padding:18px 24px;
      border-radius:var(--r-xl); box-shadow:0 10px 28px var(--header-shadow); }
    header .h-top, header .h-sum, header .h-free { padding-left:0; padding-right:0; }
    main { max-width:var(--content-max); padding:18px 24px 44px; margin:0 auto; }
    .sheet { left:var(--sbw); max-width:560px; border-radius:var(--r-xl); }
    .cf-back { left:var(--sbw); }
    /* Счета — две колонки: слева сводка, справа счета/конверты */
    .acc-cols { display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:start; }
    /* Анализ — карточки в две колонки (masonry) */
    .ana-cols { column-count:2; column-gap:18px; }
    .ana-cols > * { break-inside:avoid; }
    /* Операции на ПК — таблица: значок · название · счёт/конверт · сумма (колонки выровнены между строками) */
    #screen-ops .op { display:grid; grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) minmax(120px,auto); column-gap:16px; align-items:center; }
    #screen-ops .op .oi { display:contents; }
    #screen-ops .op .ot { grid-column:2; } #screen-ops .op .os { grid-column:3; margin-top:0; font-size:13.5px; } #screen-ops .op .oa { grid-column:4; text-align:right; }
    #screen-ops .op.op-pick { grid-template-columns:26px 40px minmax(0,1.3fr) minmax(0,1fr) minmax(120px,auto); }
    #screen-ops .op.op-pick .ot { grid-column:3; } #screen-ops .op.op-pick .os { grid-column:4; } #screen-ops .op.op-pick .oa { grid-column:5; }
  }

  /* ===== Главная (дашборд) =====
     Три уровня: ГЛАВНОЕ (свободные деньги и ориентир, итоги месяца, последние операции) → КОНТРОЛЬ (конверты, бюджет, платежи) → ДОПОЛНИТЕЛЬНОЕ (сворачиваемые блоки).
     Выразительна только главная карточка; списки плоские (общая карточка + разделители). */
  .inl { display:inline-flex; align-items:center; gap:6px; }
  .home-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:2px 2px 14px; }
  .home-title { font-size:22px; font-weight:800; letter-spacing:.1px; line-height:1.2; }
  /* Лёгкий заголовок экрана в контенте (вместо оранжевого баннера на Счетах/Ещё) */
  .scr-title { font-size:22px; font-weight:800; letter-spacing:.1px; margin:2px 2px 12px; line-height:1.2; }
  .home-subtitle { color:var(--muted); font-size:13px; margin-top:2px; }
  .sync-line { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin:-2px 2px 12px; cursor:pointer; min-height:28px; }
  .sync-line.warn { color:var(--red); font-weight:600; }

  /* Заголовки секций на «Счетах» — в той же шкале, что и на главной (19px, без капса); подписи-капсы остаются только внутри карточек отчётов */

  .home-duo { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0;
    padding:8px 16px calc(20px + var(--safe-b)); max-height:94vh; overflow-y:auto; transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.9,.25,1); max-width:640px; margin:0 auto; box-shadow:var(--shadow-lift); }

  .amount-disp { text-align:center; font-size:clamp(28px,9vw,40px); font-weight:800; letter-spacing:-1px; padding:2px 0; overflow-wrap:anywhere; }

    border:1.5px solid var(--line); font-size:13.5px; font-weight:600; white-space:nowrap; box-shadow:var(--shadow); }

    background:var(--card2); color:var(--accent-text); font-size:13px; font-weight:700; }
  .cat-toggle:active { background:var(--accent-soft); }
  .icon-btn.fav { color:#e0a80b; }
  .fund-list { display:flex; flex-direction:column; gap:7px; }
  .fund-row { display:flex; align-items:center; gap:11px; padding:11px 14px; background:var(--card); border:1.5px solid var(--line);
    border-radius:var(--r-md); box-shadow:var(--shadow); cursor:pointer; font-weight:600; }
  .fund-row.on { border-color:var(--accent); background:var(--accent-soft); }
  .fund-row .chk { width:24px; height:24px; border-radius:var(--r-xs); border:2px solid var(--line); display:grid; place-items:center;
    color:var(--on-accent); font-size:14px; flex:0 0 auto; }

  .entry-bar { display:flex; gap:8px; margin-top:12px; }

  .sheet .entry-save { padding:12px 16px; font-size:14.5px; margin-top:10px; }
  /* Перенос суммы/клавиатуры вверх + закреплённый подвал с датой и «Сохранить» (0.10.0) */
  .quick-cat { margin:2px 0 12px; }
  .cur-top { display:flex; justify-content:center; margin:2px 0 6px; }
  .cur-top .input { flex:0 0 130px; text-align:center; }
  .entry-foot { position:sticky; bottom:0; z-index:2; display:flex; gap:8px; align-items:center;
    margin:14px -16px calc(-20px - var(--safe-b)); padding:10px 16px calc(12px + var(--safe-b));
    background:var(--bg); border-top:1px solid var(--line); box-shadow:0 -8px 18px rgba(0,0,0,.05); }
  /* 1.1.0: у шторки с липкой панелью «Сохранить» нижний отступ живёт внутри самой панели (там уже есть safe-area) — иначе под панелью просвечивало содержимое */
  .sheet:has(.entry-foot) { padding-bottom:0; }

  .list-item { display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); }

  .icon-btn { background:var(--card2); color:var(--muted); width:var(--tap); height:var(--tap); border-radius:var(--r-sm); display:grid; place-items:center; font-size:16px; flex:0 0 auto; }

  .chips { display:flex; gap:8px; flex-wrap:wrap; }

  .info-line { background:var(--accent-soft); color:var(--accent-text); border-radius:var(--r-md); padding:10px 13px; font-size:13px; margin:8px 0; font-weight:600; }
  .notice-btn { flex:0 0 auto; background:var(--red); color:#fff; border-radius:var(--r-sm); padding:8px 13px; font-size:12.5px; font-weight:700; white-space:nowrap; }
  .notice-btn:active { opacity:.85; }
  .notice-link { color:var(--accent-text); font-weight:700; cursor:pointer; text-decoration:underline; }
  /* ===== Плоские списки и группы (1.1.0) =====
     Строки одной группы живут в ОБЩЕЙ карточке и разделены тонкими линиями — вместо отдельной тени и рамки у каждой строки. */
  .list { background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg); overflow:hidden; margin-bottom:var(--sp-3); box-shadow:var(--shadow-sm); }
  .list > .menu-item, .list > .op, .list > .acc, .list > .env, .list > .he-row, .list > .li { background:transparent; box-shadow:none; border-radius:0; margin:0; }

  .list .cat-ic { width:40px; height:40px; font-size:19px; border-radius:var(--r-md); }
  .msec { margin:0; padding-top:var(--sp-4); break-inside:avoid; }   /* padding, а не margin: отступ сверху не «съедается» на границе колонок на ПК */
  .msec-t { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:0 6px 8px; }
  .more-grid { margin-top:-10px; }
  .menu-item { display:flex; align-items:center; gap:13px; padding:11px 14px; min-height:60px; background:var(--card); border-radius:var(--r-lg); margin-bottom:9px; box-shadow:var(--shadow); font-weight:600; cursor:pointer; }
  .menu-item:active { background:var(--card2); }
  .menu-item .mi { width:38px; height:38px; border-radius:var(--r-sm); background:var(--accent-soft); color:var(--accent-text); display:grid; place-items:center; flex:0 0 auto; }
  .menu-item .mtx { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .menu-item .mlbl { font-size:15.5px; line-height:1.25; }
  .menu-item .mh { font-size:13px; font-weight:500; color:var(--muted); line-height:1.3; }
  .menu-item .mh.warn { color:var(--red); font-weight:600; }
  .menu-item .ar { margin-left:auto; color:var(--muted); display:grid; place-items:center; flex:0 0 auto; }
  .menu-item.danger .mi { background:var(--red-soft); color:var(--red); }
  .menu-item.danger .mlbl { color:var(--red); }
  .more-danger { margin-top:var(--sp-2); }
  /* Кнопка «закрепить на боковой панели» — только на ПК (на телефоне сайдбара нет) */
  .pin-btn { display:none; width:40px; height:40px; border-radius:var(--r-sm); color:var(--muted); opacity:.85; flex:0 0 auto; }
  .pin-btn.on { opacity:1; color:var(--accent-text); }
  @media (hover:hover){ .pin-btn:hover { opacity:1; background:var(--card2); } }
  @media (min-width:980px){ .pin-btn { display:inline-grid; place-items:center; } .more-grid { column-count:2; column-gap:24px; } }
  .back-btn { display:inline-flex; align-items:center; gap:4px; color:var(--accent-text); font-weight:700; margin:0 0 6px -6px; padding:0 10px 0 4px; min-height:var(--tap); font-size:15px; border-radius:var(--r-sm); }

  /* Выбор темы оформления */
  .theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .theme-card { background:var(--card); border:2px solid var(--card-border); border-radius:var(--r-lg); padding:10px; box-shadow:var(--shadow); cursor:pointer; transition:.15s; }
  .theme-card:active { transform:scale(.98); }
  .theme-card.on { border-color:var(--accent); }
  .theme-prev { position:relative; height:74px; border-radius:var(--r-md); overflow:hidden; border:1px solid rgba(128,128,128,.14); }
  .theme-prev .tp-bar { position:absolute; top:0; left:0; right:0; height:22px; }
  .theme-prev .tp-dot { position:absolute; top:32px; left:12px; width:20px; height:20px; border-radius:7px; }
  .theme-prev .tp-line { position:absolute; left:40px; top:36px; height:6px; width:44%; border-radius:3px; }
  .theme-prev .tp-line.short { top:48px; width:30%; }
  .theme-meta { display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-top:9px; padding:0 3px; }
  .theme-meta .tn { font-weight:700; font-size:14px; color:var(--txt); }
  .theme-meta .th { font-size:11.5px; color:var(--muted); }

  /* Цели / прогресс / план / теги */
  .prog { height:9px; border-radius:5px; background:var(--card2); overflow:hidden; margin-top:8px; }
  .prog > i { display:block; height:100%; border-radius:5px; background:var(--accent); transition:width .3s; }
  .goal-top { display:flex; align-items:center; gap:11px; }
  .goal-ic { width:42px; height:42px; border-radius:var(--r-md); display:grid; place-items:center; font-size:21px; color:#fff; flex:0 0 auto; }
  .plan-row { display:flex; justify-content:space-between; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:14.5px; }
  .plan-row:last-child { border-bottom:none; }
  .plan-row.total { border-top:2px solid var(--line); border-bottom:none; font-weight:800; padding-top:12px; margin-top:2px; font-size:16px; }
  .plan-row .lab { color:var(--muted); display:flex; align-items:center; gap:8px; }
  .plan-row.total .lab { color:var(--txt); }
  .tag-chip { display:inline-block; background:var(--accent-soft); color:var(--accent-text); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; margin:3px 5px 0 0; }
  .preview-line { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .preview-line:last-child { border-bottom:none; }
  .preview-box { background:var(--card); border-radius:var(--r-md); padding:4px 15px; box-shadow:var(--shadow); }
  .toast { position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(94px + var(--safe-b));
    background:var(--toast-bg); color:var(--toast-txt); padding:12px 18px; border-radius:var(--r-md); z-index:60; font-size:14px; font-weight:600; opacity:0; transition:.25s;
    box-shadow:var(--shadow-lift); pointer-events:none; display:flex; align-items:center; gap:14px; max-width:calc(100% - 32px); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast .toast-undo { color:color-mix(in srgb, var(--accent) 45%, var(--toast-txt)); background:none; font-weight:800; font-size:14px; padding:2px 4px; white-space:nowrap; }
  .op { position:relative; touch-action:pan-y; }
  .op.swiping { transition:none; }

  #splash { position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; transition:opacity .45s ease; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash .sp-bars { display:flex; align-items:flex-end; gap:9px; height:74px; }
  #splash .sp-bars i { width:16px; height:100%; border-radius:6px; transform:scaleY(.3); transform-origin:bottom;
    background:linear-gradient(180deg, var(--grad1), var(--accent-d)); animation:spbar 1s ease-in-out infinite; }
  #splash .sp-bars i:nth-child(2){ animation-delay:.12s } #splash .sp-bars i:nth-child(3){ animation-delay:.24s }
  #splash .sp-bars i:nth-child(4){ animation-delay:.36s } #splash .sp-bars i:nth-child(5){ animation-delay:.48s }
  @keyframes spbar { 0%,100%{ transform:scaleY(.28) } 50%{ transform:scaleY(1) } }
  #splash .sp-name { font-size:25px; font-weight:800; color:var(--txt); letter-spacing:.3px; }
  #splash .sp-sub { font-size:12px; color:var(--muted); margin-top:-10px; letter-spacing:3px; text-transform:uppercase; }

<!-- Денежное ядро (валюты, балансы, распределение дохода) — единый источник для index.html и tests.html. Грузится ПЕРЕД основным скриптом. -->
<script src="core.js"></script>
<script>
"use strict";
/* =================================================================
   Конверты — учёт денег. Счета + конверты. Локальное хранение.
   ================================================================= */
const LS_KEY = 'konverty_state_v3';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
// Иконка интерфейса из спрайта (<symbol id="i-…"> в начале <body>): ic('home'), ic('chevr','sm'). Размеры: xs 16 · sm 18 · (22) · lg 26. aria-hidden — смысл несёт подпись рядом.
const ic = (name, cls) => `<svg class="ic${cls?' '+cls:''}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

/* ---------- Категории (в стиле ZenMoney) ---------- */
const CATEGORY_SEED = [
  ['Продукты','🛒','#17a877','expense'],['Кафе и рестораны','🍽️','#f59e0b','expense'],
  ['Транспорт','🚌','#3b82f6','expense'],['Автомобиль','🚗','#64748b','expense'],
  ['Жильё и ЖКХ','🏠','#8b5cf6','expense'],['Связь и интернет','📱','#06b6d4','expense'],
  ['Одежда и обувь','👕','#ec4899','expense'],['Здоровье','💊','#ef4444','expense'],
  ['Красота','💇','#f472b6','expense'],['Развлечения','🎬','#f43f5e','expense'],
  ['Путешествия','✈️','#0ea5e9','expense'],['Техника','💻','#6366f1','expense'],
  ['Образование','📚','#eab308','expense'],['Дети','🧸','#f97316','expense'],
  ['Спорт','🏋️','#84cc16','expense'],['Питомцы','🐾','#a16207','expense'],
  ['Подарки','🎁','#d946ef','expense'],['Подписки','🔄','#14b8a6','expense'],
  ['Прочее','💸','#94a3b8','expense'],
  ['Зарплата','💰','#17a877','income'],['Аванс','💵','#10b981','income'],
  ['Премия','🏆','#f59e0b','income'],['Подработка','🧑‍💻','#3b82f6','income'],
  ['Проценты и вклады','📈','#22c55e','income'],['Подарок','🎁','#ec4899','income'],
  ['Кэшбэк и возвраты','↩️','#06b6d4','income'],['Прочее','➕','#94a3b8','income']
];
// P6: сразу отмечаем самые частые категории как «основные» (⭐), чтобы первый ввод не был стеной иконок.
const FAV_SEED = new Set(['Продукты','Кафе и рестораны','Транспорт','Жильё и ЖКХ','Развлечения','Зарплата']);
const buildCategories = () => CATEGORY_SEED.map(([name,icon,color,kind]) => ({id:uid(),name,icon,color,kind,fav:FAV_SEED.has(name)}));

function defaultState() {
  const e = (name,percent,color) => ({id:uid(),name,percent,color,archived:false});
  const a = (name,icon,color,currency,investment,offTopPercent) => ({id:uid(),name,icon,color,currency,investment,offTopPercent,archived:false});
  return {
    version: 3,
    categoriesVersion: 3,
    baseCurrency: 'KZT',
    currencies: [ {code:'KZT',symbol:'₸',rate:1}, {code:'USD',symbol:'$',rate:480}, {code:'EUR',symbol:'€',rate:520} ],
    accounts: [
      a('Карта','💳','#5b8def','KZT',false,0),
      a('Наличные','💵','#29b083','KZT',false,0),
      a('Инвест/крипта','📈','#e0a80b','USD',true,10)
    ],
    envelopes: [
      e('Обязательные',50,'#5b8def'),
      e('Продукты',25,'#29b083'),
      e('Развлечения',10,'#ef5f68'),
      e('Цели / накопления',15,'#7b5cff')
    ],
    categories: buildCategories(),
    transactions: [],
    debts: [],
    recurring: [],
    goals: [],
    events: [],
    watchlists: [],
    templates: [],
    tombstones: {},          // {id: ts} — удалённые сущности, чтобы синхронизация их не воскрешала
    debtBudget: 0,
    debtStrategy: 'snowball',
    overAllocBaseline: 0,
    epoch: 0,                // эпоха осознанной замены всех данных (восстановление/импорт/сброс): по ней другие устройства отличают решение владельца от «потерянного обновления»
    ratesUpdated: null
  };
}

/* ---------- Загрузка / сохранение ---------- */
let state;
let dataStamp=0, _balCache=null, _balCacheAt=-1;   // штамп изменений данных + мемоизация балансов
const APP_VERSION='1.1.0';  // РЕЛИЗ 1.x. Патч — мелкая правка, минор — крупное изменение (1.1.0: обновление интерфейса — главная в три уровня, нижняя навигация, «Ещё» по группам, единые значки, контраст).
const BUILD='2026-11-05';    // дата сборки — меняется каждый релиз, чтобы было видно, подгрузилось ли обновление
function load() {
  let raw=null;
  try { raw = localStorage.getItem(LS_KEY); if (raw) { state = JSON.parse(raw); normalize(); return; } } catch(e){ console.warn(e);
    // Данные были, но повреждены — сохраняем сырой слепок под отдельный ключ, чтобы не потерять без следа при сбросе к дефолту.
    try { if(raw) localStorage.setItem(LS_KEY+'_corrupt_'+Date.now(), raw); } catch(_){}
  }
  state = defaultState(); save();
}
function normalize() {
  const d = defaultState();
  state = Object.assign({}, d, state);
  // H4: санитайз валют. code/symbol рендерятся сыро и идут в onclick; форма ограничена maxlength, но импорт/синхронизация её минуют → stored XSS. Чистим здесь.
  { const cleanCode=s=>String(s==null?'':s).replace(/[^A-Za-z0-9]/g,'').slice(0,5).toUpperCase();
    const cleanSym=s=>String(s==null?'':s).replace(/[<>&"'\x60]/g,'').slice(0,6);
    const arr=Array.isArray(state.currencies)?state.currencies:d.currencies;
    state.currencies = arr.filter(c=>c&&typeof c==='object')
      .map(c=>{ const r=+c.rate; return Object.assign({ code:cleanCode(c.code), symbol:cleanSym(c.symbol)||'¤', rate:(isFinite(r)&&r>0)?r:0 }, typeof c.manual==='boolean'?{manual:c.manual}:{}); })   // manual:true — курс задан владельцем (автообновление его не трогает); manual:false — владелец явно снял пометку (слияние это уважает); без поля normalize стирал бы пометку при каждой загрузке
      .filter(c=>c.code);
    if(!state.currencies.length) state.currencies = d.currencies.slice();
    state.baseCurrency = cleanCode(state.baseCurrency) || d.baseCurrency;
    if(!state.currencies.some(c=>c.code===state.baseCurrency)) state.baseCurrency = state.currencies[0].code; }
  state.accounts ||= d.accounts;
  state.envelopes ||= d.envelopes;
  state.categories ||= d.categories;
  state.transactions ||= [];
  state.debts ||= [];
  state.recurring ||= [];
  state.goals ||= [];
  state.events ||= [];
  state.watchlists ||= [];
  state.templates ||= [];
  // Надгробия удалений (для синхронизации): объект {id:ts}. Чистим старше 120 дней, чтобы не разрастались.
  state.tombstones = (state.tombstones && typeof state.tombstones==='object') ? state.tombstones : {};
  { const cutoff=Date.now()-400*864e5; for(const id in state.tombstones){ const ts=+state.tombstones[id]||0; if(ts && ts<cutoff) delete state.tombstones[id]; } }   // P1: надгробия лёгкие — держим ~13 мес, чтобы редко-подключаемое устройство не воскрешало удалённое
  // H6 (безопасность): id сущностей → безопасный набор (импорт/синк могут принести опасные id → инъекция в onclick/атрибуты). Чистые данные (uid=base36) не меняются.
  sanitizeIds(state, uid);
  // Валюты сущностей: чистим набор символов, подставляем базовую при неизвестном коде — защита рендера и пересчётов от мусора из импорта.
  { const cleanCur=c=>{ c=String(c==null?'':c).replace(/[^A-Za-z0-9]/g,'').slice(0,5).toUpperCase(); return c||state.baseCurrency; };   // UPPERCASE — как коды в списке валют (иначе «usd» оценивался бы по курсу 1)
    state.accounts.forEach(a=>{ a.currency=cleanCur(a.currency); });
    state.goals.forEach(g=>{ g.currency=cleanCur(g.currency); });
    state.debts.forEach(d=>{ d.currency=cleanCur(d.currency); });
    (state.events||[]).forEach(ev=>{ ev.currency=cleanCur(ev.currency); });
    state.transactions.forEach(t=>{ if(t.currency) t.currency=cleanCur(t.currency); if(t.fromCurrency) t.fromCurrency=cleanCur(t.fromCurrency); if(t.toCurrency) t.toCurrency=cleanCur(t.toCurrency);
      if(t.accountCredits && typeof t.accountCredits==='object') for(const k in t.accountCredits){ const cr=t.accountCredits[k]; if(cr && typeof cr==='object' && cr.cur) cr.cur=cleanCur(cr.cur); } }); }   // валюта зачисления дохода — по тем же правилам, что и остальные ссылки на валюту
  state.debtStrategy ||= 'snowball';
  state.debtBudget = state.debtBudget || 0;
  state.overAllocBaseline = state.overAllocBaseline || 0;
  state.rev = +state.rev || 0;   // ревизия данных (wall-clock) для синхронизации — побеждает более позднее изменение
  state.epoch = Math.max(0, +state.epoch || 0);   // эпоха осознанной замены данных (см. defaultState)
  state.rateHistory = (state.rateHistory && typeof state.rateHistory==='object') ? state.rateHistory : {};
  { const rk=Object.keys(state.rateHistory).sort(); if(rk.length>800) for(const k of rk.slice(0,rk.length-800)) delete state.rateHistory[k]; }
  // H3: санитайзинг иконок/цветов (импорт/бэкап могут содержать HTML → stored XSS). Всё, что рендерится сырым, чистим здесь.
  const cleanColor=(c,def)=>/^#[0-9a-fA-F]{3,8}$/.test(String(c||''))?c:def;
  const cleanIcon=(s,def)=>{ s=String(s==null?'':s); return (/[<>&"']/.test(s)||s.length>6)?def:(s||def); };
  state.accounts.forEach(a => { a.archived=!!a.archived; a.investment=!!a.investment; a.excluded=!!a.excluded; a.offTopPercent=Math.max(0,Math.min(100,a.offTopPercent||0)); a.deposit=!!a.deposit; a.rate=Math.max(0,Math.min(1000,+a.rate||0)); a.currency = a.currency || state.baseCurrency; a.color=cleanColor(a.color,'#5b8def'); a.icon=cleanIcon(a.icon,'💳'); a.group=String(a.group||'').slice(0,40); });
  state.envelopes.forEach(e => { e.archived=!!e.archived; e.noOwe=!!e.noOwe; delete e.offTop; e.color=cleanColor(e.color,'#5b8def'); e.monthlyTarget=Math.max(0, round2(e.monthlyTarget||0)); e.monthlyLimit=Math.max(0, round2(e.monthlyLimit||0)); e.icon=e.icon||'✉️'; });
  state.categories.forEach(c => { if (c.kind==='expense') c.limit = c.limit||0; c.fav = !!c.fav; c.color=cleanColor(c.color,'#94a3b8'); c.icon=cleanIcon(c.icon,'🏷️'); });
  // P8: разовая миграция старых «лимитов категорий» в единый инструмент «Лимиты и наблюдение».
  state.categories.forEach(c => { if(c.kind==='expense' && c.limit>0){ if(!state.watchlists.some(w=>w.type==='category'&&w.value===c.id)) state.watchlists.push({id:uid(),type:'category',value:c.id,target:round2(c.limit)}); c.limit=0; } });
  state.recurring.forEach(r => { r.active = r.active!==false; r.day = Math.max(1, Math.min(31, r.day||1)); });
  state.goals.forEach(g => { g.saved = round2(g.saved||0); g.target = round2(g.target||0); g.currency = g.currency || state.baseCurrency; g.log ||= []; g.color=cleanColor(g.color,'#7b5cff'); g.icon=cleanIcon(g.icon,'🎯'); if(g.envelopeId && !state.envelopes.some(e=>e.id===g.envelopeId)) delete g.envelopeId; });
  state.debts.forEach(d => { d.rate = d.rate||0; d.payments ||= []; d.accountId = (d.accountId && acc(d.accountId)) ? d.accountId : null; d.payments.forEach(p=>{ p.accountId = (p.accountId && acc(p.accountId)) ? p.accountId : null; }); });
  // События календаря (планируемые подарки/праздники/разовые платежи с привязкой к конверту)
  state.events = (state.events||[]).filter(ev=>ev && /^\d{4}-\d{2}-\d{2}$/.test(ev.date||''));
  state.events.forEach(ev => { ev.amount=round2(ev.amount||0); ev.currency=ev.currency||state.baseCurrency; ev.done=!!ev.done; ev.title=String(ev.title||'').slice(0,80); ev.note=String(ev.note||'').slice(0,200); ev.envelopeId=(ev.envelopeId && state.envelopes.some(e=>e.id===ev.envelopeId))?ev.envelopeId:null; ev.icon=cleanIcon(ev.icon,'🎁'); });
  // M6: выбросить повреждённые транзакции (без типа/даты), иначе рендер падает в пустой экран.
  state.transactions = state.transactions.filter(t => t && typeof t==='object' && t.type && /^\d{4}-\d{2}-\d{2}$/.test(String(t.date||'')));
  // Санитайз split-расходов: валидные ссылки, положительные суммы; split имеет смысл от 2 частей.
  state.transactions.forEach(t=>{ if(t.type==='expense' && Array.isArray(t.splits)){
    t.splits = t.splits.map(s=>({ categoryId:(s.categoryId&&catById(s.categoryId))?s.categoryId:null, envelopeId:(s.envelopeId&&env(s.envelopeId))?s.envelopeId:null, amount:Math.max(0,round2(s.amount||0)) })).filter(s=>s.amount>0);
    if(t.splits.length<2) delete t.splits;
  }});
  // Защита от Infinity/NaN из импорта: нечисловые/бесконечные суммы → 0 (иначе «∞» в балансах).
  { const fin=n=>{ n=+n; return isFinite(n)?n:0; };
    state.transactions.forEach(t=>{ if(t.amount!=null) t.amount=fin(t.amount); if(t.fromAmount!=null) t.fromAmount=fin(t.fromAmount); if(t.toAmount!=null) t.toAmount=fin(t.toAmount);
      if(t.distribution) for(const k in t.distribution) t.distribution[k]=fin(t.distribution[k]);
      if(t.plan) for(const k in t.plan) t.plan[k]=fin(t.plan[k]);
      if(t.accountCredits) for(const k in t.accountCredits){ const cr=t.accountCredits[k]; if(typeof cr==='number') t.accountCredits[k]=fin(cr); else if(cr&&typeof cr==='object') cr.amt=fin(cr.amt); } }); }
  migrateCategories();
}
function migrateCategories() {
  if (state.categoriesVersion === 3) return;
  const have = new Set(state.categories.map(c => c.kind+'|'+c.name));
  for (const [name,icon,color,kind] of CATEGORY_SEED) if (!have.has(kind+'|'+name)) state.categories.push({id:uid(),name,icon,color,kind});
  state.categoriesVersion = 3;
}
let saveTimer, savePending=false;
function save() { dataStamp++; state.rev=Date.now(); savePending=true; clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); savePending=false; }catch(e){ toast('Ошибка сохранения'); } maybeAutoBackup(); syncPushDebounced(); }, 50); }
// Надгробия удалений — чтобы синхронизация не воскрешала удалённые записи. untomb — при отмене удаления (undo).
function tomb(id){ if(id==null) return; (state.tombstones ||= {})[String(id)]=Date.now(); }
function untomb(id){ if(id==null || !state.tombstones) return; delete state.tombstones[String(id)]; }
// M7: немедленно дописать отложенное сохранение при закрытии/сворачивании вкладки (иначе дебаунс 50мс теряется).
function flushSave(){ if(!savePending) return; clearTimeout(saveTimer); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); savePending=false; }catch(e){} }
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

/* =================================================================
   Резервные копии (IndexedDB, с фолбэком в localStorage).
   Хранятся локально; создаются раз в день и перед импортом/сбросом/восстановлением.
   ================================================================= */
const IDB_NAME='konverty_db', IDB_STORE='backups', BK_KEEP_AUTO=12, LS_BK='konverty_backups';
let _idbPromise=null, _lastAutoBk=0;
function idbOpen(){ if(_idbPromise) return _idbPromise;
  _idbPromise=new Promise((res,rej)=>{ try{
    if(!self.indexedDB){ rej(new Error('no-idb')); return; }
    // 1.0.6: зависшее открытие (известная беда iOS Safari) не должно навсегда повесить копии и удерживать замок операций — через 12 с считаем IDB недоступным (копии пойдут в запасное хранилище).
    const to=setTimeout(()=>rej(new Error('idb-open-timeout')), 12000);
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'}); };
    r.onsuccess=()=>{ clearTimeout(to); res(r.result); }; r.onerror=()=>{ clearTimeout(to); rej(r.error); };
  }catch(e){ rej(e); } });
  return _idbPromise; }
function _req(rq){ return new Promise((res,rej)=>{ rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function _bkStore(mode){ const db=await idbOpen(); const tx=db.transaction(IDB_STORE,mode);
  return { store:tx.objectStore(IDB_STORE), done:new Promise((res,rej)=>{ tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }) }; }
function _lsBackupsGet(){ try{ return JSON.parse(localStorage.getItem(LS_BK)||'[]'); }catch(e){ return []; } }
function _lsBackupsPut(list){ try{ localStorage.setItem(LS_BK, JSON.stringify(list.slice(-3))); return true; }catch(e){ return false; } }   // P0.2: честный успех/провал

async function createBackup(reason){
  const snap={ id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7), ts:new Date().toISOString(), reason:reason||'auto', app:APP_VERSION, data:JSON.stringify(state) };
  let ok=false;
  try{
    // 1) сохранить снапшот (отдельная транзакция)
    { const {store,done}=await _bkStore('readwrite'); store.put(snap); await done; }
    ok=true;   // IndexedDB-транзакция завершилась без ошибки
    // 2) вычислить лишние авто-копии (чтение — своя транзакция)
    const all=await getBackups();
    const autos=all.filter(b=>b.reason==='auto').sort((a,b)=>a.ts.localeCompare(b.ts)); // старые первыми
    const toDel = autos.length>BK_KEEP_AUTO ? autos.slice(0, autos.length-BK_KEEP_AUTO).map(b=>b.id) : [];
    // 3) удалить лишние (все delete синхронно в одной свежей транзакции)
    if(toDel.length){ const {store,done}=await _bkStore('readwrite'); toDel.forEach(id=>store.delete(id)); await done; }
  }catch(e){ const list=_lsBackupsGet(); list.push(snap); ok=_lsBackupsPut(list); }   // fallback в localStorage
  // P0.2: не врём об успехе — если ни одно хранилище не приняло копию, это ошибка.
  if(!ok) throw new Error('backup-failed');
  return snap;
}
// 1.0.6: список = IndexedDB ∪ запасное хранилище (localStorage). Раньше при рабочем чтении IDB запасные копии были НЕВИДИМЫ:
// createBackup успешно клал копию в localStorage (запись в IDB отменена — квота), сообщал «готово», а восстановить её было нельзя.
async function getBackups(){
  let all=[]; try{ const {store}=await _bkStore('readonly'); all=(await _req(store.getAll()))||[]; }catch(e){ /* IDB недоступен — остаётся запасное хранилище */ }
  const seen=new Set(all.map(b=>b.id));
  return all.concat(_lsBackupsGet().filter(b=>b && b.id && !seen.has(b.id))).sort((a,b)=>b.ts.localeCompare(a.ts)); }
async function deleteBackup(id){
  try{ const {store,done}=await _bkStore('readwrite'); store.delete(id); await done; }catch(e){}
  const ls=_lsBackupsGet(); if(ls.some(b=>b.id===id)) _lsBackupsPut(ls.filter(b=>b.id!==id)); }
async function maybeAutoBackup(){ const now=Date.now(); if(now-_lastAutoBk < 15*60*1000) return; _lastAutoBk=now; try{ await createBackup('auto'); }catch(e){} }
async function ensurePersist(){ try{ if(navigator.storage&&navigator.storage.persist){ const already=navigator.storage.persisted?await navigator.storage.persisted():false; if(!already) await navigator.storage.persist(); } }catch(e){} }
async function dailyBackup(){ try{ const bks=await getBackups(); const today=new Date().toISOString().slice(0,10); if(!bks.some(b=>b.ts.slice(0,10)===today)) await createBackup('auto'); _lastAutoBk=Date.now(); }catch(e){} }

/* ---------- Замок операций над состоянием (аудит: «одновременная работа синхронизации и восстановления») ----------
   Синхронизация, подключение, восстановление, импорт и сброс — МНОГОШАГОВЫЕ: читают состояние, ЖДУТ (сеть, IndexedDB), затем ЗАМЕНЯЮТ его.
   Без взаимного исключения синхронизация, начатая до восстановления, по окончании записывала УСТАРЕВШЕЕ состояние поверх восстановленного
   (на экране при этом «Восстановлено ✓»), а фоновая синхронизация, стартовавшая внутри восстановления, выгружала в облако дореставрационные данные.
   Здесь такие операции выстраиваются в очередь (FIFO). Диалоги подтверждения В ЗАМКЕ НЕ ДЕРЖИМ (иначе синхронизация вставала бы, пока владелец
   думает): подтверждения — до/после, внутри замка только «копия + замена». Страховка поверх замка — сверка версии данных внутри runSync (core.js).
   o.onWait — вызвать, если замок занят; o.timeoutMs — не ждать дольше (вернёт LOCK_TIMEOUT, fn при этом НЕ выполнится). */
const LOCK_TIMEOUT=Symbol('lock-timeout');
let _lockTail=Promise.resolve(), _lockBusy=0;
function withStateLock(fn, o){ o=o||{};
  if(_lockBusy>0 && o.onWait){ try{ o.onWait(); }catch(e){} }
  _lockBusy++;
  let started=false, cancelled=false, timer=null;
  const run=_lockTail.then(()=>{ if(cancelled) return undefined; started=true; clearTimeout(timer); return fn(); }).finally(()=>{ _lockBusy--; });   // счётчик уменьшается ДО того, как вызывающий увидит результат
  _lockTail=run.then(()=>{},()=>{});
  if(!o.timeoutMs) return run;
  const gate=new Promise(res=>{ timer=setTimeout(()=>{ if(!started){ cancelled=true; res(LOCK_TIMEOUT); } }, o.timeoutMs); });
  return Promise.race([run, gate]);
}
// Честное предупреждение в окне подтверждения замены данных, когда включена синхронизация: замена ПОМЕЧАЕТСЯ эпохой и распространяется на другие устройства
// (те, на которых нет несинхронизированных правок, принимают её целиком, свои прежние данные сохраняя в своей копии «pre-sync»); устройства с ещё не
// отправленными правками объединяются слиянием — там удалённые записи могут вернуться. Радиус действия больше одного устройства — владелец должен знать об этом заранее.
function syncReplaceNote(isReset){ if(!syncConfigured()) return '';
  return isReset ? ' Синхронизация включена: сброс получат и другие устройства (их прежние данные сохранятся в резервной копии на каждом). Если на каком-то есть ещё не отправленные правки, они вернутся слиянием.'
                 : ' Синхронизация включена: эту замену получат и другие устройства (их прежние данные сохранятся в резервной копии на каждом). Если на каком-то есть ещё не отправленные правки, они будут объединены с этими данными.'; }
// Копия текущих данных, АКТУАЛЬНАЯ на момент замены: если, пока писалась копия, данные успели измениться (правка, синхронизация), делаем её заново (до 3 раз) —
// иначе в копии не оказалось бы последней правки, которую сейчас затрёт замена. false — копии нет: не удалась запись ЛИБО три копии подряд устарели,
// пока писались (данные всё время менялись). Устаревшая копия — не успех (аудит 1.0.6, P1): вызывающий отменит замену или явно спросит владельца.
async function backupBeforeReplace(reason){
  for(let i=0;i<3;i++){ const stamp=dataStamp; try{ await withTimeout(createBackup(reason), 20000, 'backup-timeout'); }catch(e){ return false; } if(dataStamp===stamp) return true; }
  return false; }
// Ограничить ожидание обещания по времени (зависшее хранилище не должно держать замок операций вечно). Позднее завершение исходного обещания безвредно.
function withTimeout(p, ms, label){ let t; return Promise.race([p, new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error(label||'timeout')), ms); })]).finally(()=>clearTimeout(t)); }
// Заменить ВСЁ состояние ИСКЛЮЧИТЕЛЬНО (восстановление / импорт): дождаться конца идущей синхронизации, сделать копию текущего, применить.
// 'ok' | 'nobackup' (копия не удалась, а разрешения идти без неё нет — вызывающий спросит владельца) | 'fail' (запись не удалась, прежнее состояние цело) | 'busy'.
async function replaceStateExclusive(candidate, backupReason, allowNoBackup){
  const r=await withStateLock(async()=>{
    const bk=await backupBeforeReplace(backupReason);
    if(!bk && !allowNoBackup) return 'nobackup';
    // Метка осознанной замены: строго больше любой эпохи, известной этому устройству и самим данным. Благодаря ей другие устройства принимают
    // замену как решение владельца (а не сливают свои старые записи и надгробия обратно — это отменило бы восстановление/импорт).
    candidate.epoch=Math.max(Date.now(), (+state.epoch||0)+1, (+candidate.epoch||0)+1);
    return applyState(candidate) ? 'ok' : 'fail'; },
    { onWait:()=>toast('Идёт синхронизация — дождусь её завершения…'), timeoutMs:60000 });
  return r===LOCK_TIMEOUT ? 'busy' : r; }
// Общий хвост восстановления/импорта: разобрать исход replaceStateExclusive (спросить про «без копии» ВНЕ замка) → 'ok' либо сообщить и вернуть false.
async function replaceWithConsent(candidate, backupReason, noBackupQuestion, failMsg){
  let r=await replaceStateExclusive(candidate, backupReason, false);
  if(r==='nobackup'){
    if(!await confirmSheet(noBackupQuestion.text,{okText:noBackupQuestion.ok,danger:true})) return false;
    r=await replaceStateExclusive(candidate, backupReason, true); }
  if(r==='busy'){ toast('Синхронизация занята — данные не изменены, повтори через минуту'); return false; }
  if(r!=='ok'){ toast(failMsg); return false; }
  syncPushDebounced();   // замена — это локальное изменение: пусть синхронизация приведёт облако в порядок
  return true; }

async function restoreBackup(id){
  const bks=await getBackups(); const snap=bks.find(b=>b.id===id); if(!snap){ toast('Копия не найдена'); return; }
  // P1.3 staged: разобрать → валидировать → подтвердить → [замок: копия → применить (atomic)] → только потом «успех».
  let parsed=null; try{ parsed=JSON.parse(snap.data); }catch(e){ parsed=null; }
  const bad=validateState(parsed);
  if(bad){ toast('Копия повреждена или несовместима — восстановление отменено'+whyBad(bad)); return; }
  if(!await confirmSheet(`Восстановить копию от ${new Date(snap.ts).toLocaleString('ru-RU')}? Текущие данные будут заменены (перед этим создам резервную копию).`+syncReplaceNote(),{okText:'Восстановить',danger:true})) return;
  if(!await replaceWithConsent(parsed, 'pre-restore',
      { text:'Не удалось создать резервную копию текущих данных. Всё равно восстановить (текущие данные будут потеряны)?', ok:'Восстановить' },
      'Не удалось сохранить восстановленные данные — осталось прежнее состояние')) return;   // P0.3/P1.3: «успех» только после подтверждённой записи
  toast('Восстановлено ✓'); moreView='backups'; render();
}
function downloadBackup(id){ getBackups().then(bks=>{ const snap=bks.find(b=>b.id===id); if(!snap) return;
  const blob=new Blob([snap.data],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='konverty-backup-'+snap.ts.slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }); }
async function createBackupNow(){ try{ await createBackup('manual'); toast('Копия создана ✓'); }catch(e){ toast('Не удалось создать копию'); } if(moreView==='backups') renderMore(); }
async function delBackupUI(id){ if(!await confirmSheet('Удалить эту копию?',{okText:'Удалить',danger:true})) return; deleteBackup(id).then(()=>{ toast('Удалено'); if(moreView==='backups') renderMore(); }); }
function renderBackups(el){
  el.innerHTML=`<button class="back-btn" onclick="backMore()">${ic('chevl','sm')} Назад</button><h2 class="u-m-0-4-12">Резервные копии</h2>
    <div class="small-note u-m-0-4-12" >Копии хранятся на этом устройстве (в браузере) и создаются автоматически раз в день и перед импортом/сбросом/восстановлением. Чтобы перенести данные на другое устройство — скачай копию в файл (⬇️).</div>
    <button class="btn" onclick="createBackupNow()">${ic('plus','sm')} Создать копию сейчас</button>
    <div id="bkList" class="u-mt-12"><div class="small-note">Загрузка…</div></div>`;
  getBackups().then(bks=>{ const box=document.getElementById('bkList'); if(!box) return;
    const label={auto:'авто',manual:'вручную','pre-import':'перед импортом','pre-reset':'перед сбросом','pre-restore':'перед восстановлением'};
    box.innerHTML = bks.length ? `<div class="card">`+bks.map(b=>{ const d=new Date(b.ts); const kb=Math.max(1,Math.round((b.data?b.data.length:0)/1024));
      return `<div class="list-item"><div class="grow"><div class="u-fw-600">${d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
        <div class="small-note">${label[b.reason]||b.reason} · ~${kb} КБ</div></div>
        <button class="icon-btn" title="Скачать" onclick="downloadBackup('${b.id}')">${ic('download','sm')}</button>
        <button class="icon-btn" title="Восстановить" onclick="restoreBackup('${b.id}')">${ic('undo','sm')}</button>
        <button class="icon-btn del" title="Удалить" onclick="delBackupUI('${b.id}')">${ic('trash','sm')}</button></div>`; }).join('')+`</div>`
      : '<div class="empty">Пока нет копий</div>'; });
}
