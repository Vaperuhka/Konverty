const monthTx = () => state.transactions.filter(t=>t.date.slice(0,7)===viewMonth);
function render() {
  document.getElementById('hdr').textContent = TITLES[currentTab];
  // Оранжевый баннер нужен только там, где в нём есть суммы (Операции/Анализ).
  // На Главной — свой hero; на Счетах/Ещё — лёгкий заголовок в контенте (баннер прячем).
  const noBanner = currentTab==='home' || currentTab==='accounts' || currentTab==='more';
  document.querySelector('header').style.display = noBanner ? 'none' : '';
  renderSidebarPins();   // синхронизируем закреплённые ярлыки на боковой панели (ПК)
  if (currentTab==='home') { renderHome(); return; }
  const showMonth = currentTab==='ops' || currentTab==='analysis';
  // Выбор месяца переехал из баннера вниз (в контент экранов) — в шапке стрелок больше нет.
  const hsum = document.getElementById('hsum');
  if (showMonth) {
    // В режиме «Всё время» (у Операций и Анализа — свои переключатели) суммы за всё время, иначе за месяц.
    const allTime = (currentTab==='ops' && opsScope==='all') || (currentTab==='analysis' && analysisScope==='all');
    const src = allTime ? state.transactions : monthTx();
    const inc=src.filter(t=>t.type==='income').reduce((s,t)=>s+toBase(t.amount,t.currency),0);
    const exp=src.filter(t=>t.type==='expense').reduce((s,t)=>s+toBase(t.amount,t.currency),0);
    const perLbl = allTime ? 'за всё время' : 'за месяц';
    hsum.style.display='flex';
    hsum.innerHTML = `<div class="box"><div class="l">Доходы ${perLbl}</div><div class="v">${fmtBase(inc)}</div></div>
      <div class="box"><div class="l">Расходы ${perLbl}</div><div class="v">${fmtBase(exp)}</div></div>`;
  } else hsum.style.display='none';
  const hfree=document.getElementById('hfree');
  if (currentTab==='ops') {
    const {envBal,accBal}=computeBalances();
    const free=freeMoney(accBal,envBal);
    const allow=round2(Math.max(0,free)/daysLeftInMonth());
    hfree.style.display='flex';
    hfree.innerHTML=`<span class="hf" role="button" tabindex="0" onclick="switchTab('accounts')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">Свободно <b>${fmtBase(free)}</b></span><span class="hf" role="button" tabindex="0" title="Ориентир на сегодня: свободные деньги ÷ оставшиеся дни месяца" onclick="switchTab('more');openMore('plan')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">Ориентир <b>≈ ${fmtGuide(allow)}</b></span>`;
  } else hfree.style.display='none';
  if (currentTab==='ops') renderOps();
  else if (currentTab==='analysis') renderAnalysis();
  else if (currentTab==='accounts') renderAccounts();
  else if (currentTab==='more') renderMore();
}

/* ---------- Главная (дашборд) ---------- */
function homePrevYm(ym){ let [y,m]=ym.split('-').map(Number); m--; if(m<1){m=12;y--;} return `${y}-${String(m).padStart(2,'0')}`; }
function homeToggleMask(){ let m=false; try{ m=localStorage.getItem('konverty_mask')==='1'; }catch(e){}
  m=!m; try{ localStorage.setItem('konverty_mask', m?'1':'0'); }catch(e){}
  const h=document.querySelector('.home-hero'); if(h) h.classList.toggle('masked',m);
  const b=document.getElementById('hhEye'); if(b){ b.innerHTML=ic(m?'eyeoff':'eye'); b.setAttribute('aria-pressed', m?'true':'false'); b.setAttribute('aria-label', m?'Показать суммы':'Скрыть суммы'); } }
// Ориентир на сегодня — приблизительная величина: от 100 в базовой валюте копейки не показываем (формула та же, меняется только вывод).
function fmtGuide(v){ return Math.abs(v)>=100?fmtBase(Math.round(v)):fmtBase(v); }
// Свёрнутость блоков «Дополнительное» на главной (запоминается на устройстве).
function homeFoldGet(){ try{ const o=JSON.parse(localStorage.getItem('konverty_homefold')||'{}'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function homeFold(k,open){ const f=homeFoldGet(); f[k]=!!open; try{ localStorage.setItem('konverty_homefold', JSON.stringify(f)); }catch(e){} }
// Строки «Как распределились деньги» — общие для экрана «Счета» и свёрнутого блока на главной (формулы те же, что были в «Счетах»).
function moneyBreakdownHtml(accBal, envBal, owedBal, withTotal){
  const oweSum=totalOwed(owedBal), free=freeMoney(accBal,envBal), committed=committedEnvelopes(envBal), gRes=goalsReservedBase();
  const r=(l,v,cls)=>`<div class="row"><span class="muted">${l}</span><span class="${cls||'u-fw-700'}">${v}</span></div>`;
  return (withTotal?r('Всего на счетах',fmtBase(totalNet(accBal)),'u-fw-700'):'')
    + r('Свободно',fmtBase(free),`${free<-0.005?'red':'green'} u-fw-800`)
    + r('В конвертах (бюджет)',fmtBase(committed))
    + (gRes>0.5?r('В целях',fmtBase(gRes)):'')
    + (oweSum>0.5?r('Долг конвертам',fmtBase(oweSum),'red u-fw-700'):'')
    + (()=>{ const b=borrowedInBalance(); return b>0.5?r('Из них заёмные (нужно вернуть)',fmtBase(b),'red u-fw-700'):''; })()
    + (()=>{ const ad=avgDailySpendBase(90), sp=spendableTotal(accBal); if(ad<=0||sp<=0) return ''; const d=Math.round(sp/ad); return r('Запас хода',`~${d} ${plural(d,'день','дня','дней')} <span class="muted u-fw-400" >(${fmtBase(ad)}/день)</span>`); })();
}
function renderHome(){
  const el=document.getElementById('screen-home');
  const {envBal,accBal,owedBal}=computeBalances();
  const free=freeMoney(accBal,envBal), net=totalNet(accBal);
  const ym=todayISO().slice(0,7), todayStr=todayISO();
  // «Потрачено сегодня» из расходов за сегодня
  const spentToday=round2(state.transactions.filter(x=>x.type==='expense'&&x.date===todayStr).reduce((s,x)=>s+toBase(x.amount,x.currency),0));
  const masked=(()=>{ try{ return localStorage.getItem('konverty_mask')==='1'; }catch(e){ return false; } })();
  const cfg=dashCfg(), fold=homeFoldGet();
  const secHead=(title,right)=>`<div class="home-sec"><h2>${title}</h2>${right||''}</div>`;
  const secLink=(label,act)=>`<button class="sec-link" onclick="${act}">${label}${ic('chevr','xs')}</button>`;

  // ===== ГЛАВНОЕ: свободные деньги + «Ориентир на сегодня» =====
  // Ориентир = свободные деньги ÷ оставшиеся дни месяца (включая сегодня). Формула прежняя (меняются только название и пояснение); копейки в ориентире не показываем.
  const fmtG=fmtGuide;
  let guideHtml;
  if (free > 0.5) {
    const days=daysLeftInMonth(), limit=round2(free/days);
    const remain=round2(Math.max(0,limit-spentToday));
    const limPc=limit>0?Math.min(100,Math.round(spentToday/limit*100)):0;
    const over=spentToday>limit+0.005;
    guideHtml=`<div class="hh-limit">
      <div class="hl-ic">${ic('calendar')}</div>
      <div class="hl-main"><div class="hl-cap">Ориентир на сегодня${over?' · превышен':''}</div>
        <div class="hl-val">${fmtBase(spentToday)} из ≈ ${fmtG(limit)}</div>
        <div class="hh-bar"><i style="width:${Math.max(2,limPc)}%${over?';background:var(--hero-over)':''}"></i></div></div>
      <div class="hl-pill"><b>≈ ${fmtG(remain)}</b><small>осталось</small></div></div>
      <details class="hl-why"><summary>Как считается ориентир</summary>
        <p>Свободные деньги (${fmtBase(free)}) делим на число оставшихся дней месяца, включая сегодня (${days}): получается ≈ ${fmtG(limit)} в день. Значение пересчитывается после каждой операции. Это ориентир, а не жёсткий запрет.</p></details>`;
  } else {
    guideHtml=`<div class="hh-limit">
      <div class="hl-ic">${ic('info')}</div>
      <div class="hl-main"><div class="hl-cap">Свободных денег нет</div>
        <div class="hl-val">${spentToday>0.5?`Сегодня потрачено ${fmtBase(spentToday)}`:'Конверты и цели заняли весь баланс'}</div></div>
      <button class="hl-pill hl-link" onclick="switchTab('accounts')"><b>Счета</b><small>проверить</small></button></div>`;
  }
  const hero=`<section class="home-hero ${masked?'masked':''}" aria-label="Свободные деньги">
    <div class="hh-l"><span>Свободные деньги</span><button class="hh-eye" id="hhEye" onclick="homeToggleMask()" aria-pressed="${masked?'true':'false'}" aria-label="${masked?'Показать суммы':'Скрыть суммы'}">${ic(masked?'eyeoff':'eye')}</button></div>
    <div class="hh-amt">${fmtBase(free)}</div>
    <div class="hh-sub">Всего на счетах <b>${fmtBase(net)}</b></div>
    <div class="hh-div"></div>
    ${guideHtml}</section>`;

  // Доходы/расходы за текущий месяц; сравнение — с тем же числом прошлого месяца (честнее, чем со всем месяцем)
  const t=monthlyTotals(ym);
  const dayNow=+todayStr.slice(8,10);
  const prevMtd=(()=>{ const pym=homePrevYm(ym); let inc=0,exp=0;
    for(const x of state.transactions){ if((x.date||'').slice(0,7)!==pym) continue; if(+x.date.slice(8,10)>dayNow) continue;
      if(x.type==='income') inc+=toBase(x.amount,x.currency); else if(x.type==='expense') exp+=toBase(x.amount,x.currency); }
    return {inc:round2(inc),exp:round2(exp)}; })();
  const incD = prevMtd.inc>0.5 ? Math.round((t.inc-prevMtd.inc)/prevMtd.inc*100) : null;
  const expD = prevMtd.exp>0.5 ? Math.round((t.exp-prevMtd.exp)/prevMtd.exp*100) : null;
  const deltaChip=(d,goodUp)=>{ if(d==null||d===0) return ''; const up=d>0; const good=goodUp?up:!up;
    const col=good?'var(--green)':'var(--red)', bg=good?'var(--green-soft)':'var(--red-soft)';
    return `<span class="ie-delta" style="color:${col};background:${bg}" title="К тому же числу прошлого месяца" aria-label="${up?'больше':'меньше'} на ${Math.abs(d)}% к тому же числу прошлого месяца">${up?'+':'−'}${Math.abs(d)}%</span>`; };
  const ieCard=`<div class="card tight home-ie">
    <div class="ie-col"><div class="ie-top"><span class="ie-ic up">${ic('arrowup','xs')}</span><span class="ie-cap">Доходы за месяц</span></div>
      <div class="ie-val green">${fmtBase(t.inc)}</div>${deltaChip(incD,true)}</div>
    <div class="ie-col"><div class="ie-top"><span class="ie-ic down">${ic('arrowdown','xs')}</span><span class="ie-cap">Расходы за месяц</span></div>
      <div class="ie-val">${fmtBase(t.exp)}</div>${deltaChip(expD,false)}</div></div>`;

  // Последние операции (5) — на основном уровне, сразу под итогами месяца
  const recentRows=state.transactions.slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0).slice(0,5).map(opRow).join('');
  const recentSection=secHead('Последние операции', secLink('Все',"switchTab('ops')"))
    + (recentRows?`<div class="list">${recentRows}</div>`:`<div class="empty inline">Пока нет операций</div>`);

  // ===== КОНТРОЛЬ: конверты (сначала те, что требуют внимания), бюджет месяца, ближайшие платежи =====
  const envAll=activeEnvelopes().map(e=>{
    const base=envelopeBase(envBal,e.id);
    let line, pc=null, barCol=e.color, right='', st='ok';
    if(e.monthlyLimit>0){ const sp=envSpentInMonth(e.id,ym); pc=Math.min(100,Math.round(sp/e.monthlyLimit*100)); const over=sp>e.monthlyLimit+0.005;
      st=over?'over':(pc>=80?'near':'ok'); barCol=over?'var(--red)':(pc>=80?'var(--warn-txt)':e.color); line=`${fmtBase(sp)} из ${fmtBase(e.monthlyLimit)}${over?' · перерасход':''}`; right=pc+'%'; }
    else if(e.monthlyTarget>0){ const f=envFundedInMonth(e.id,ym); pc=Math.min(100,Math.round(f/e.monthlyTarget*100)); line=`${fmtBase(f)} из ${fmtBase(e.monthlyTarget)}`; right=pc+'%'; }
    else { line=`Баланс ${fmtBase(base)}`; }
    if(base<-0.005 && st==='ok'){ st='over'; line=`Баланс ${fmtBase(base)} · в минусе`; }
    return {e,line,pc,barCol,right,st}; });
  const rank=x=>x.st==='over'?0:(x.st==='near'?1:2);
  const envShown=envAll.slice().sort((a,b)=>rank(a)-rank(b)).slice(0,4);   // сортировка устойчива: внутри одной степени порядок конвертов прежний
  const nOver=envAll.filter(x=>x.st==='over').length, nNear=envAll.filter(x=>x.st==='near').length;
  const alertPill = nOver ? `<span class="pill over">${nOver} ${plural(nOver,'перерасход','перерасхода','перерасходов')}</span>` : (nNear ? `<span class="pill near">${nNear} близко к лимиту</span>` : '');
  const envRow=x=>{ const e=x.e;
    const rightBlock = x.pc!=null ? `<div class="prog he-bar"><i style="width:${Math.max(2,x.pc)}%;background:${x.barCol}"></i></div><div class="he-pct ${x.st!=='ok'?x.st:''}">${x.right}</div>` : '';
    return `<div class="he-row" onclick="openEnvManage('${e.id}')">
      <div class="he-ic" style="background:${e.color}">${e.icon||'✉️'}</div>
      <div class="he-main"><div class="he-name">${esc(e.name)}</div><div class="he-sub ${x.st!=='ok'?x.st:''}">${x.line}</div></div>
      ${rightBlock}<span class="he-chev">${ic('chevr','sm')}</span></div>`; };
  // «Бюджет месяца» — суммарный прогресс по конвертам с лимитами (строка вверху списка; пусто, если лимитов нет)
  const budgetRow=(()=>{ let lim=0, sp=0; for(const e of activeEnvelopes()){ if(e.monthlyLimit>0){ lim+=e.monthlyLimit; sp+=envSpentInMonth(e.id,ym); } } if(lim<=0.5) return '';
    const pc=Math.min(100,Math.round(sp/lim*100)); const over=sp>lim+0.005; const col=over?'var(--red)':(pc>=80?'var(--warn-txt)':'var(--accent-text)');
    return `<div class="li bud"><div class="row"><span class="bud-l">Бюджет месяца</span><span class="nowrap-strong" style="color:${col}">${fmtBase(sp)} / ${fmtBase(lim)}</span></div>
      <div class="prog sm"><i style="width:${Math.max(2,pc)}%;background:${col}"></i></div></div>`; })();
  const envListInner=(cfg.budget?budgetRow:'')+(cfg.envelopes?(envShown.map(envRow).join('')||`<div class="li muted">Нет конвертов</div>`):'');
  const envSection=(cfg.envelopes||(cfg.budget&&budgetRow))
    ? secHead('Конверты '+alertPill, secLink('Все конверты',"switchTab('accounts')"))+`<div class="list">${envListInner}</div>` : '';

  // Ближайшие платежи: окно ровно на месяц вперёд от сегодня (напр. 16.11 → до 16.12)
  const payCut=(()=>{ let [y,m,d]=todayStr.split('-').map(Number); m+=1; if(m>12){m-=12;y++;} const dim=new Date(y,m,0).getDate(); d=Math.min(d,dim); return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; })();
  const paysAll=payAgendaItems().filter(i=>i.date>=todayStr && i.date<=payCut), pays=paysAll.slice(0,5);   // как и раньше пять ближайших; остальные — счётчик «ещё N» в ссылке (не пропадают молча)
  const payRows=pays.map(i=>{ const cls=i.type==='income'?'green':'red'; const sign=i.type==='income'?'+':'−';
    const icn=i.kind==='debt'?'swap':(i.type==='income'?'arrowup':'arrowdown');   // как в итогах месяца: доход — вверх (зелёный), расход — вниз (красный)
    return `<div class="he-row" onclick="openCalDay('${i.date}')"><div class="he-ic soft">${ic(icn,'sm')}</div>
      <div class="he-main"><div class="he-name">${esc(i.title)}</div><div class="he-sub">${dayHead(i.date)}</div></div>
      <div class="he-amt ${cls}">${sign}${fmt(i.amount,i.currency)}</div></div>`; }).join('');
  const paySection=cfg.pays ? secHead('Ближайшие платежи', secLink('Календарь'+(paysAll.length>pays.length?` · ещё ${paysAll.length-pays.length}`:''),"switchTab('more');openMore('calendar')"))
    + (payRows?`<div class="list">${payRows}</div>`:`<div class="empty inline">Нет запланированных платежей</div>`) : '';

  // ===== ДОПОЛНИТЕЛЬНОЕ (сворачиваемое): цели, расширенные показатели, ссылка на анализ =====
  const goalsFold=cfg.goals ? (()=>{ const gs=activeGoals();
    const rows=gs.slice(0,3).map(g=>{ const pct=goalPct(g); const col=g.color||'#7b5cff'; const gc=goalCurOf(g);
      return `<div class="li goal"><div class="row"><span class="duo-t">${g.icon||'🎯'} ${esc(g.name)}</span><span class="he-sub">${fmt(goalSavedOf(g),gc)} / ${fmt(g.target,gc)}</span></div>
        <div class="prog sm"><i style="width:${Math.max(2,pct)}%;background:${col}"></i></div></div>`; }).join('');
    const sum=gs.length?`${esc(gs[0].name)} ${goalPct(gs[0])}%`+(gs.length>1?` · ещё ${gs.length-1}`:''):'Пока нет целей';
    return `<details class="fold" ${fold.goals?'open':''} ontoggle="homeFold('goals',this.open)"><summary><span class="fold-t">Цели накоплений</span><span class="fold-s">${sum}</span>${ic('chevd','sm')}</summary>
      <div class="list">${rows||`<div class="li muted">Пока нет целей. Создай цель в «Ещё → Цели-накопления».</div>`}</div>
      ${gs.length?`<div class="fold-more">${secLink('Все цели',"switchTab('more');openMore('goals')")}</div>`:''}</details>`; })() : '';
  const metricsFold=cfg.metrics ? `<details class="fold" ${fold.metrics?'open':''} ontoggle="homeFold('metrics',this.open)"><summary><span class="fold-t">Расширенные показатели</span><span class="fold-s">В конвертах, в целях, запас хода</span>${ic('chevd','sm')}</summary>
      <div class="list"><div class="li stat">${moneyBreakdownHtml(accBal,envBal,owedBal,true)}</div></div></details>` : '';
  const analysisLink=`<div class="list"><div class="menu-item" onclick="switchTab('analysis')"><span class="mi">${ic('chart')}</span><span class="mtx"><span class="mlbl">Анализ расходов и доходов</span><span class="mh">Категории, динамика по месяцам</span></span><span class="ar">${ic('chevr','sm')}</span></div></div>`;

  // Статус синхронизации (если настроена). Нет отметки «последняя синхронизация» = подключение не завершено (токен принят, а первичная загрузка или
  // локальная запись не прошли): «Синхронизировано» тут писать нельзя (аудит 1.0.6, P1: статусы подключения).
  const syncLine=(()=>{ if(!syncConfigured()) return ''; const t=syncLastAt();
    if(!t) return `<div class="sync-line warn" role="button" tabindex="0" onclick="switchTab('more');openMore('sync')">${ic('cloud','xs')} Подключение к облаку не завершено — нажми, чтобы закончить</div>`;
    const ago=Math.round((Date.now()-t)/60000);
    const txt = ago<1?'только что' : ago<60?`${ago} мин назад` : ago<1440?`${Math.round(ago/60)} ч назад` : `${Math.round(ago/1440)} дн назад`;
    return `<div class="sync-line" role="button" tabindex="0" onclick="switchTab('more');openMore('sync')">${ic('cloud','xs')} Синхронизировано: ${txt}</div>`; })();

  const settingsBtn=`<button class="btn sec small dash-cfg-btn" onclick="openDashSettings()">${ic('sliders','sm')} Настроить главную</button>`;
  const main = hero + syncLine + (cfg.ie?ieCard:'') + (cfg.recent?recentSection:'');
  const side = envSection + paySection + `<div class="home-extra"><div class="home-sub-label">Дополнительно</div>${goalsFold}${metricsFold}${analysisLink}</div>`;
  el.innerHTML=`<div class="home-top">
      <div><h1 class="home-title">Конверты</h1><div class="home-subtitle">Учёт денег</div></div>
      <div class="home-acts"><button class="home-act" aria-label="Поиск по операциям" onclick="switchTab('ops');setTimeout(()=>{const s=document.getElementById('opsSearch');if(s){s.focus();}},80)">${ic('search')}</button><button class="home-act" aria-label="Настроить главную" onclick="openDashSettings()">${ic('sliders')}</button></div>
    </div><div class="home-cols"><div class="home-col">${main}</div><div class="home-col">${side}</div></div>${settingsBtn}`;
}
/* Настройка видимости блоков главной (localStorage) */
function dashCfg(){ const d={ie:true,budget:true,envelopes:true,pays:true,goals:true,recent:true,metrics:true}; let s={};
  try{ s=JSON.parse(localStorage.getItem('konverty_dashcfg')||'{}')||{}; }catch(e){ s={}; }
  if(typeof s.duo==='boolean'){ if(typeof s.pays!=='boolean') s.pays=s.duo; if(typeof s.goals!=='boolean') s.goals=s.duo; }   // прежний общий блок «Платежи и цели» → два новых (старый выбор владельца сохраняется)
  return Object.assign(d, s); }

/* ---------- Операции ---------- */
function opRow(t) {
  let emo,color,title,sub,amt,amtCls;
  if (t.type==='income') {
    const c=catById(t.categoryId); emo=c?c.icon:'💰'; color=c?c.color:'#17a877';
    title=t.note||(c?c.name:'Доход');
    const creditIds=Object.keys(t.accountCredits||{});
    const planCount=t.plan?Object.keys(t.plan).length:0;
    const isDeposit=!planCount && creditIds.length===1;
    if (isDeposit) sub = `Пополнение · ${acc(creditIds[0])?.name||'счёт'}`;
    else { const mainId=creditIds.find(id=>!acc(id)?.investment);
      const fundedCount=t.distribution?Object.keys(t.distribution).filter(id=>t.distribution[id]>0.005).length:0;
      sub = planCount ? `Доход → ${acc(mainId)?.name||'счёт'} · конверты ${fundedCount}/${planCount}` : `Доход → ${acc(mainId)?.name||'счёт'} + конверты`; }
    amt='+'+fmt(t.amount,t.currency); amtCls='green';
  } else if (t.type==='transfer') {
    emo='🔁'; color='#94a3b8'; title=t.note||'Перевод между счетами';
    sub=`${acc(t.fromAccountId)?.name||'?'} → ${acc(t.toAccountId)?.name||'?'}`;
    const fA=t.fromAmount!=null?t.fromAmount:t.amount, fC=t.fromCurrency||t.currency, tA=t.toAmount!=null?t.toAmount:t.amount, tC=t.toCurrency||t.currency;
    amt = fC===tC ? fmt(fA,fC) : `${fmt(fA,fC)} → ${fmt(tA,tC)}`; amtCls='muted';
  } else if (t.type==='envtransfer') {
    emo='🔁'; color='#94a3b8'; title=t.note||'Перевод между конвертами';
    sub=`${env(t.fromEnvelopeId)?.name||'?'} → ${env(t.toEnvelopeId)?.name||'?'}`; amt=fmt(t.amount,t.currency); amtCls='muted';
  } else if (t.type==='envfund') {
    emo='📥'; color='#3bb8ab'; title=t.note||'Пополнение конверта';
    sub=`доложено в «${env(t.envelopeId)?.name||'?'}»`; amt=fmt(t.amount,t.currency); amtCls='muted';
  } else if (t.type==='adjust') {
    emo='⚖️'; color='#94a3b8'; title=t.note||'Корректировка баланса';
    sub=acc(t.accountId)?.name||'?'; amt=(t.amount>=0?'+':'−')+fmt(Math.abs(t.amount),t.currency); amtCls=t.amount>=0?'green':'';
  } else if (t.type==='envadjust') {
    emo='⚖️'; color='#7b5cff'; title=t.note||'Корректировка конверта';
    sub=`«${env(t.envelopeId)?.name||'?'}»`; amt=(t.amount>=0?'+':'−')+fmt(Math.abs(t.amount),t.currency); amtCls='muted';
  } else if (Array.isArray(t.splits) && t.splits.length) {
    emo='✂️'; color='#94a3b8'; title=t.note||'Покупка (разделена)';
    sub=`${t.splits.length} ${plural(t.splits.length,'часть','части','частей')} · ${acc(t.accountId)?.name||'—'}`;
    amt='−'+fmt(t.amount,t.currency); amtCls='';
  } else {
    const c=catById(t.categoryId); emo=c?c.icon:'💸'; color=c?c.color:'#94a3b8';
    title=t.note||(c?c.name:'Расход');
    sub=[acc(t.accountId)?.name, env(t.envelopeId)?.name].filter(Boolean).join(' · ')||'—';
    amt='−'+fmt(t.amount,t.currency); amtCls='';
  }
  if (opsSelMode){ const on=opsSel.has(t.id);
    return `<div class="op op-pick ${on?'on':''}" data-id="${t.id}" onclick="opsToggleSel('${t.id}')">
      <div class="op-chk">${on?'✓':''}</div>
      <div class="cat-ic" style="background:${color}">${emo}</div>
      <div class="oi"><div class="ot">${esc(title)}</div><div class="os">${esc(sub)}</div></div>
      <div class="oa ${amtCls}">${amt}</div></div>`; }
  return `<div class="op" data-id="${t.id}" onclick="txDetails('${t.id}')">
    <div class="cat-ic" style="background:${color}">${emo}</div>
    <div class="oi"><div class="ot">${esc(title)}</div><div class="os">${esc(sub)}</div></div>
    <div class="oa ${amtCls}">${amt}</div></div>`;
}

async function opsBulkDelete(){ if(!opsSel.size) return; const ids=[...opsSel];

// Множественное число (рус.): plural(5,'день','дня','дней') → 'дней'
function plural(n,one,few,many){ const a=Math.abs(n)%100, b=a%10; if(a>10&&a<20)return many; if(b>1&&b<5)return few; if(b===1)return one; return many; }
// Стрик ведения учёта: сколько дней подряд (заканчивая сегодня/вчера) есть хотя бы одна операция.
function computeStreak(){
  const days=new Set(); for(const t of state.transactions){ if(!t.hidden && t.date) days.add(t.date); }
  if(!days.size) return {cur:0,best:0};
  const OD=86400000; const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  const t0=todayISO().split('-').map(Number); let d=new Date(t0[0],t0[1]-1,t0[2]);
  if(!days.has(iso(d))) d=new Date(d.getTime()-OD);   // сегодня ещё не отмечено — не рвём стрик
  let cur=0; while(days.has(iso(d))){ cur++; d=new Date(d.getTime()-OD); }
  const sorted=[...days].sort(); let best=0,run=0,prev=null;
  for(const ds of sorted){ if(prev){ const diff=Math.round((new Date(ds)-new Date(prev))/OD); run = diff===1?run+1:1; } else run=1; best=Math.max(best,run); prev=ds; }
  return {cur,best};
}
function opFilterMatch(t){
  if (opsType!=='all'){
    if (opsType==='transfer'){ if(!(t.type==='transfer'||t.type==='envtransfer'||t.type==='envfund')) return false; }
    else if (t.type!==opsType) return false;
  }
  if (opsAcc){ const ids=[t.accountId,t.fromAccountId,t.toAccountId, ...Object.keys(t.accountCredits||{})]; if(!ids.includes(opsAcc)) return false; }
  if (opsCat && opsType!=='transfer'){ if(!txParts(t).some(p=>p.categoryId===opsCat)) return false; }
  if (opsFrom && (t.date||'') < opsFrom) return false;
  if (opsTo && (t.date||'') > opsTo) return false;
  if (opsMin || opsMax){ const ab=Math.abs(toBase(t.amount!=null?t.amount:(t.fromAmount||0), t.currency||t.fromCurrency||state.baseCurrency));
    if (opsMin && ab < (parseFloat(opsMin)||0)) return false;
    if (opsMax && ab > (parseFloat(opsMax)||Infinity)) return false; }
  const q=opsQuery.trim().toLowerCase(); if(!q) return true;
  const c=catById(t.categoryId);

// Чистый капитал (сумма всех счетов, кроме исключённых) на конец указанного дня, в базовой валюте.
// Пересчёт по курсу НА ту дату (rateAt), если есть снимок; иначе по текущему.
function netWorthAt(cutoff){
  const bal={};
  const add=(id,c,d)=>{ if(!id||!c) return; (bal[id] ||= {}); bal[id][c]=round2((bal[id][c]||0)+d); };
  for (const t of state.transactions) {
    if (t.date>cutoff) continue;
    if (t.type==='income') { if(t.accountCredits) for(const [id,cr] of Object.entries(t.accountCredits)){ if(typeof cr==='number') add(id,t.currency,cr); else add(id,cr.cur,cr.amt); } }
    else if (t.type==='expense') { add(t.accountId,t.currency,-t.amount); }
    else if (t.type==='transfer') { if(t.fromAmount!=null){ add(t.fromAccountId,t.fromCurrency,-t.fromAmount); add(t.toAccountId,t.toCurrency,t.toAmount); } else { add(t.fromAccountId,t.currency,-t.amount); add(t.toAccountId,t.currency,t.amount); } }
    else if (t.type==='adjust') { add(t.accountId,t.currency,t.amount); }
  }
  let sum=0;
  for (const a of state.accounts){ if(a.excluded) continue; const m=bal[a.id]||{}; for(const [c,v] of Object.entries(m)) sum+=toBaseAt(v,c,cutoff); }
  return round2(sum);
}
function netWorthChartSVG(pts){

  const x=i=> pad + i*((W-2*pad)/Math.max(1,pts.length-1));
  const y=v=> (H-pad) - ((v-min)/span)*(H-2*pad);
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.val).toFixed(1)}`).join(' ');
  const area=`${pad.toFixed(1)},${(H-pad).toFixed(1)} ${line} ${(W-pad).toFixed(1)},${(H-pad).toFixed(1)}`;
  const li=pts.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" class="u-d-block_ov-visible">
    <polygon points="${area}" fill="var(--accent-soft)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(li).toFixed(1)}" cy="${y(pts[li].val).toFixed(1)}" r="3.5" fill="var(--accent)" vector-effect="non-scaling-stroke"/></svg>`;
}

  const matchPart=p=>(catId==='_none'?!p.categoryId:p.categoryId===catId);
  const src=allT?state.transactions:monthTx();
  const list=src.filter(t=>t.type===kind && txParts(t).some(matchPart)).sort(byDateDesc);
  const c=catId==='_none'?null:catById(catId);
  const total=list.reduce((s,t)=>s+txParts(t).filter(matchPart).reduce((ss,p)=>ss+toBaseAt(p.amount,t.currency,t.date),0),0);
  // строки с кнопкой «назад к категории» (второй аргумент txDetails) + группировка по дате
  const rowHtml = t => opRow(t).replace(`txDetails('${t.id}')`, `txDetails('${t.id}','${catId}')`);
  const groups={}; for(const t of list)(groups[t.date] ||= []).push(t);

}

function donutSVG(segs,total) {
  const r=56,cx=80,cy=80,sw=22,C=2*Math.PI*r; let off=0;
  const arcs=segs.map(s=>{ const len=total>0?s.value/total*C:0;
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off+=len; return el; }).join('');
  const tot=fmtBase(total); const fs=Math.max(8, Math.min(15, Math.round(150/Math.max(6,tot.length))));   // подгоняем шрифт, чтобы сумма влезала в кольцо
  return `<svg width="180" height="180" viewBox="0 0 160 160"><g transform="rotate(-90 ${cx} ${cy})">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${sw}"/>${arcs}</g>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${analysisKind==='expense'?'Расход':'Доход'}</text>
    <text x="${cx}" y="${cy+6+fs/2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="var(--txt)">${tot}</text></svg>`;
}

  const accRow = a => {
    const parts=Object.entries(accBal[a.id]||{}).filter(([,v])=>Math.abs(v)>0.005);

  const activeAcc = activeAccounts();

    const tgtHtml = e.monthlyTarget>0 ? (()=>{ const f=envFundedInMonth(e.id, todayISO().slice(0,7)); const pc=Math.min(100,Math.round(f/e.monthlyTarget*100)); const done=f>=e.monthlyTarget-0.005; const rem=Math.max(0,round2(e.monthlyTarget-f));
      return `<div class="pct" style="color:${done?'var(--green)':'var(--muted)'}">Цель месяца: ${fmtBase(f)} / ${fmtBase(e.monthlyTarget)}${done?' ✓':` · ещё ${fmtBase(rem)}`}</div>

    const spentHtml = e.monthlyLimit>0 ? (()=>{ const sp=envSpentInMonth(e.id, todayISO().slice(0,7)); const pc=Math.min(100,Math.round(sp/e.monthlyLimit*100)); const over=sp>e.monthlyLimit+0.005; const col=over?'var(--red)':pc>=80?'var(--warn-txt)':'var(--muted)';
      return `<div class="pct" style="color:${col}">Расход: ${fmtBase(sp)} / ${fmtBase(e.monthlyLimit)}${over?' · перерасход':''}</div>

  }).join('')||`<div class="li muted">Нет конвертов</div>`;

  const oweSum = totalOwed(owedBal);
  const unalloc = unallocated(accBal, envBal);          // тратимые − закреплённое в конвертах (перерасход не раздувает)

/* ---------- Калькулятор вклада (прогноз) ---------- */
let depCalc={accId:null, start:0, monthly:0, rate:0, years:5};
function depCalcPick(accId){ const a=acc(accId); if(a){ const {accBal}=computeBalances(); depCalc.accId=accId; depCalc.start=round2((accBal[accId]||{})[a.currency]||0); depCalc.rate=a.rate||0; } renderMore(); }
function depCalcSet(f,v){ if(f==='accId'){ if(v) depCalcPick(v); else { depCalc.accId=null; renderMore(); } return; }
  if(f==='years') depCalc.years=Math.max(0,Math.min(60,parseFloat(v)||0)); else depCalc[f]=Math.max(0,parseFloat(v)||0); renderMore(); }
function depositProjection(start, monthly, annualRate, months){
  const i=annualRate/100/12; let bal=round2(start), contributed=round2(start); const yearly=[];
  for(let m=1;m<=months;m++){ bal=round2(bal*(1+i)+monthly); contributed=round2(contributed+monthly);
    if(m%12===0||m===months) yearly.push({month:m, bal, contributed, interest:round2(bal-contributed)}); }
  return {final:round2(bal), contributed:round2(contributed), interest:round2(bal-contributed), yearly};
}
function renderDepositCalc(el){

  const barMax=proj.yearly.length?Math.max(...proj.yearly.map(y=>y.bal)):0;
  const rows=proj.yearly.map(y=>{ const yr=y.month/12; const lab=Number.isInteger(yr)?`${yr} ${plural(yr,'год','года','лет')}`:`${y.month} мес`;

    return `<div class="u-m-8-0"><div class="row u-m-0" ><span class="muted">${lab}</span><span class="u-fw-700">${fmtC(y.bal)}</span></div>
      <div class="u-h-8_br-999_bg-card2_ov-hidden_mt-3"><div style="height:100%;width:${w}%;background:var(--accent)"></div></div>
      <div class="small-note u-mt-2" >из них проценты: ${fmtC(y.interest)}</div></div>`; }).join('');
  el.innerHTML=`<button class="back-btn" onclick="backMore()">${ic('chevl','sm')} Назад</button><h2 class="u-m-0-4-12">Калькулятор вклада</h2>
    ${accSel}
    <label class="field"><span>Начальная сумма (${cur0})</span><input class="input" type="number" inputmode="decimal" value="${depCalc.start||''}" placeholder="0" onchange="depCalcSet('start',this.value)"></label>
    <label class="field"><span>Пополнение в месяц (${cur0})</span><input class="input" type="number" inputmode="decimal" value="${depCalc.monthly||''}" placeholder="0" onchange="depCalcSet('monthly',this.value)"></label>
    <label class="field"><span>Ставка, % годовых</span><input class="input" type="number" inputmode="decimal" value="${depCalc.rate||''}" placeholder="0" onchange="depCalcSet('rate',this.value)"></label>
    <label class="field"><span>Срок, лет</span><input class="input" type="number" inputmode="decimal" value="${depCalc.years||''}" placeholder="5" onchange="depCalcSet('years',this.value)"></label>
    <div class="card tight u-m-6-0-12" >
      <div class="row"><span class="muted">Через ${depCalc.years||0} ${plural(Math.round(depCalc.years||0),'год','года','лет')} будет</span><span  class="green u-fw-800">${fmtC(proj.final)}</span></div>
      <div class="row"><span class="muted">Вложено своими</span><span class="u-fw-700">${fmtC(proj.contributed)}</span></div>

function confirmSheet(message, opts){ opts=opts||{}; return new Promise(res=>{
  const back=document.createElement('div'); back.className='cf-back';
  back.innerHTML=`<div class="cf-box"><div class="cf-msg">${message}</div>
    <div class="cf-btns"><button class="btn sec" data-v="0">${esc(opts.cancelText||'Отмена')}</button><button class="btn ${opts.danger?'danger':''}" data-v="1">${esc(opts.okText||'Подтвердить')}</button></div></div>`;
  document.body.appendChild(back);
  const done=v=>{ back.remove(); res(v); };
  back.addEventListener('click', e=>{ const b=e.target.closest('[data-v]'); if(b){ done(b.dataset.v==='1'); return; } if(e.target===back) done(false); });
}); }

// Собрать entry из существующей операции. edit=true — правим её же; edit=false — повтор новой (дата = сегодня).
function entryFromTx(t, edit){
  const modeMap = { transfer:'transfer', envtransfer:'transfer', income:'income', expense:'expense' };
  const mode = modeMap[t.type]; if(!mode) return null;   // envfund правится отдельно
  const b = buildEntryBase(mode);
  b.editId = edit ? t.id : null;
  b.date = edit ? t.date : todayISO();
  b.note = t.note || '';
  const amtStr = a => { const n=round2(a??0); return n===0 ? '' : String(n); };
  if (t.type==='expense'){
    b.accountId = t.accountId || b.accountId;
    b.envelopeId = t.envelopeId || b.envelopeId;
    b.categoryId = t.categoryId || b.categoryId;
    b.amtStr = amtStr(t.amount);
  } else if (t.type==='income'){
    const creditIds=Object.keys(t.accountCredits||{});
    b.incomeAccountId = creditIds.find(id=>!acc(id)?.investment) || creditIds[0] || b.incomeAccountId;
    b.categoryId = t.categoryId || b.categoryId;
    b.amtStr = amtStr(t.amount);
    b.distribute = t.plan ? Object.keys(t.plan).length>0 : true;
    b.fund = {};
    if (t.plan) for (const id of Object.keys(t.plan)) b.fund[id] = !!(t.distribution && t.distribution[id] > 0.005);
  } else if (t.type==='transfer'){
    b.transferKind='account';
    b.fromAccountId = t.fromAccountId; b.toAccountId = t.toAccountId;
    b.amtStr = amtStr(t.fromAmount!=null ? t.fromAmount : t.amount);
  } else if (t.type==='envtransfer'){
    b.transferKind='envelope';
    b.fromEnvelopeId = t.fromEnvelopeId; b.toEnvelopeId = t.toEnvelopeId; b.currency = t.currency;
    b.amtStr = amtStr(t.amount);

}

}

// Форматирование строки суммы для дисплея (группировка разрядов, сохранение незавершённой дробной части)
function fmtAmtStr(s){ if(s==='') return '0'; const [i,d]=s.split('.'); const gi=Number(i||'0').toLocaleString('ru-RU'); return s.includes('.')?gi+','+(d||''):gi; }  // показываем запятую (ru), внутри amtStr остаётся точка
// Точечное обновление листа ввода на тап клавиатуры — без пересборки всего innerHTML (меньше джанка на слабых телефонах).
// Для дохода/перевода оставляем полный ре-рендер: там живое превью (распределение по конвертам, конвертация валют) зависит от суммы.
function kpTick(){ const e=entry; if(!e) return;
  if(e.mode!=='expense'){ renderEntry(); return; }
  const disp=sheet.querySelector('.amount-disp'); if(!disp){ renderEntry(); return; }
  const amtNum=parseFloat(e.amtStr||'0')||0;
  disp.innerHTML=`${fmtAmtStr(e.amtStr)}<span class="c">${cur(entryCurrency()).symbol}</span>`;
  const cw=sheet.querySelector('.amt-clear-wrap'); if(cw) cw.innerHTML = e.amtStr!=='' ? `<button class="amt-clear" onclick="kpClear()">очистить</button>` : '';
  const save=sheet.querySelector('.entry-save'); if(save) save.classList.toggle('off', !(amtNum>0));
  const insuff=sheet.querySelector('.exp-insuff');   // индикатор нехватки средств обновляем вживую при наборе
  if(insuff){ const code=accCur(e.accountId); const {accBal}=computeBalances(); const have=(accBal[e.accountId]||{})[code]||0; insuff.textContent = amtNum>have ? ' (не хватает)' : ''; } }
function kp(k){ let s=entry.amtStr; haptic(6);
  if(k==='.'){ if(s.includes('.'))return; if(s==='')s='0'; s+='.'; }
  else { if(s.includes('.')&&s.split('.')[1].length>=2)return; if(s==='0')s=''; s+=k; }
  entry.amtStr=s; kpTick(); }
function kpDel(){ haptic(6); entry.amtStr=entry.amtStr.slice(0,-1); kpTick(); }
function kpClear(){ haptic(8); entry.amtStr=''; kpTick(); }

/* ---------- Шаблоны быстрого ввода ----------
   Снимок полей ввода (счёт/конверт/категория/комментарий, по желанию сумма) под именем.
   Тап по чипу в листе ввода мгновенно подставляет всё — самый частый сценарий в один тап. */
function templateFromEntry(label){
  const e=entry; const t={ id:uid(), mode:e.mode, label:label, note:e.note||'', amtStr:e.amtStr||'', currency:entryCurrency(), categoryId:e.categoryId };
  if (e.mode==='expense'){ t.accountId=e.accountId; t.envelopeId=e.envelopeId; }
  else if (e.mode==='income'){ t.incomeAccountId=e.incomeAccountId; t.distribute=e.distribute; t.distMode=e.distMode; t.eqSel={...e.eqSel}; t.fund={...e.fund}; }
  else if (e.mode==='transfer'){ t.transferKind=e.transferKind; t.fromAccountId=e.fromAccountId; t.toAccountId=e.toAccountId; t.fromEnvelopeId=e.fromEnvelopeId; t.toEnvelopeId=e.toEnvelopeId; }
  return t;
}
function applyTemplate(id){
  const t=(state.templates||[]).find(x=>x.id===id); if(!t||!entry) return;
  const e=entry; e.mode=t.mode;
  if (t.note) e.note=t.note;                 // пустая заметка в шаблоне не затирает уже введённую
  if (t.amtStr) e.amtStr=t.amtStr;           // шаблон без суммы не стирает уже набранную сумму
  if (t.categoryId && catById(t.categoryId)) e.categoryId=t.categoryId;
  if (t.mode==='expense'){ if(acc(t.accountId)) e.accountId=t.accountId; if(env(t.envelopeId)) e.envelopeId=t.envelopeId; }
  else if (t.mode==='income'){ if(acc(t.incomeAccountId)) e.incomeAccountId=t.incomeAccountId; if(t.distribute!=null) e.distribute=t.distribute; if(t.distMode) e.distMode=t.distMode;
    if(t.eqSel) e.eqSel={...t.eqSel}; if(t.fund) e.fund={...t.fund}; }
  else if (t.mode==='transfer'){ e.transferKind=t.transferKind||'account';
    if(acc(t.fromAccountId)) e.fromAccountId=t.fromAccountId; if(acc(t.toAccountId)) e.toAccountId=t.toAccountId;
    if(env(t.fromEnvelopeId)) e.fromEnvelopeId=t.fromEnvelopeId; if(env(t.toEnvelopeId)) e.toEnvelopeId=t.toEnvelopeId;
    if(e.transferKind==='envelope' && t.currency) e.currency=t.currency; }   // перевод между конвертами хранит валюту вручную — восстанавливаем
  catExpanded=false; entryFirstRender=true; haptic(6); renderEntry();
}
function openSaveTemplate(){
  if(!entry) return; const e=entry;
  const defLabel=(catById(e.categoryId)?.name) || (e.note? e.note.slice(0,24) : (e.mode==='income'?'Доход':e.mode==='transfer'?'Перевод':'Расход'));
  openSheet(`<div class="section-title u-mt-0" >Сохранить как шаблон</div>
    <div class="small-note u-m-0-2-8" >Запомню счёт, конверт и категорию${e.amtStr?', а также сумму':''} — потом вставлю в один тап.</div>
    <input class="input" id="tplName" placeholder="Название шаблона" value="${esc(defLabel)}" maxlength="28">
    <label class="row u-m-12-2_g-10_cur-pointer" ><input type="checkbox" id="tplAmt" ${e.amtStr?'checked':''}> <span>Запомнить сумму${e.amtStr?' ('+fmt(parseFloat(e.amtStr||'0'),entryCurrency())+')':''}</span></label>
    <div class="two"><button class="btn sec" onclick="renderEntry()">Отмена</button><button class="btn" onclick="confirmSaveTemplate()">Сохранить</button></div>`);
  setTimeout(()=>{ const i=document.getElementById('tplName'); if(i){ i.focus(); i.select(); } }, 30);
}
function confirmSaveTemplate(){
  const name=(document.getElementById('tplName')?.value||'').trim();
  const keepAmt=!!document.getElementById('tplAmt')?.checked;
  if(!name){ toast('Введи название'); return; }
  const t=templateFromEntry(name); if(!keepAmt) t.amtStr='';
  state.templates ||= []; state.templates.push(t); save();
  toast('Шаблон сохранён ✓'); renderEntry();
}
function openTemplatesManager(){
  const list=(state.templates||[]); const modeName={expense:'Расход',income:'Доход',transfer:'Перевод'};
  openSheet(`<div class="section-title u-mt-0" >Шаблоны</div>
    ${list.length?`<div class="small-note u-m-0-2-8" >Порядок здесь = порядок чипов в окне операции.</div>`:''}
    ${list.length? list.map((t,i)=>`<div class="row u-p-10-2_bb-1-solid-line_g-6" >
      <span class="grow">⚡ ${esc(t.label)} <span class="muted u-fs-12" >· ${modeName[t.mode]||''}${t.amtStr?' · '+fmt(parseFloat(t.amtStr||'0'),t.currency||state.baseCurrency):''}</span></span>
      <button class="icon-btn" ${i===0?'disabled':''} onclick="moveTemplate('${t.id}',-1)" aria-label="Переместить выше">${ic('arrowup','sm')}</button>
      <button class="icon-btn" ${i===list.length-1?'disabled':''} onclick="moveTemplate('${t.id}',1)" aria-label="Переместить ниже">${ic('arrowdown','sm')}</button>
      <button class="icon-btn" onclick="renameTemplate('${t.id}')" aria-label="Переименовать">${ic('pencil','sm')}</button>
      <button class="btn sec small" onclick="delTemplate('${t.id}')">Удалить</button></div>`).join('')
      : '<div class="empty">Пока нет шаблонов.<br>Сохрани ввод кнопкой «＋ шаблон» в окне операции.</div>'}
    <button class="btn u-mt-14"  onclick="renderEntry()">Готово</button>`);
}
function moveTemplate(id,dir){ const a=state.templates||[]; const i=a.findIndex(t=>t.id===id); if(i<0) return;
  const j=i+dir; if(j<0||j>=a.length) return; const t=a.splice(i,1)[0]; a.splice(j,0,t); save(); openTemplatesManager(); }
function renameTemplate(id){ const t=(state.templates||[]).find(x=>x.id===id); if(!t) return;
  openSheet(`<div class="section-title u-mt-0" >Переименовать шаблон</div>
    <input class="input" id="tplRename" value="${esc(t.label)}" maxlength="28">
    <div class="two u-mt-12" ><button class="btn sec" onclick="openTemplatesManager()">Отмена</button><button class="btn" onclick="saveTemplateName('${id}')">Сохранить</button></div>`);
  setTimeout(()=>{ const el=document.getElementById('tplRename'); if(el){ el.focus(); el.select(); } },30); }
function saveTemplateName(id){ const v=(document.getElementById('tplRename')?.value||'').trim(); if(!v){ toast('Введи название'); return; }
  const t=(state.templates||[]).find(x=>x.id===id); if(t){ t.label=v; save(); } openTemplatesManager(); }
async function delTemplate(id){
  const ok=await confirmSheet('Удалить этот шаблон?',{okText:'Удалить',danger:true}); if(!ok) return;
  state.templates=(state.templates||[]).filter(t=>t.id!==id); tomb(id); save(); openTemplatesManager();
}
function saveEntry() {
  const e=entry, amt=round2(parseFloat(e.amtStr||'0')||0);
  if (amt<=0){ toast('Введи сумму'); return; }
  if (!isRealDate(e.date)){ toast('Укажи корректную дату'); return; }   // 1.0.6: реальная дата (как требует валидатор), не только формат
  let tx;
  if (e.mode==='transfer') {
    if (e.transferKind==='account') {
      if (e.fromAccountId===e.toAccountId){ toast('Выбери разные счета'); return; }
      const fc=accCur(e.fromAccountId), tc=accCur(e.toAccountId);
      const toAmt=convert(amt,fc,tc);
      if (!(toAmt>0)){ toast('Сумма слишком мала для перевода между этими валютами — на счёт зачислилось бы 0'); return; }   // иначе деньги списались бы, а не зачислились (и такая операция не проходит проверку целостности)
      tx={id:uid(),type:'transfer',date:e.date,fromAccountId:e.fromAccountId,toAccountId:e.toAccountId,
        fromAmount:amt,fromCurrency:fc,toAmount:toAmt,toCurrency:tc,note:e.note};
    } else {
      if (e.fromEnvelopeId===e.toEnvelopeId){ toast('Выбери разные конверты'); return; }
      tx={id:uid(),type:'envtransfer',date:e.date,currency:e.currency,amount:amt,fromEnvelopeId:e.fromEnvelopeId,toEnvelopeId:e.toEnvelopeId,note:e.note};
    }
  } else if (e.mode==='income') {
    if (!e.incomeAccountId){ toast('Выбери счёт зачисления'); return; }
    const main=acc(e.incomeAccountId);
    if (main && (main.excluded || (!main.investment && !e.distribute))) {
      // Просто зачисление на счёт — без распределения по конвертам и без долга
      const mainCur=main.currency||state.baseCurrency;
      tx={id:uid(),type:'income',date:e.date,currency:mainCur,amount:amt,categoryId:e.categoryId,note:e.note,
        accountCredits:{[e.incomeAccountId]:{amt:round2(amt),cur:mainCur}}, plan:{}, distribution:{}};
    } else if (e.distMode==='equal') {
      // Режим «Поровну»: остаток делится поровну между отмеченными конвертами (без долга — plan=distribution).
      const {accountCredits, remainder, distCurrency}=computeIncome(amt, e.incomeAccountId);
      const selIds=activeEnvelopes().filter(v=>e.eqSel[v.id]).map(v=>v.id);
      const distribution={};
      if (selIds.length){ const each=round2(remainder/selIds.length); let acc2=0;
        selIds.forEach((id,i)=>{ const val = i===selIds.length-1 ? round2(remainder-acc2) : each; distribution[id]=val; acc2=round2(acc2+val); });
        const lastId=selIds[selIds.length-1];   // та же защита от отрицательной доли последнего при округлении
        if(distribution[lastId]<0){ const need=round2(-distribution[lastId]); distribution[lastId]=0; let bigId=selIds[0]; for(const id of selIds) if(distribution[id]>distribution[bigId]) bigId=id; distribution[bigId]=round2(distribution[bigId]-need); } }
      tx={id:uid(),type:'income',date:e.date,currency:distCurrency,amount:amt,categoryId:e.categoryId,note:e.note,accountCredits,plan:distribution,distribution};
    } else {
      // H4: если правим существующий доход и сумма+счёт не изменились — сохраняем ИСХОДНУЮ раскладку
      // (проценты конвертов и off-top на момент создания), меняя лишь галочки «оплачено сейчас».
      const orig = e.editId ? state.transactions.find(t=>t.id===e.editId) : null;
      const origMain = (orig && orig.type==='income' && orig.accountCredits) ? (Object.keys(orig.accountCredits).find(id=>!acc(id)?.investment) || Object.keys(orig.accountCredits)[0]) : null;
      const keepOrig = orig && orig.plan && origMain===e.incomeAccountId && round2(orig.amount)===amt;
      if (keepOrig) {
        const distribution={};
        for (const [id,p] of Object.entries(orig.plan)) if (e.fund[id]!==false) distribution[id]=p;
        tx={id:uid(),type:'income',date:e.date,currency:orig.currency,amount:amt,categoryId:e.categoryId,note:e.note,accountCredits:orig.accountCredits,plan:orig.plan,distribution};
      } else {
        const {accountCredits,distribution:plan,distCurrency}=computeIncome(amt,e.incomeAccountId);
        // Фактически кладём в конверты только отмеченные; остальное — в долг конвертам (деньги остаются на счёте)
        const distribution={};
        for (const [id,p] of Object.entries(plan)) if (e.fund[id]!==false) distribution[id]=p;
        tx={id:uid(),type:'income',date:e.date,currency:distCurrency,amount:amt,categoryId:e.categoryId,note:e.note,accountCredits,plan,distribution};
      }
    }
  } else {
    if (!e.accountId){ toast('Выбери счёт'); return; }
    const ax=acc(e.accountId); const noEnv=!!(ax&&(ax.investment||ax.excluded));
    tx={id:uid(),type:'expense',date:e.date,currency:accCur(e.accountId),amount:amt,accountId:e.accountId,envelopeId:noEnv?null:e.envelopeId,categoryId:e.categoryId,note:e.note};
    if(e.eventId){ const ev=(state.events||[]).find(x=>x.id===e.eventId); if(ev) ev.done=true; }   // провели событие календаря → помечаем выполненным
  }
  if (e.editId){ tx.id=e.editId; const i=state.transactions.findIndex(t=>t.id===e.editId);
    if (i>=0) state.transactions[i]=tx; else state.transactions.push(tx); }
  else state.transactions.push(tx);
  save(); closeSheet(); haptic();
  const ym=e.date.slice(0,7); if(ym!==viewMonth) viewMonth=ym;
  toast(e.editId?'Изменено ✓':'Сохранено ✓'); render();
}

/* ---------- Детали операции ---------- */
/* ---------- Разделение расхода на части (split) ---------- */
let splitDraft=null;
function openSplitFromEntry(){ const e=entry; const amt=round2(parseFloat(e.amtStr||'0')||0);
  openSplitExpense({accountId:e.accountId, date:e.date, note:e.note, target:amt>0?amt:0, rows:[]}); }
function openSplitExpense(pf){
  pf=pf||{};
  const sp=spendableAccounts(), accs=sp.length?sp:activeAccounts();
  const defCat=()=>state.categories.find(c=>c.kind==='expense')?.id||null;
  const defEnv=()=>activeEnvelopes()[0]?.id||null;
  splitDraft={ editId:pf.editId||null, accountId:pf.accountId||accs[0]?.id||activeAccounts()[0]?.id, date:pf.date||todayISO(), note:pf.note||'', target:round2(pf.target||0),
    rows:(pf.rows&&pf.rows.length)?pf.rows.map(r=>({categoryId:r.categoryId||defCat(), envelopeId:r.envelopeId||null, amount:round2(r.amount||0)}))
      :[{categoryId:defCat(), envelopeId:defEnv(), amount:0},{categoryId:defCat(), envelopeId:defEnv(), amount:0}] };
  renderSplit();
}
function renderSplit(){
  const d=splitDraft; if(!d) return; const a=acc(d.accountId); const noEnv=!!(a&&(a.investment||a.excluded)); const code=accCur(d.accountId);
  const sum=round2(d.rows.reduce((s,r)=>s+(r.amount||0),0));
  const rem=d.target>0?round2(d.target-sum):0;
  const cats=state.categories.filter(c=>c.kind==='expense');
  const catOpt=sel=>cats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.icon+' '+c.name)}</option>`).join('');
  const envOpt=sel=>`<option value="" ${!sel?'selected':''}>— без конверта —</option>`+activeEnvelopes().map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('');
  const rows=d.rows.map((r,i)=>`<div class="card tight u-mb-8" >
    <div class="two"><select class="input" onchange="splitSetRow(${i},'categoryId',this.value)">${catOpt(r.categoryId)}</select>
      <input class="input" type="number" inputmode="decimal" placeholder="0" value="${r.amount||''}" onchange="splitSetRow(${i},'amount',this.value)"></div>
    ${noEnv?'':`<select class="input u-mt-8"  onchange="splitSetRow(${i},'envelopeId',this.value)">${envOpt(r.envelopeId)}</select>`}
    ${d.rows.length>1?`<button class="btn sec small u-mt-8"  onclick="splitDelRow(${i})">Убрать часть</button>`:''}</div>`).join('');
  const accSel=`<select class="input" onchange="splitSetField('accountId',this.value)">${activeAccounts().map(x=>`<option value="${x.id}" ${x.id===d.accountId?'selected':''}>${esc(x.icon+' '+x.name)} · ${x.currency}</option>`).join('')}</select>`;
  const remLine = d.target>0
    ? `<div class="info-line" style="margin-top:6px${Math.abs(rem)>0.005?';background:var(--red-soft);color:var(--red)':''}">Части: <b>${fmt(sum,code)}</b> из <b>${fmt(d.target,code)}</b>${Math.abs(rem)>0.005?` · осталось ${fmt(rem,code)}`:' ✓'}</div>`
    : `<div class="info-line u-mt-6" >Итого: <b>${fmt(sum,code)}</b></div>`;
  openSheet(`<h2>✂️ ${d.editId?'Изменить разделённый расход':'Разделить расход'}</h2>
    <label class="field"><span>Счёт списания</span>${accSel}</label>
    <label class="field"><span>Дата</span><input class="input" type="date" value="${d.date}" onchange="splitSetField('date',this.value)"></label>
    <label class="field"><span>Комментарий</span><input class="input" value="${esc(d.note)}" oninput="splitSetField('note',this.value)"></label>
    <div class="small-note u-m-2-2-8" >Одна покупка — несколько категорий/конвертов. Деньги спишутся со счёта один раз; сумма частей = сумма покупки.</div>
    ${rows}
    <button class="btn sec" onclick="splitAddRow()">${ic('plus','sm')} Добавить часть</button>
    ${remLine}
    <button class="btn u-mt-12"  onclick="saveSplitExpense()">${d.editId?'Сохранить':'Сохранить расход'}</button>`);
}
function splitSetField(f,v){ if(!splitDraft) return; splitDraft[f]=v; if(f==='accountId') renderSplit(); }
function splitSetRow(i,f,v){ const r=splitDraft&&splitDraft.rows[i]; if(!r) return;
  if(f==='amount') r.amount=Math.max(0,round2(parseFloat(v)||0)); else if(f==='envelopeId') r.envelopeId=v||null; else r[f]=v; renderSplit(); }
function splitAddRow(){ if(!splitDraft) return; const last=splitDraft.rows[splitDraft.rows.length-1];
  splitDraft.rows.push({categoryId:state.categories.find(c=>c.kind==='expense')?.id||null, envelopeId:last?last.envelopeId:(activeEnvelopes()[0]?.id||null), amount:0}); renderSplit(); }
function splitDelRow(i){ if(!splitDraft) return; splitDraft.rows.splice(i,1);
  if(!splitDraft.rows.length) splitDraft.rows.push({categoryId:state.categories.find(c=>c.kind==='expense')?.id||null, envelopeId:null, amount:0}); renderSplit(); }
function saveSplitExpense(){
  const d=splitDraft; if(!d) return; const a=acc(d.accountId); if(!a){ toast('Выбери счёт'); return; }
  if(!isRealDate(d.date)){ toast('Укажи дату'); return; }
  const noEnv=!!(a.investment||a.excluded);
  const rows=d.rows.map(r=>({categoryId:r.categoryId||null, envelopeId:noEnv?null:(r.envelopeId||null), amount:round2(r.amount||0)})).filter(r=>r.amount>0);
  if(rows.length<2){ toast('Нужно хотя бы 2 части с суммой'); return; }
  const sum=round2(rows.reduce((s,r)=>s+r.amount,0));
  if(d.target>0 && Math.abs(d.target-sum)>0.005){ toast('Сумма частей должна равняться '+fmt(d.target,a.currency)); return; }
  const tx={ id:uid(), type:'expense', date:d.date, currency:a.currency, amount:sum, accountId:d.accountId,
    categoryId:rows[0].categoryId, envelopeId:rows[0].envelopeId, note:d.note, splits:rows };
  if(d.editId){ tx.id=d.editId; const i=state.transactions.findIndex(t=>t.id===d.editId); if(i>=0) state.transactions[i]=tx; else state.transactions.push(tx); }
  else state.transactions.push(tx);
  save(); closeSheet(); splitDraft=null; haptic(); const ym=d.date.slice(0,7); if(ym!==viewMonth) viewMonth=ym; toast(d.editId?'Изменено ✓':'Сохранено ✓'); render();
}
function txDetails(id, backCat) {
  const t=state.transactions.find(x=>x.id===id); if(!t) return;
  let body, head;
  if (t.type==='income') {
    head='Доход'; const acc_=Object.entries(t.accountCredits||{}).map(([id,cr])=>{ const amt=typeof cr==='number'?cr:cr.amt, c=typeof cr==='number'?t.currency:cr.cur;
      return `<div class="preview-line"><span>${esc(acc(id)?.name||'счёт')}</span><b>+${fmt(amt,c)}</b></div>`; }).join('');
    const distEntries=Object.entries(t.distribution||{}).filter(([,a])=>a>0.005);
    const env_=distEntries.map(([id,a])=>`<div class="preview-line"><span>${esc(env(id)?.name||'удалён')}</span><b>${fmt(a,t.currency)}</b></div>`).join('');

async function sweepEnvelope(envId){ const e=env(envId); if(!e) return; const {envBal}=computeBalances();

// Этап 3: перекрыть минус конверта переводом из другого конверта (готовый envtransfer).
function coverOverspend(envId){
  const {envBal}=computeBalances(); const deficit=Math.max(0, round2(-envelopeBase(envBal,envId)));
  entry=buildEntryBase('transfer'); entry.transferKind='envelope'; entry.toEnvelopeId=envId; entry.currency=state.baseCurrency;
  const cand=activeEnvelopes().filter(e=>e.id!==envId).map(e=>({id:e.id,b:envelopeBase(envBal,e.id)})).sort((a,b)=>b.b-a.b)[0];
  if(cand) entry.fromEnvelopeId=cand.id;
  entry.amtStr=deficit>0?String(deficit):'';
  entryFirstRender=true; renderEntry(); showSheetShell();
}

/* =================================================================
   Повторяющиеся платежи (аренда, подписки, зарплата…)
   ================================================================= */
function recurDate(r, ym){ const d=Math.min(r.day||1, daysInMonth(ym)); return `${ym}-${String(d).padStart(2,'0')}`; }
function dueRecurring(){
  const ym=todayISO().slice(0,7), today=+todayISO().slice(8,10);
  return state.recurring.filter(r => r.active!==false && r.lastPosted!==ym && Math.min(r.day||1, daysInMonth(ym))<=today && acc(r.accountId));
}
const ymNext = ym => { let [y,m]=ym.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
// Провести ОДИН экземпляр шаблона за указанный месяц (без save/render)
function _postRecurringMonth(r, ym){
  const a=acc(r.accountId); if(!a) return false;
  const date=recurDate(r,ym); let tx;
  if (r.type==='income'){
    const {accountCredits,distribution:plan,distCurrency}=computeIncome(round2(r.amount), r.accountId);
    tx={id:'rc_'+r.id+'_'+ym,type:'income',date,currency:distCurrency,amount:round2(r.amount),categoryId:r.categoryId,note:r.note||'',accountCredits,plan,distribution:{...plan}};
  } else {
    tx={id:'rc_'+r.id+'_'+ym,type:'expense',date,currency:a.currency,amount:round2(r.amount),accountId:r.accountId,envelopeId:a.investment?null:r.envelopeId,categoryId:r.categoryId,note:r.note||''};
  }
  // id ДЕТЕРМИНИРОВАН (шаблон + месяц): если два устройства проведут один и тот же платёж одновременно, слияние по id сольёт их в одну операцию, а не задвоит.
  tx.recurId=r.id; tx.recurYm=ym; state.transactions.push(tx); return true;   // метки: защита от повторного проведения того же шаблона за тот же месяц
}
// M5: провести шаблон за ВСЕ пропущенные месяцы (от lastPosted+1 до текущего). Возвращает число проведённых.
function _postRecurring(r){
  if(!acc(r.accountId)) return 0;
  const nowYm=todayISO().slice(0,7), today=+todayISO().slice(8,10);
  const lp = /^20\d\d-(0[1-9]|1[0-2])$/.test(String(r.lastPosted||'')) ? r.lastPosted : null;   // «мусорный» lastPosted (правка вручную) = «не проводился»: раньше '9999-12' создавал 123 тыс. операций
  let ym = lp ? ymNext(lp) : nowYm;   // новые шаблоны не бэкфиллим до момента создания
  { const [ny,nm]=nowYm.split('-').map(Number), t=ny*12+(nm-1)-59, floorYm=`${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`; if(ym<floorYm) ym=floorYm; }   // догоняем не более 60 месяцев (включая текущий)
  let n=0;
  while(ym<=nowYm){
    const dueDay=Math.min(r.day||1, daysInMonth(ym));
    if(ym<nowYm || dueDay<=today){
      if(state.transactions.some(t=>t.recurId===r.id && t.recurYm===ym)){ r.lastPosted=ym; }   // уже есть операция за этот месяц — не дублируем (защита от сбоя lastPosted/синхронизации)
      else if(_postRecurringMonth(r,ym)){ n++; r.lastPosted=ym; }
    }
    ym=ymNext(ym);
  }
  return n;
}
function postRecurring(id){ const r=state.recurring.find(x=>x.id===id); if(!r) return;
  if(!acc(r.accountId)){ toast('Счёт удалён — поправь шаблон'); return; }
  const n=_postRecurring(r); if(!n){ toast('Пока нечего вносить'); return; }
  save(); toast(n>1?`Внесено за ${n} мес ✓`:'Внесено ✓'); render(); }
// Массовая кнопка «Внести платежи» проводит только ручные (!auto) — ровно те, что показаны в баннере.
// Авто-платежи проводятся сами при запуске/синхронизации (autoPostDueRecurring), в баннере их нет.
function postAllDueRecurring(){ let n=0; state.recurring.filter(r=>r.active!==false&&!r.auto&&acc(r.accountId)).forEach(r=>{ n+=_postRecurring(r); });
  if(n){ save(); toast(`Внесено: ${n}`); render(); } }
function toggleRecurring(id){ const r=state.recurring.find(x=>x.id===id); if(!r) return; r.active = r.active===false; save(); renderMore(); }
// Автоматически провести повторяющиеся с флагом «авто» за все пропущенные месяцы (при запуске приложения)
function autoPostDueRecurring(){ let n=0; state.recurring.filter(r=>r.auto&&r.active!==false&&acc(r.accountId)).forEach(r=>{ n+=_postRecurring(r); }); if(n) save(); return n; }

/* ---------- Календарь платежей (предстоящие обязательства) ---------- */
function payAgendaItems(){
  const today=todayISO(); const ym=today.slice(0,7); const nextYm=ymNext(ym); const todayD=+today.slice(8,10);
  const items=[];
  for(const r of state.recurring){ if(r.active===false) continue;
    for(const y of [ym,nextYm]){ if(y===ym && r.lastPosted===ym) continue;
      const dueNow=(y===ym && Math.min(r.day||1,daysInMonth(ym))<=todayD && acc(r.accountId));
      items.push({date:recurDate(r,y), kind:'recur', id:r.id, type:r.type, amount:r.amount, currency:r.currency,
        title:r.note||catById(r.categoryId)?.name||(r.type==='income'?'Доход':'Платёж'), canPost:!!dueNow}); } }
  for(const d of state.debts){ const rem=debtRemaining(d); if(rem<=0.005||!d.dueDate) continue;
    items.push({date:d.dueDate, kind:'debt', id:d.id, type:d.direction==='iowe'?'expense':'income', amount:rem, currency:d.currency,
      title:(d.direction==='iowe'?'Вернуть долг · ':'Ждут возврат · ')+(d.counterparty||'—')}); }
  for(const ev of (state.events||[])){ if(ev.done) continue;
    items.push({date:ev.date, kind:'event', id:ev.id, type:'expense', amount:ev.amount, currency:ev.currency, title:ev.title||'Событие'}); }
  items.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return items;
}
let calMonth=null;
function calShift(d){ let [y,m]=calMonth.split('-').map(Number); m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} calMonth=`${y}-${String(m).padStart(2,'0')}`; renderMore(); }
function calToday(){ calMonth=todayISO().slice(0,7); renderMore(); }
// Все элементы календаря за месяц ym: регулярные платежи, долги со сроком, планируемые события.
function calItems(ym){
  const items=[]; const todayD=+todayISO().slice(8,10); const curYm=todayISO().slice(0,7);
  for(const r of state.recurring){ if(r.active===false) continue; const date=recurDate(r,ym);
    const posted=(ym===curYm && r.lastPosted===ym); const due=(ym===curYm && Math.min(r.day||1,daysInMonth(ym))<=todayD && !posted && acc(r.accountId));
    items.push({date, kind:'recur', id:r.id, type:r.type, amount:r.amount, currency:r.currency, title:r.note||catById(r.categoryId)?.name||(r.type==='income'?'Доход':'Платёж'), canPost:!!due, done:posted, icon:catById(r.categoryId)?.icon||'🔁'}); }
  for(const d of state.debts){ if(!d.dueDate || d.dueDate.slice(0,7)!==ym) continue; const rem=debtRemaining(d); if(rem<=0.005) continue;
    items.push({date:d.dueDate, kind:'debt', id:d.id, type:d.direction==='iowe'?'expense':'income', amount:rem, currency:d.currency, title:(d.direction==='iowe'?'Вернуть · ':'Ждут возврат · ')+(d.counterparty||'—'), icon:'🤝'}); }
  for(const ev of state.events){ if((ev.date||'').slice(0,7)!==ym) continue;
    items.push({date:ev.date, kind:'event', id:ev.id, type:'expense', amount:ev.amount, currency:ev.currency, title:ev.title||'Событие', envelopeId:ev.envelopeId, done:ev.done, icon:ev.icon||'🎁'}); }
  return items.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
}
const calColor = it => it.kind==='event' ? 'var(--accent)' : (it.type==='income'?'var(--green)':'var(--red)');
function renderPayCalendar(el){
  if(!calMonth) calMonth=todayISO().slice(0,7);
  const today=todayISO(); const ym=calMonth; const items=calItems(ym);
  const dayMap={}; items.forEach(it=>{ const d=+it.date.slice(8,10); (dayMap[d] ||= []).push(it); });
  const [y,m]=ym.split('-').map(Number); const lead=(new Date(y,m-1,1).getDay()+6)%7; const dim=daysInMonth(ym);
  const cells=[]; for(let i=0;i<lead;i++) cells.push(null); for(let dd=1;dd<=dim;dd++) cells.push(dd); while(cells.length%7) cells.push(null);
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const grid=`<div class="cal-grid">${WD.map(w=>`<div class="cal-wd">${w}</div>`).join('')}${cells.map(dd=>{
      if(dd===null) return `<div class="cal-cell empty"></div>`;
      const ds=`${ym}-${String(dd).padStart(2,'0')}`; const its=dayMap[dd]||[]; const isToday=ds===today; const past=ds<today;
      const dots=its.slice(0,4).map(it=>`<span class="cal-dot" style="background:${calColor(it)};${it.done?'opacity:.35':''}"></span>`).join('');
      return `<div class="cal-cell ${isToday?'today':''} ${past?'past':''} ${its.length?'has':''}" onclick="openCalDay('${ds}')"><div class="cal-d">${dd}</div><div class="cal-dots">${dots}</div></div>`;
    }).join('')}</div>
    <div class="cal-legend"><span><i class="u-bg-accent"></i>событие</span><span><i class="u-bg-red"></i>расход/долг</span><span><i class="u-bg-green"></i>доход</span></div>`;
  const {envBal}=computeBalances();
  const cov=(()=>{ const byEnv={}; for(const ev of state.events){ if(ev.done||!ev.envelopeId) continue; byEnv[ev.envelopeId]=round2((byEnv[ev.envelopeId]||0)+toBase(ev.amount,ev.currency)); }
    const rows=Object.entries(byEnv).map(([eid,planned])=>{ const e=env(eid); if(!e) return ''; const bal=round2(envelopeBase(envBal,eid)); const ok=bal>=planned-0.005;
      return `<div class="row u-mt-9_ai-flex-start" ><span class="grow">${e.icon||'✉️'} ${esc(e.name)}</span><span class="u-ta-right"><b class="${ok?'green':'red'}">${fmtBase(planned)}</b> <span class="muted">из ${fmtBase(bal)}</span><br><span class="small-note ${ok?'green':'red'}">${ok?'хватает ✓':'не хватает '+fmtBase(planned-bal)}</span></span></div>`; }).join('');
    return rows?`<div class="card tight u-mt-12" ><div class="section-title u-m-0-0-2" >🎁 Запланировано из конвертов</div>${rows}</div>`:''; })();
  const monExp=round2(items.filter(i=>i.type==='expense'&&!i.done).reduce((s,i)=>s+toBase(i.amount,i.currency),0));
  const monInc=round2(items.filter(i=>i.type==='income'&&!i.done).reduce((s,i)=>s+toBase(i.amount,i.currency),0));
  const addDate=(ym===today.slice(0,7))?today:ym+'-01';
  el.innerHTML=`<button class="back-btn" onclick="backMore()">${ic('chevl','sm')} Назад</button>
    <div class="cal-head"><h2 class="u-m-0">Календарь</h2>
      <div class="cal-nav"><button onclick="calShift(-1)" aria-label="Пред. месяц">‹</button><span class="cal-title">${monthLabel(ym)}</span><button onclick="calShift(1)" aria-label="След. месяц">›</button><button class="btn sec small u-ml-6"  onclick="calToday()">Сегодня</button></div></div>
    ${grid}
    <div class="card tight u-mt-14" ><div class="row"><span class="muted">К оплате за ${monthLabel(ym)}</span><span class="red u-fw-800" >${fmtBase(monExp)}</span></div>
      ${monInc>0.5?`<div class="row"><span class="muted">Ожидается доход</span><span class="green u-fw-800" >${fmtBase(monInc)}</span></div>`:''}</div>
    ${cov}
    <button class="btn u-mt-12"  onclick="openEvent(null,'${addDate}')">${ic('plus','sm')} Добавить событие</button>
    <div class="small-note u-mt-10" >Нажми на день, чтобы увидеть и добавить события. 🎁 События (подарки, праздники) привязываются к конверту — видно, хватает ли на них денег. «Провести» создаёт реальный расход.</div>`;
}
function openCalDay(ds){
  const items=calItems(ds.slice(0,7)).filter(i=>i.date===ds);
  const rowHtml=i=>{ const sign=i.type==='income'?'+':'−'; const cls=i.type==='income'?'green':'red';
    let actions='';
    if(i.kind==='recur'&&i.canPost) actions=`<button class="btn small sec u-mt-6"  onclick="postRecurring('${i.id}');closeSheet()">Внести</button>`;
    else if(i.kind==='event'&&!i.done) actions=`<div class="u-d-flex_g-6_mt-6_jc-flex-end"><button class="btn small sec" onclick="postEvent('${i.id}')">Провести</button><button class="btn small sec" onclick="openEvent('${i.id}')" aria-label="Изменить событие">${ic('pencil','sm')}</button></div>`;
    else if(i.kind==='event'&&i.done) actions=`<div class="u-mt-6"><span class="badge u-c-green" >проведено</span> <button class="btn small sec" onclick="openEvent('${i.id}')" aria-label="Изменить событие">${ic('pencil','sm')}</button></div>`;
    return `<div class="op u-cur-default" ><div class="cat-ic u-bg-card2" >${i.icon||'•'}</div>
      <div class="oi"><div class="ot">${esc(i.title)}</div><div class="os">${i.kind==='event'?(i.envelopeId?('конверт «'+esc(env(i.envelopeId)?.name||'')+'»'):'без конверта'):(i.kind==='recur'?'регулярный платёж':'долг со сроком')}</div></div>
      <div class="u-ta-right_fl-0-0-auto"><div class="oa ${cls}">${sign}${fmt(i.amount,i.currency)}</div>${actions}</div></div>`; };
  const dExp=round2(items.filter(i=>i.type==='expense'&&!i.done).reduce((s,i)=>s+toBase(i.amount,i.currency),0));
  const dInc=round2(items.filter(i=>i.type==='income'&&!i.done).reduce((s,i)=>s+toBase(i.amount,i.currency),0));
  const daySum=(dExp>0.5||dInc>0.5)?`<div class="small-note u-m-n4-0-10" >${dExp>0.5?`К оплате: <b class="red">${fmtBase(dExp)}</b>`:''}${(dExp>0.5&&dInc>0.5)?' · ':''}${dInc>0.5?`ожидается: <b class="green">${fmtBase(dInc)}</b>`:''}</div>`:'';
  openSheet(`<h2>${dayHead(ds)}</h2>${daySum}
    ${items.length?items.map(rowHtml).join(''):'<div class="small-note u-m-8-0" >На этот день ничего не запланировано.</div>'}
    <button class="btn u-mt-12"  onclick="openEvent(null,'${ds}')">${ic('plus','sm')} Добавить событие на этот день</button>`);
}
function openEvent(id, presetDate){
  const ev=id?state.events.find(x=>x.id===id):null;
  const date=ev?ev.date:(presetDate||todayISO());
  const envOpts=`<option value="">— без конверта —</option>`+activeEnvelopes().map(e=>`<option value="${e.id}" ${ev&&ev.envelopeId===e.id?'selected':''}>${esc(e.name)}</option>`).join('');
  openSheet(`<h2>${ev?'Изменить событие':'Новое событие'}</h2>
    <label class="field"><span>Название</span><input class="input" id="ev-title" value="${ev?esc(ev.title):''}" placeholder="Например: ДР Вики"></label>
    <label class="field"><span>Дата</span><input class="input" id="ev-date" type="date" value="${date}"></label>
    <label class="field"><span>Сумма</span><div class="two"><input class="input" id="ev-amt" type="number" inputmode="decimal" value="${ev&&ev.amount?ev.amount:''}" placeholder="сколько заложить">
      <select class="input" id="ev-cur">${currencyOptions(ev?ev.currency:state.baseCurrency)}</select></div></label>
    <label class="field"><span>Из конверта</span><select class="input" id="ev-env">${envOpts}</select></label>
    <div class="small-note u-m-n6-2-10" >Сумма резервируется в календаре под этот конверт — видно, хватает ли на все запланированные события. На баланс конверта событие НЕ влияет, пока не нажмёшь «Провести».</div>
    <label class="field"><span>Заметка</span><input class="input" id="ev-note" value="${ev?esc(ev.note):''}"></label>
    <button class="btn" onclick="saveEvent('${id||''}')">Сохранить</button>
    ${ev?`<div class="btn-grid u-mt-10" >${ev.done?'<button class="btn sec off">Уже проведено</button>':`<button class="btn sec" onclick="postEvent('${ev.id}')">Провести</button>`}<button class="btn danger" onclick="deleteEvent('${ev.id}')">Удалить</button></div>`:''}`);
}
function saveEvent(id){
  const title=document.getElementById('ev-title').value.trim(); if(!title){ toast('Введи название'); return; }
  const date=document.getElementById('ev-date').value; if(!isRealDate(date)){ toast('Укажи дату'); return; }
  const amount=round2(parseFloat(document.getElementById('ev-amt').value)||0);
  const currency=document.getElementById('ev-cur').value; const envelopeId=document.getElementById('ev-env').value||null; const note=document.getElementById('ev-note').value.trim();
  if(id){ const ev=state.events.find(x=>x.id===id); if(ev) Object.assign(ev,{title,date,amount,currency,envelopeId,note}); }
  else state.events.push({id:uid(),title,date,amount,currency,envelopeId,note,done:false,icon:'🎁'});
  save(); closeSheet(); toast('Сохранено ✓'); if(calMonth) calMonth=date.slice(0,7); renderMore();
}
async function deleteEvent(id){ if(!await confirmSheet('Удалить событие?',{okText:'Удалить',danger:true}))return; state.events=state.events.filter(e=>e.id!==id); tomb(id); save(); closeSheet(); toast('Удалено'); renderMore(); }
function postEvent(id){ const ev=state.events.find(x=>x.id===id); if(!ev) return;
  entry=buildEntryBase('expense'); catExpanded=false; entryFirstRender=true;
  // P1.2: валюта события. Расход пишется в валюте счёта → если валюта события другая,
  // подбираем счёт той же валюты, иначе пересчитываем сумму по курсу (пользователь увидит и подтвердит).
  let amt=ev.amount;
  if(ev.currency && ev.currency!==accCur(entry.accountId)){
    const match=activeAccounts().find(a=>a.currency===ev.currency);
    if(match) entry.accountId=match.id; else amt=convert(ev.amount, ev.currency, accCur(entry.accountId));
  }
  if(amt>0) entry.amtStr=String(round2(amt));
  if(ev.envelopeId && env(ev.envelopeId)) entry.envelopeId=ev.envelopeId;
  entry.note=ev.title; entry.date = ev.date<=todayISO()?ev.date:todayISO(); entry.eventId=id;
  renderEntry(); showSheetShell();
}
function renderRecurring(el){
  const ym=todayISO().slice(0,7), today=+todayISO().slice(8,10);
  const items=state.recurring.map(r=>{
    const c=catById(r.categoryId), a=acc(r.accountId);
    const posted=r.lastPosted===ym, dueDay=Math.min(r.day||1, daysInMonth(ym)), due=r.active!==false&&!posted&&dueDay<=today&&a;
    const status = posted?' · <span class="green">внесено</span>' : due?' · <span class="u-c-red">пора внести</span>' : '';
    return `<div class="list-item">
      <div class="cat-ic" style="width:38px;height:38px;font-size:18px;background:${c?c.color:'#94a3b8'}">${c?c.icon:'🔁'}</div>
      <div class="grow"><div class="u-fw-600">${esc(r.note||c?.name||(r.type==='income'?'Доход':'Расход'))} ${r.active===false?'<span class="badge">пауза</span>':''}${r.auto?'<span class="badge u-c-accent" >авто</span>':''}${!a?'<span class="badge u-c-red" >нет счёта</span>':''}</div>
        <div class="small-note">${fmt(r.amount,r.currency)} · ${r.type==='income'?'доход':'расход'} · ${r.day}-е число${status}</div></div>
      ${due?`<button class="icon-btn u-c-green"  title="Внести" onclick="postRecurring('${r.id}')">${ic('check','sm')}</button>`:''}
      <button class="icon-btn" title="Пауза/возобновить" onclick="toggleRecurring('${r.id}')">${r.active===false?'▶':'⏸'}</button>
      <button class="icon-btn" onclick="openRecurring('${r.id}')" aria-label="Изменить">${ic('pencil','sm')}</button>
      <button class="icon-btn del" onclick="deleteRecurring('${r.id}')" aria-label="Удалить">${ic('trash','sm')}</button></div>`;
  }).join('');
  el.innerHTML = `<button class="back-btn" onclick="backMore()">${ic('chevl','sm')} Назад</button><h2 class="u-m-0-4-12">Повторяющиеся платежи</h2>
    <div class="small-note u-m-0-4-12" >Аренда, подписки, зарплата и т.п. С выбранного дня месяца приложение напомнит внести их на экране «Операции». Внесение — в один тап.</div>
    <div class="card">${items||'<div class="empty">Пока нет шаблонов</div>'}</div>
    <button class="btn" onclick="openRecurring()">${ic('plus','sm')} Новый шаблон</button>`;
}

let recForm=null;
function openRecurring(id){
  if(!activeAccounts().length){ toast('Сначала добавь счёт'); return; }
  const r=id?state.recurring.find(x=>x.id===id):null; const accs=activeAccounts();
  recForm={ id:id||null, type:r?r.type:'expense', amount:r?r.amount:'', accountId:(r&&acc(r.accountId))?r.accountId:accs[0].id,
    envelopeId:(r&&r.envelopeId)?r.envelopeId:activeEnvelopes()[0]?.id, categoryId:r?r.categoryId:null, day:r?r.day:1, note:r?(r.note||''):'', auto:r?!!r.auto:false };
  if(!recForm.categoryId||catById(recForm.categoryId)?.kind!==recForm.type) recForm.categoryId=state.categories.find(c=>c.kind===recForm.type)?.id;
  renderRecurringForm();
}
function captureRec(){ const g=id=>document.getElementById(id);
  if(g('rec-amt')) recForm.amount=g('rec-amt').value;
  if(g('rec-day')) recForm.day=g('rec-day').value;
  if(g('rec-note')) recForm.note=g('rec-note').value;
  if(g('rec-env')) recForm.envelopeId=g('rec-env').value;
  if(g('rec-cat')) recForm.categoryId=g('rec-cat').value;
  if(g('rec-auto')) recForm.auto=g('rec-auto').checked; }
function recSetType(t){ captureRec(); recForm.type=t; if(catById(recForm.categoryId)?.kind!==t) recForm.categoryId=state.categories.find(c=>c.kind===t)?.id; renderRecurringForm(); }
function recSetAcc(id){ captureRec(); recForm.accountId=id; renderRecurringForm(); }
function renderRecurringForm(){
  const f=recForm, a=acc(f.accountId), inv=a?.investment;
  const cats=state.categories.filter(c=>c.kind===f.type);
  const accOpts=activeAccounts().map(x=>`<option value="${x.id}" ${x.id===f.accountId?'selected':''}>${esc(x.name)} (${x.currency})</option>`).join('');
  const envOpts=activeEnvelopes().map(x=>`<option value="${x.id}" ${x.id===f.envelopeId?'selected':''}>${esc(x.name)}</option>`).join('');
  const catOpts=cats.map(c=>`<option value="${c.id}" ${c.id===f.categoryId?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
  openSheet(`<h2>${f.id?'Изменить шаблон':'Новый повторяющийся платёж'}</h2>
    <div class="seg u-mb-14" ><button class="${f.type==='expense'?'active':''}" onclick="recSetType('expense')">Расход</button><button class="${f.type==='income'?'active':''}" onclick="recSetType('income')">Доход</button></div>
    <label class="field"><span>Сумма${a?' ('+a.currency+')':''}</span><input class="input" id="rec-amt" type="number" inputmode="decimal" value="${f.amount}" placeholder="0"></label>
    <label class="field"><span>${f.type==='income'?'Зачислять на счёт':'Списывать со счёта'}</span><select class="input" id="rec-acc" onchange="recSetAcc(this.value)">${accOpts}</select></label>
    ${(f.type==='expense'&&!inv)?`<label class="field"><span>Конверт (бюджет)</span><select class="input" id="rec-env">${envOpts}</select></label>`:''}
    <label class="field"><span>Категория</span><select class="input" id="rec-cat">${catOpts}</select></label>
    <label class="field"><span>День месяца (1–31)</span><input class="input" id="rec-day" type="number" inputmode="numeric" min="1" max="31" value="${f.day}" onchange="captureRec();renderRecurringForm()"></label>
    ${!f.id?`<div class="small-note u-m-n6-2-10" >${(()=>{ const dd=Math.max(1,Math.min(31,parseInt(f.day)||1)); const ym=todayISO().slice(0,7); const td=+todayISO().slice(8,10); const eff=Math.min(dd,daysInMonth(ym)); return td<eff ? `Первое списание: <b>${String(eff).padStart(2,'0')}.${ym.slice(5)}</b> — в этом месяце.` : `⚠️ День ${dd} в этом месяце уже прошёл (сегодня ${td}-е). При «авто» спишется <b>сразу за текущий месяц</b>. Чтобы начать со следующего — поставь день больше ${td}.`; })()}</div>`:''}
    <label class="field"><span>Название / комментарий</span><input class="input" id="rec-note" value="${esc(f.note)}" placeholder="Например: Аренда"></label>
    <label class="field u-d-flex_ai-center_g-10_fd-row" >
      <input type="checkbox" id="rec-auto" ${f.auto?'checked':''} class="u-w-20_h-20"><span class="u-m-0">Проводить автоматически (без ручного «Внести»)</span></label>
    ${f.type==='income'?'<div class="small-note u-m-n4-2-12" >Доход при внесении распределится по конвертам по их процентам.</div>':''}
    <button class="btn" onclick="saveRecurring()">Сохранить</button>
    ${f.id?`<button class="btn danger u-mt-10"  onclick="deleteRecurring('${f.id}')">Удалить шаблон</button>`:''}`);
}
function saveRecurring(){
  captureRec(); const f=recForm, a=acc(f.accountId);
  if(!a){ toast('Выбери счёт'); return; }
  const amount=round2(parseFloat(f.amount)||0); if(amount<=0){ toast('Введи сумму'); return; }
  const day=Math.max(1, Math.min(31, parseInt(f.day)||1));
  const obj={ type:f.type, amount, currency:a.currency, accountId:f.accountId,
    envelopeId:(f.type==='expense'&&!a.investment)?f.envelopeId:null, categoryId:f.categoryId, day, note:(f.note||'').trim(), auto:!!f.auto };
  if(f.id){ const r=state.recurring.find(x=>x.id===f.id); if(r) Object.assign(r,obj); }
  else { obj.id=uid(); obj.active=true; obj.lastPosted=null; state.recurring.push(obj); }
  save(); closeSheet(); toast('Сохранено'); moreView='recurring'; renderMore();
}

function saveAccount(id) {
  const name=document.getElementById('acc-name').value.trim(), icon=document.getElementById('acc-icon').value, color=document.getElementById('acc-color').value;
  let currency=document.getElementById('acc-cur').value;
  const inv=document.getElementById('acc-inv').checked, off=inv?Math.max(0,Math.min(100,parseFloat(document.getElementById('acc-offtop').value)||0)):0;
  const excluded=document.getElementById('acc-excl').checked;
