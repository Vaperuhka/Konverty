/* ---------- Калькулятор вклада (прогноз) ---------- */
let depCalc={accId:null, start:0, monthly:0, rate:0, years:5};
function depCalcPick(accId){ const a=acc(accId); if(a){ const {accBal}=computeBalances(); depCalc.accId=accId; depCalc.start=round2((accBal[accId]||{})[a.currency]||0); depCalc.rate=a.rate||0; } renderMore(); }
function depCalcSet(f,v){ if(f==='accId'){ if(v) depCalcPick(v); else { depCalc.accId=null; renderMore(); } return; }
  if(f==='years') depCalc.years=Math.max(0,Math.min(60,parseFloat(v)||0)); else depCalc[f]=Math.max(0,parseFloat(v)||0); renderMore(); }
function depositProjection(start, monthly, annualRate, months){
  const i=annualRate/100/12; let bal=round2(start), contributed=round2(start); const yearly=[];
  for(let m=1;m<=months;m++){ bal=round2(bal*(1+i)+monthly); contributed=round2(contributed+monthly);
    if(m%12===0||m===months) yearly.push({month:m, bal, contributed, interest:round2(bal-contributed)}); }
  return {final:round2(bal), contributed:round2(contributed), interest:round2(bal-contributed), yearly};
}
function renderDepositCalc(el){
  const deps=activeAccounts().filter(a=>a.deposit);
  const cur0 = (depCalc.accId&&acc(depCalc.accId)) ? acc(depCalc.accId).currency : state.baseCurrency;
  const months=Math.round((depCalc.years||0)*12);
  const proj=depositProjection(depCalc.start||0, depCalc.monthly||0, depCalc.rate||0, months);
  const fmtC=v=>fmt(round2(v), cur0);
  const accSel = deps.length ? `<label class="field"><span>Счёт-вклад</span><select class="input" onchange="depCalcSet('accId',this.value)">
      <option value="">— вручную —</option>${deps.map(a=>`<option value="${a.id}" ${a.id===depCalc.accId?'selected':''}>${esc(a.icon+' '+a.name)} · ${a.rate||0}%</option>`).join('')}</select></label>`
    : `<div class="small-note" style="margin-bottom:10px">Нет счетов-вкладов. Отметь счёт как «Вклад» в его настройках — тогда подставлю баланс и ставку. Пока можно посчитать вручную.</div>`;
  const barMax=proj.yearly.length?Math.max(...proj.yearly.map(y=>y.bal)):0;
  const rows=proj.yearly.map(y=>{ const yr=y.month/12; const lab=Number.isInteger(yr)?`${yr} ${plural(yr,'год','года','лет')}`:`${y.month} мес`;
    const w=barMax>0?Math.round(y.bal/barMax*100):0;
    return `<div style="margin:8px 0"><div class="row" style="margin:0"><span class="muted">${lab}</span><span style="font-weight:700">${fmtC(y.bal)}</span></div>
      <div style="height:8px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:3px"><div style="height:100%;width:${w}%;background:var(--accent)"></div></div>
      <div class="small-note" style="margin-top:2px">из них проценты: ${fmtC(y.interest)}</div></div>`; }).join('');
  el.innerHTML=`<button class="back-btn" onclick="backMore()">‹ Назад</button><h2 style="margin:0 4px 12px">📈 Калькулятор вклада</h2>
    ${accSel}
    <label class="field"><span>Начальная сумма (${cur0})</span><input class="input" type="number" inputmode="decimal" value="${depCalc.start||''}" placeholder="0" onchange="depCalcSet('start',this.value)"></label>
    <label class="field"><span>Пополнение в месяц (${cur0})</span><input class="input" type="number" inputmode="decimal" value="${depCalc.monthly||''}" placeholder="0" onchange="depCalcSet('monthly',this.value)"></label>
    <label class="field"><span>Ставка, % годовых</span><input class="input" type="number" inputmode="decimal" value="${depCalc.rate||''}" placeholder="0" onchange="depCalcSet('rate',this.value)"></label>
    <label class="field"><span>Срок, лет</span><input class="input" type="number" inputmode="decimal" value="${depCalc.years||''}" placeholder="5" onchange="depCalcSet('years',this.value)"></label>
    <div class="card tight" style="margin:6px 0 12px">
      <div class="row"><span class="muted">Через ${depCalc.years||0} ${plural(Math.round(depCalc.years||0),'год','года','лет')} будет</span><span style="font-weight:800" class="green">${fmtC(proj.final)}</span></div>
      <div class="row"><span class="muted">Вложено своими</span><span style="font-weight:700">${fmtC(proj.contributed)}</span></div>
      <div class="row"><span class="muted">Накапало процентами</span><span style="font-weight:700" class="green">${fmtC(proj.interest)}</span></div></div>
    ${rows?`<div class="section-title">По годам</div>${rows}`:''}
    <div class="small-note" style="margin-top:10px">Сложный процент, ежемесячная капитализация, пополнение в конце месяца. Прогноз примерный — при неизменных ставке и пополнении.</div>`;
}

// U7: единый компонент подтверждения (вместо системного confirm) — отдельный оверлей поверх листов. Возвращает Promise<boolean>.
function confirmSheet(message, opts){ opts=opts||{}; return new Promise(res=>{
  const back=document.createElement('div'); back.className='cf-back';
  back.innerHTML=`<div class="cf-box"><div class="cf-msg">${message}</div>
    <div class="cf-btns"><button class="btn sec" data-v="0">${esc(opts.cancelText||'Отмена')}</button><button class="btn ${opts.danger?'danger':''}" data-v="1">${esc(opts.okText||'Подтвердить')}</button></div></div>`;
  document.body.appendChild(back);
  const done=v=>{ back.remove(); res(v); };
  back.addEventListener('click', e=>{ const b=e.target.closest('[data-v]'); if(b){ done(b.dataset.v==='1'); return; } if(e.target===back) done(false); });
}); }

function navConsume(){ if(navPushed>0){ navPushed--; ignorePop=true; try{ history.back(); }catch(e){ ignorePop=false; } } }

let entry=null, entryFirstRender=true;
function buildEntryBase(mode){
  const sp=spendableAccounts(), envs=activeEnvelopes(), accs=activeAccounts();
  return {
    mode, transferKind:'account', amtStr:'', currency:state.baseCurrency, date:todayISO(), note:'', fund:{}, editId:null, distribute:true,
    distMode:'percent', eqSel:{},   // распределение дохода: 'percent' (по % конвертов) или 'equal' (поровну между отмеченными в eqSel)
    categoryId: mode==='income' ? state.categories.find(c=>c.kind==='income')?.id : state.categories.find(c=>c.kind==='expense')?.id,
    accountId: (sp[0]||accs[0])?.id,
    envelopeId: envs[0]?.id,
    incomeAccountId: (sp[0]||accs[0])?.id,
    fromAccountId: accs[0]?.id,
    toAccountId: accs[1]?.id||accs[0]?.id,
    fromEnvelopeId: envs[0]?.id,
    toEnvelopeId: envs[1]?.id||envs[0]?.id
  };
}
function openEntry(mode='expense') {
  if (!activeAccounts().length){ toast('Сначала добавь счёт'); switchTab('more'); openMore('accounts'); return; }
  entry = buildEntryBase(mode); catExpanded=false; entryFirstRender=true;
  renderEntry(); showSheetShell();
}
// Собрать entry из существующей операции. edit=true — правим её же; edit=false — повтор новой (дата = сегодня).
function entryFromTx(t, edit){
  const modeMap = { transfer:'transfer', envtransfer:'transfer', income:'income', expense:'expense' };
  const mode = modeMap[t.type]; if(!mode) return null;   // envfund правится отдельно
  const b = buildEntryBase(mode);
  b.editId = edit ? t.id : null;
  b.date = edit ? t.date : todayISO();
  b.note = t.note || '';
  const amtStr = a => { const n=round2(a??0); return n===0 ? '' : String(n); };
  if (t.type==='expense'){
    b.accountId = t.accountId || b.accountId;
    b.envelopeId = t.envelopeId || b.envelopeId;
    b.categoryId = t.categoryId || b.categoryId;
    b.amtStr = amtStr(t.amount);
  } else if (t.type==='income'){
    const creditIds=Object.keys(t.accountCredits||{});
    b.incomeAccountId = creditIds.find(id=>!acc(id)?.investment) || creditIds[0] || b.incomeAccountId;
    b.categoryId = t.categoryId || b.categoryId;
    b.amtStr = amtStr(t.amount);
    b.distribute = t.plan ? Object.keys(t.plan).length>0 : true;
    b.fund = {};
    if (t.plan) for (const id of Object.keys(t.plan)) b.fund[id] = !!(t.distribution && t.distribution[id] > 0.005);
  } else if (t.type==='transfer'){
    b.transferKind='account';
    b.fromAccountId = t.fromAccountId; b.toAccountId = t.toAccountId;
    b.amtStr = amtStr(t.fromAmount!=null ? t.fromAmount : t.amount);
  } else if (t.type==='envtransfer'){
    b.transferKind='envelope';
    b.fromEnvelopeId = t.fromEnvelopeId; b.toEnvelopeId = t.toEnvelopeId; b.currency = t.currency;
    b.amtStr = amtStr(t.amount);
  }
  return b;
}
function editTx(id){
  const t=state.transactions.find(x=>x.id===id); if(!t) return;
  if (t.type==='envfund'){ openFundEnvelope(t.envelopeId, t.id, t.amount, t.currency); return; }
  if (t.type==='expense' && Array.isArray(t.splits) && t.splits.length){ openSplitExpense({editId:t.id, accountId:t.accountId, date:t.date, note:t.note, target:round2(t.amount), rows:t.splits.map(s=>({...s}))}); return; }
  const en=entryFromTx(t,true); if(!en){ toast('Эту операцию нельзя изменить'); return; }
  entry=en; catExpanded=false; entryFirstRender=true; renderEntry(); showSheetShell();
}
function repeatTx(id){
  const t=state.transactions.find(x=>x.id===id); if(!t) return;
  if (t.type==='envfund'){ openFundEnvelope(t.envelopeId); return; }
  if (t.type==='expense' && Array.isArray(t.splits) && t.splits.length){ openSplitExpense({accountId:t.accountId, date:todayISO(), note:t.note, target:round2(t.amount), rows:t.splits.map(s=>({...s}))}); return; }
  const en=entryFromTx(t,false); if(!en){ toast('Эту операцию нельзя повторить'); return; }
  entry=en; catExpanded=false; entryFirstRender=true; renderEntry(); showSheetShell();
}
function accChip(id, sel, onclick){ const a=acc(id); return `<button class="echip ${sel?'active':''}" onclick="${onclick}">${a?.icon||''} ${esc(a?.name||'?')}</button>`; }
// Переставить выбранный элемент в начало списка (чтобы при вводе он был виден первым, без прокрутки).
// M9: переставляем выбранный чип в начало ТОЛЬКО при первом открытии листа (при первом рендере),
// иначе на каждый тап чипы «прыгают» под пальцем. На последующих рендерах активный чип просто прокручивается в зону видимости.
function selFirst(list, id){ if(!entryFirstRender || !id) return list; const i=list.findIndex(x=>x.id===id); if(i<=0) return list; const c=list.slice(); c.unshift(c.splice(i,1)[0]); return c; }
function envChip(id, sel, onclick){ const e=env(id); return `<button class="echip ${sel?'active':''}" onclick="${onclick}"><span class="d" style="background:${e?.color||'var(--muted)'}"></span>${esc(e?.name||'?')}</button>`; }
function catItem(c, active){ return `<div class="cat-item ${active?'active':''}" onclick="entry.categoryId='${c.id}';renderEntry()">
  <div class="cc" style="background:${c.color}">${c.icon}</div><div class="cl">${esc(c.name)}</div></div>`; }
// Сетка категорий: показываем «основные» (⭐), остальные прячем под кнопкой «Показать все».
let catExpanded=false;
function catGridHtml(cats, selId){
  const favs=cats.filter(c=>c.fav);
  const useFav=favs.length>0 && !catExpanded;
  let shown = useFav ? favs.slice() : cats;
  if (useFav && selId && !shown.some(c=>c.id===selId)){ const s=cats.find(c=>c.id===selId); if(s) shown=[...shown,s]; }
  const hidden = cats.length - shown.length;
  const grid=`<div class="cat-grid">${shown.map(c=>catItem(c,c.id===selId)).join('')}</div>`;
  let toggle='';
  if (favs.length>0 && cats.length>favs.length){
    toggle = catExpanded
      ? `<button class="cat-toggle" onclick="catToggleExpand(event)">Свернуть ▲</button>`
      : `<button class="cat-toggle" onclick="catToggleExpand(event)">Показать все категории${hidden>0?` (${hidden})`:''} ▾</button>`;
  }
  return grid+toggle;
}
function catToggleExpand(ev){ if(ev)ev.stopPropagation(); catExpanded=!catExpanded; renderEntry(); }
// Валюта текущего ввода = валюта задействованного счёта (для перевода между конвертами — выбирается вручную)
function entryCurrency() {
  const e=entry;
  if (e.mode==='expense') return accCur(e.accountId);
  if (e.mode==='income') return accCur(e.incomeAccountId);
  if (e.mode==='transfer' && e.transferKind==='account') return accCur(e.fromAccountId);

}

        <div class="small-note" style="margin:8px 2px 0">Куда · сейчас ${toBal}</div><div class="chips-row">${selFirst(activeEnvelopes(),e.toEnvelopeId).map(v=>echipBal(v,v.id===e.toEnvelopeId,`entrySetToEnv('${v.id}')`)).join('')}</div>`;

        mid+='<div class="small-note" style="margin:6px 2px 0">Инвест-счета возьмут своё сверху, остаток разложишь по конвертам галочками.</div>';
      } else {
        const {distribution:plan, offTop, mainCur, remainder}=computeIncome(amtNum,e.incomeAccountId);
        const offNote=Object.entries(offTop).map(([id,o])=>`${esc(acc(id)?.name||'')} +${fmt(o.amt,o.cur)} сверху`).join(' · ');
        const modeSeg=`<div class="mini-seg" style="margin-top:8px">
          <button class="${e.distMode!=='equal'?'active':''}" onclick="entrySetDistMode('percent')">По процентам</button>

        let rows, hint, infoLine;

          const cnt=activeEnvelopes().filter(v=>e.eqSel[v.id]).length;
          const each = cnt>0 ? round2(remainder/cnt) : 0;
          rows=activeEnvelopes().map(v=>{ const on=!!e.eqSel[v.id];
            return `<div class="fund-row ${on?'on':''}" onclick="entryToggleEq('${v.id}')">
              <div class="chk">${on?'✓':''}</div><span class="grow">${esc(v.name)}</span><b>${on?fmt(each,mainCur):'—'}</b></div>`; }).join('');
          hint='Отметь конверты — сумма разделится между ними поровну:';
          infoLine = cnt>0
            ? `<div class="info-line" style="margin-top:8px">В ${cnt} ${plural(cnt,'конверт','конверта','конвертов')} по <b>${fmt(each,mainCur)}</b> · всего <b>${fmt(remainder,mainCur)}</b></div>`
            : `<div class="small-note" style="margin-top:8px">Отметь хотя бы один конверт.</div>`;
        } else {
          let fundedSum=0, owedSum=0;
          rows=activeEnvelopes().map(v=>{ const p=plan[v.id]||0; const on=e.fund[v.id]!==false; if(on)fundedSum+=p; else owedSum+=p;
            return `<div class="fund-row ${on?'on':''}" onclick="entryToggleFund('${v.id}')">
              <div class="chk">${on?'✓':''}</div><span class="grow">${esc(v.name)}</span><b>${fmt(p,mainCur)}</b></div>`; }).join('');
          hint='Отметь конверты, которые оплачиваешь сейчас:';
          infoLine=`<div class="info-line" style="margin-top:8px">Оплачу сейчас: <b>${fmt(fundedSum,mainCur)}</b>${owedSum>0.005?` · в долг конвертам: <b>${fmt(owedSum,mainCur)}</b> (полежат свободно на счёте)`:''}</div>`;
        }
        mid+=`${offNote?`<div class="small-note" style="margin:8px 2px 2px">${offNote}</div>`:''}${modeSeg}
          <div class="small-note" style="margin:8px 2px 4px">${hint}</div>
          <div class="fund-list">${rows}</div>${infoLine}`;
      }
    }
  } else {
    const cats=state.categories.filter(c=>c.kind==='expense');
    const a=acc(e.accountId); const code=accCur(e.accountId); const {accBal}=computeBalances(); const have=(accBal[e.accountId]||{})[code]||0;
    mid=`<div class="small-note" style="margin:6px 2px 0">Счёт списания (${code}) · в нём ${fmt(have,code)}${amtNum>have?' <span class="red">(не хватает)</span>':''}</div>
      <div class="chips-row">${selFirst(activeAccounts(),e.accountId).map(v=>accChip(v.id,v.id===e.accountId,`entrySetAccount('${v.id}')`)).join('')}</div>`;
    if (a && !a.investment && !a.excluded) {
      mid+=`<div class="small-note" style="margin:8px 2px 0">Конверт (бюджет)</div>
        <div class="chips-row">${selFirst(activeEnvelopes(),e.envelopeId).map(v=>envChip(v.id,v.id===e.envelopeId,`entrySetEnvelope('${v.id}')`)).join('')}</div>`;
    } else {
      mid+=`<div class="info-line" style="margin-top:8px">${a&&a.excluded?'Отдельный кошелёк — трата без конверта':'Инвест-счёт — трата без конверта'}</div>`;
    }
    mid+=catGridHtml(cats,e.categoryId);
    mid+=`<button class="btn sec" style="margin-top:12px" onclick="openSplitFromEntry()">✂️ Разделить на части</button>`;
  }
  const keypad=`<div class="keypad">${['7','8','9','4','5','6','1','2','3'].map(k=>`<button onclick="kp('${k}')">${k}</button>`).join('')}
    <button class="kp-sec" onclick="kp('.')">.</button><button onclick="kp('0')">0</button><button class="kp-sec" onclick="kpDel()">⌫</button></div>`;
  const curField = (e.mode==='transfer' && e.transferKind==='envelope')
    ? `<select class="input" style="flex:0 0 96px" onchange="entry.currency=this.value;renderEntry()">${currencyOptions(e.currency)}</select>`
    : `<div class="input" style="flex:0 0 96px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600">${cur(entryCurrency()).code} ${cur(entryCurrency()).symbol}</div>`;
  const incMain=acc(e.incomeAccountId);
  const willDistribute = e.mode==='income' && incMain && !incMain.investment && !incMain.excluded && e.distribute;
  const bar=`<div class="entry-bar">${curField}
    <input class="input" type="date" style="flex:1" value="${e.date}" onchange="entry.date=this.value"></div>
    <input class="input entry-note" placeholder="Комментарий (можно #теги)" value="${esc(e.note)}" oninput="entry.note=this.value">
    <button class="btn entry-save ${amtNum>0?'':'off'}" onclick="saveEntry()">${e.editId?'Сохранить изменения':(e.mode==='income'?(willDistribute?'Распределить и сохранить':'Зачислить и сохранить'):'Сохранить')}</button>`;
  const editNote = e.editId ? `<div class="info-line" style="margin:0 0 4px">✏️ Редактирование операции — балансы пересчитаются</div>` : '';
  sheet.innerHTML = `<div class="grabber"></div>${editNote}${seg}${amount}${mid}${keypad}${bar}`;
  entryFirstRender=false;
  // M9: показать активный чип, не переставляя ленту (без «прыжка» под пальцем)
  sheet.querySelectorAll('.chips-row').forEach(row=>{ const act=row.querySelector('.active'); if(act) row.scrollLeft=Math.max(0, act.offsetLeft - row.clientWidth/2 + act.offsetWidth/2); });
}
function incomePreviewHtml(amount, mainId) {
  const main=acc(mainId);
  if (main && main.investment) return `${esc(main.name)} +${fmt(amount, main.currency)} (пополнение)`;
  const {distribution,offTop,mainCur}=computeIncome(amount,mainId);
  const off=Object.entries(offTop).map(([id,o])=>`${esc(acc(id)?.name||'')} +${fmt(o.amt,o.cur)} (сверху)`);
  const envs=activeEnvelopes().filter(e=>distribution[e.id]>0.005).map(e=>`${esc(e.name)} ${fmt(distribution[e.id],mainCur)}`);
  return [...off, ...envs].join(' · ');
}
function entrySetMode(m){ entry.mode=m; catExpanded=false;
  if (m==='income' && catById(entry.categoryId)?.kind!=='income') entry.categoryId=state.categories.find(c=>c.kind==='income')?.id;
  if (m==='expense' && catById(entry.categoryId)?.kind!=='expense') entry.categoryId=state.categories.find(c=>c.kind==='expense')?.id;
  renderEntry(); }
function entrySetTransferKind(k){ entry.transferKind=k; renderEntry(); }
function entrySetAccount(id){ entry.accountId=id; const a=acc(id); if(a&&(a.investment||a.excluded)) entry.envelopeId=null; else if(!entry.envelopeId) entry.envelopeId=activeEnvelopes()[0]?.id; renderEntry(); }
function entrySetEnvelope(id){ entry.envelopeId=id; renderEntry(); }
function entrySetIncomeAcc(id){ entry.incomeAccountId=id; renderEntry(); }
function entrySetDistribute(v){ entry.distribute=v; renderEntry(); }
function entrySetDistMode(m){ entry.distMode=m; renderEntry(); }
function entryToggleEq(id){ entry.eqSel[id]=!entry.eqSel[id]; renderEntry(); }
function entryToggleFund(id){ entry.fund[id] = entry.fund[id]===false ? true : false; renderEntry(); }
function entrySetFromAcc(id){ entry.fromAccountId=id; renderEntry(); }
function entrySetToAcc(id){ entry.toAccountId=id; renderEntry(); }
function entrySetFromEnv(id){ entry.fromEnvelopeId=id; renderEntry(); }
function entrySetToEnv(id){ entry.toEnvelopeId=id; renderEntry(); }
function kp(k){ let s=entry.amtStr; haptic(6);
  if(k==='.'){ if(s.includes('.'))return; if(s==='')s='0'; s+='.'; }
  else { if(s.includes('.')&&s.split('.')[1].length>=2)return; if(s==='0')s=''; s+=k; }
  entry.amtStr=s; renderEntry(); }
function kpDel(){ haptic(6); entry.amtStr=entry.amtStr.slice(0,-1); renderEntry(); }
function kpClear(){ haptic(8); entry.amtStr=''; renderEntry(); }
function saveEntry() {
  const e=entry, amt=round2(parseFloat(e.amtStr||'0')||0);
  if (amt<=0){ toast('Введи сумму'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')){ toast('Укажи корректную дату'); return; }
  let tx;
  if (e.mode==='transfer') {
    if (e.transferKind==='account') {
      if (e.fromAccountId===e.toAccountId){ toast('Выбери разные счета'); return; }
      const fc=accCur(e.fromAccountId), tc=accCur(e.toAccountId);
      tx={id:uid(),type:'transfer',date:e.date,fromAccountId:e.fromAccountId,toAccountId:e.toAccountId,
        fromAmount:amt,fromCurrency:fc,toAmount:convert(amt,fc,tc),toCurrency:tc,note:e.note};
    } else {
      if (e.fromEnvelopeId===e.toEnvelopeId){ toast('Выбери разные конверты'); return; }
      tx={id:uid(),type:'envtransfer',date:e.date,currency:e.currency,amount:amt,fromEnvelopeId:e.fromEnvelopeId,toEnvelopeId:e.toEnvelopeId,note:e.note};
    }
  } else if (e.mode==='income') {
    if (!e.incomeAccountId){ toast('Выбери счёт зачисления'); return; }
    const main=acc(e.incomeAccountId);
    if (main && (main.excluded || (!main.investment && !e.distribute))) {
      // Просто зачисление на счёт — без распределения по конвертам и без долга
      const mainCur=main.currency||state.baseCurrency;
      tx={id:uid(),type:'income',date:e.date,currency:mainCur,amount:amt,categoryId:e.categoryId,note:e.note,
        accountCredits:{[e.incomeAccountId]:{amt:round2(amt),cur:mainCur}}, plan:{}, distribution:{}};
    } else if (e.distMode==='equal') {
      // Режим «Поровну»: остаток делится поровну между отмеченными конвертами (без долга — plan=distribution).
      const {accountCredits, remainder, distCurrency}=computeIncome(amt, e.incomeAccountId);
      const selIds=activeEnvelopes().filter(v=>e.eqSel[v.id]).map(v=>v.id);
      const distribution={};
      if (selIds.length){ const each=round2(remainder/selIds.length); let acc2=0;
        selIds.forEach((id,i)=>{ const val = i===selIds.length-1 ? round2(remainder-acc2) : each; distribution[id]=val; acc2=round2(acc2+val); }); }
      tx={id:uid(),type:'income',date:e.date,currency:distCurrency,amount:amt,categoryId:e.categoryId,note:e.note,accountCredits,plan:distribution,distribution};
    } else {
      // H4: если правим существующий доход и сумма+счёт не изменились — сохраняем ИСХОДНУЮ раскладку
      // (проценты конвертов и off-top на момент создания), меняя лишь галочки «оплачено сейчас».
      const orig = e.editId ? state.transactions.find(t=>t.id===e.editId) : null;
      const origMain = (orig && orig.type==='income' && orig.accountCredits) ? (Object.keys(orig.accountCredits).find(id=>!acc(id)?.investment) || Object.keys(orig.accountCredits)[0]) : null;
      const keepOrig = orig && orig.plan && origMain===e.incomeAccountId && round2(orig.amount)===amt;
      if (keepOrig) {
        const distribution={};
        for (const [id,p] of Object.entries(orig.plan)) if (e.fund[id]!==false) distribution[id]=p;
        tx={id:uid(),type:'income',date:e.date,currency:orig.currency,amount:amt,categoryId:e.categoryId,note:e.note,accountCredits:orig.accountCredits,plan:orig.plan,distribution};
      } else {
        const {accountCredits,distribution:plan,distCurrency}=computeIncome(amt,e.incomeAccountId);
        // Фактически кладём в конверты только отмеченные; остальное — в долг конвертам (деньги остаются на счёте)
        const distribution={};
        for (const [id,p] of Object.entries(plan)) if (e.fund[id]!==false) distribution[id]=p;
        tx={id:uid(),type:'income',date:e.date,currency:distCurrency,amount:amt,categoryId:e.categoryId,note:e.note,accountCredits,plan,distribution};
      }
    }
  } else {
    if (!e.accountId){ toast('Выбери счёт'); return; }
    const ax=acc(e.accountId); const noEnv=!!(ax&&(ax.investment||ax.excluded));
    tx={id:uid(),type:'expense',date:e.date,currency:accCur(e.accountId),amount:amt,accountId:e.accountId,envelopeId:noEnv?null:e.envelopeId,categoryId:e.categoryId,note:e.note};
  }
  if (e.editId){ tx.id=e.editId; const i=state.transactions.findIndex(t=>t.id===e.editId);
    if (i>=0) state.transactions[i]=tx; else state.transactions.push(tx); }
  else state.transactions.push(tx);
  save(); closeSheet(); haptic();
  const ym=e.date.slice(0,7); if(ym!==viewMonth) viewMonth=ym;
  toast(e.editId?'Изменено ✓':'Сохранено ✓'); render();
}

/* ---------- Детали операции ---------- */
/* ---------- Разделение расхода на части (split) ---------- */
let splitDraft=null;
function openSplitFromEntry(){ const e=entry; const amt=round2(parseFloat(e.amtStr||'0')||0);
  openSplitExpense({accountId:e.accountId, date:e.date, note:e.note, target:amt>0?amt:0, rows:[]}); }
function openSplitExpense(pf){
  pf=pf||{};
  const sp=spendableAccounts(), accs=sp.length?sp:activeAccounts();
  const defCat=()=>state.categories.find(c=>c.kind==='expense')?.id||null;
  const defEnv=()=>activeEnvelopes()[0]?.id||null;
  splitDraft={ editId:pf.editId||null, accountId:pf.accountId||accs[0]?.id||activeAccounts()[0]?.id, date:pf.date||todayISO(), note:pf.note||'', target:round2(pf.target||0),
    rows:(pf.rows&&pf.rows.length)?pf.rows.map(r=>({categoryId:r.categoryId||defCat(), envelopeId:r.envelopeId||null, amount:round2(r.amount||0)}))
      :[{categoryId:defCat(), envelopeId:defEnv(), amount:0},{categoryId:defCat(), envelopeId:defEnv(), amount:0}] };
  renderSplit();
}
function renderSplit(){
  const d=splitDraft; if(!d) return; const a=acc(d.accountId); const noEnv=!!(a&&(a.investment||a.excluded)); const code=accCur(d.accountId);
  const sum=round2(d.rows.reduce((s,r)=>s+(r.amount||0),0));
  const rem=d.target>0?round2(d.target-sum):0;
  const cats=state.categories.filter(c=>c.kind==='expense');
  const catOpt=sel=>cats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.icon+' '+c.name)}</option>`).join('');
  const envOpt=sel=>`<option value="" ${!sel?'selected':''}>— без конверта —</option>`+activeEnvelopes().map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('');
  const rows=d.rows.map((r,i)=>`<div class="card tight" style="margin-bottom:8px">
    <div class="two"><select class="input" onchange="splitSetRow(${i},'categoryId',this.value)">${catOpt(r.categoryId)}</select>
      <input class="input" type="number" inputmode="decimal" placeholder="0" value="${r.amount||''}" onchange="splitSetRow(${i},'amount',this.value)"></div>
    ${noEnv?'':`<select class="input" style="margin-top:8px" onchange="splitSetRow(${i},'envelopeId',this.value)">${envOpt(r.envelopeId)}</select>`}
    ${d.rows.length>1?`<button class="btn sec small" style="margin-top:8px" onclick="splitDelRow(${i})">Убрать часть</button>`:''}</div>`).join('');
  const accSel=`<select class="input" onchange="splitSetField('accountId',this.value)">${activeAccounts().map(x=>`<option value="${x.id}" ${x.id===d.accountId?'selected':''}>${esc(x.icon+' '+x.name)} · ${x.currency}</option>`).join('')}</select>`;
  const remLine = d.target>0
    ? `<div class="info-line" style="margin-top:6px${Math.abs(rem)>0.005?';background:var(--red-soft);color:var(--red)':''}">Части: <b>${fmt(sum,code)}</b> из <b>${fmt(d.target,code)}</b>${Math.abs(rem)>0.005?` · осталось ${fmt(rem,code)}`:' ✓'}</div>`
    : `<div class="info-line" style="margin-top:6px">Итого: <b>${fmt(sum,code)}</b></div>`;
  openSheet(`<h2>✂️ ${d.editId?'Изменить разделённый расход':'Разделить расход'}</h2>
    <label class="field"><span>Счёт списания</span>${accSel}</label>
    <label class="field"><span>Дата</span><input class="input" type="date" value="${d.date}" onchange="splitSetField('date',this.value)"></label>
    <label class="field"><span>Комментарий</span><input class="input" value="${esc(d.note)}" oninput="splitSetField('note',this.value)"></label>
    <div class="small-note" style="margin:2px 2px 8px">Одна покупка — несколько категорий/конвертов. Деньги спишутся со счёта один раз; сумма частей = сумма покупки.</div>
    ${rows}
    <button class="btn sec" onclick="splitAddRow()">＋ Добавить часть</button>
    ${remLine}
    <button class="btn" style="margin-top:12px" onclick="saveSplitExpense()">${d.editId?'Сохранить':'Сохранить расход'}</button>`);
}
function splitSetField(f,v){ if(!splitDraft) return; splitDraft[f]=v; if(f==='accountId') renderSplit(); }
function splitSetRow(i,f,v){ const r=splitDraft&&splitDraft.rows[i]; if(!r) return;
  if(f==='amount') r.amount=Math.max(0,round2(parseFloat(v)||0)); else if(f==='envelopeId') r.envelopeId=v||null; else r[f]=v; renderSplit(); }
function splitAddRow(){ if(!splitDraft) return; const last=splitDraft.rows[splitDraft.rows.length-1];
  splitDraft.rows.push({categoryId:state.categories.find(c=>c.kind==='expense')?.id||null, envelopeId:last?last.envelopeId:(activeEnvelopes()[0]?.id||null), amount:0}); renderSplit(); }
function splitDelRow(i){ if(!splitDraft) return; splitDraft.rows.splice(i,1);
  if(!splitDraft.rows.length) splitDraft.rows.push({categoryId:state.categories.find(c=>c.kind==='expense')?.id||null, envelopeId:null, amount:0}); renderSplit(); }
function saveSplitExpense(){
  const d=splitDraft; if(!d) return; const a=acc(d.accountId); if(!a){ toast('Выбери счёт'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')){ toast('Укажи дату'); return; }
  const noEnv=!!(a.investment||a.excluded);
  const rows=d.rows.map(r=>({categoryId:r.categoryId||null, envelopeId:noEnv?null:(r.envelopeId||null), amount:round2(r.amount||0)})).filter(r=>r.amount>0);
  if(rows.length<2){ toast('Нужно хотя бы 2 части с суммой'); return; }
  const sum=round2(rows.reduce((s,r)=>s+r.amount,0));
  if(d.target>0 && Math.abs(d.target-sum)>0.005){ toast('Сумма частей должна равняться '+fmt(d.target,a.currency)); return; }
  const tx={ id:uid(), type:'expense', date:d.date, currency:a.currency, amount:sum, accountId:d.accountId,
    categoryId:rows[0].categoryId, envelopeId:rows[0].envelopeId, note:d.note, splits:rows };
  if(d.editId){ tx.id=d.editId; const i=state.transactions.findIndex(t=>t.id===d.editId); if(i>=0) state.transactions[i]=tx; else state.transactions.push(tx); }
  else state.transactions.push(tx);
  save(); closeSheet(); splitDraft=null; haptic(); const ym=d.date.slice(0,7); if(ym!==viewMonth) viewMonth=ym; toast(d.editId?'Изменено ✓':'Сохранено ✓'); render();
}
function txDetails(id) {
  const t=state.transactions.find(x=>x.id===id); if(!t) return;
  let body, head;
  if (t.type==='income') {
    head='Доход'; const acc_=Object.entries(t.accountCredits||{}).map(([id,cr])=>{ const amt=typeof cr==='number'?cr:cr.amt, c=typeof cr==='number'?t.currency:cr.cur;
      return `<div class="preview-line"><span>${esc(acc(id)?.name||'счёт')}</span><b>+${fmt(amt,c)}</b></div>`; }).join('');
    const distEntries=Object.entries(t.distribution||{}).filter(([,a])=>a>0.005);
    const env_=distEntries.map(([id,a])=>`<div class="preview-line"><span>${esc(env(id)?.name||'удалён')}</span><b>${fmt(a,t.currency)}</b></div>`).join('');
    const owedEntries=t.plan?Object.entries(t.plan).map(([id,p])=>[id, round2(p-((t.distribution&&t.distribution[id])||0))]).filter(([,s])=>s>0.005):[];
    const owed_=owedEntries.map(([id,s])=>`<div class="preview-line"><span>${esc(env(id)?.name||'удалён')}</span><b class="red">${fmt(s,t.currency)}</b></div>`).join('');

/* ---------- Пополнение конверта (гашение долга) ---------- */

  const defCur=presetCur||(curs.length?curs[0][0]:state.baseCurrency);

async function sweepEnvelope(envId){ const e=env(envId); if(!e) return; const {envBal}=computeBalances();

// Этап 3: перекрыть минус конверта переводом из другого конверта (готовый envtransfer).
function coverOverspend(envId){
  const {envBal}=computeBalances(); const deficit=Math.max(0, round2(-envelopeBase(envBal,envId)));
  entry=buildEntryBase('transfer'); entry.transferKind='envelope'; entry.toEnvelopeId=envId; entry.currency=state.baseCurrency;
  const cand=activeEnvelopes().filter(e=>e.id!==envId).map(e=>({id:e.id,b:envelopeBase(envBal,e.id)})).sort((a,b)=>b.b-a.b)[0];
  if(cand) entry.fromEnvelopeId=cand.id;
  entry.amtStr=deficit>0?String(deficit):'';
  entryFirstRender=true; renderEntry(); showSheetShell();
}

/* =================================================================
   Повторяющиеся платежи (аренда, подписки, зарплата…)
   ================================================================= */
function recurDate(r, ym){ const d=Math.min(r.day||1, daysInMonth(ym)); return `${ym}-${String(d).padStart(2,'0')}`; }
function dueRecurring(){
  const ym=todayISO().slice(0,7), today=+todayISO().slice(8,10);
  return state.recurring.filter(r => r.active!==false && r.lastPosted!==ym && Math.min(r.day||1, daysInMonth(ym))<=today && acc(r.accountId));
}
const ymNext = ym => { let [y,m]=ym.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
// Провести ОДИН экземпляр шаблона за указанный месяц (без save/render)
function _postRecurringMonth(r, ym){
  const a=acc(r.accountId); if(!a) return false;
  const date=recurDate(r,ym); let tx;
  if (r.type==='income'){
    const {accountCredits,distribution:plan,distCurrency}=computeIncome(round2(r.amount), r.accountId);
    tx={id:uid(),type:'income',date,currency:distCurrency,amount:round2(r.amount),categoryId:r.categoryId,note:r.note||'',accountCredits,plan,distribution:{...plan}};
  } else {
    tx={id:uid(),type:'expense',date,currency:a.currency,amount:round2(r.amount),accountId:r.accountId,envelopeId:a.investment?null:r.envelopeId,categoryId:r.categoryId,note:r.note||''};
  }
  tx.recurId=r.id; tx.recurYm=ym; state.transactions.push(tx); return true;   // метки: защита от повторного проведения того же шаблона за тот же месяц
}
// M5: провести шаблон за ВСЕ пропущенные месяцы (от lastPosted+1 до текущего). Возвращает число проведённых.
function _postRecurring(r){
  if(!acc(r.accountId)) return 0;
  const nowYm=todayISO().slice(0,7), today=+todayISO().slice(8,10);
  let ym = r.lastPosted ? ymNext(r.lastPosted) : nowYm;   // новые шаблоны не бэкфиллим до момента создания
  let n=0;
  while(ym<=nowYm){
    const dueDay=Math.min(r.day||1, daysInMonth(ym));
    if(ym<nowYm || dueDay<=today){
      if(state.transactions.some(t=>t.recurId===r.id && t.recurYm===ym)){ r.lastPosted=ym; }   // уже есть операция за этот месяц — не дублируем (защита от сбоя lastPosted/синхронизации)
      else if(_postRecurringMonth(r,ym)){ n++; r.lastPosted=ym; }
    }
    ym=ymNext(ym);
  }
  return n;
}
function postRecurring(id){ const r=state.recurring.find(x=>x.id===id); if(!r) return;
  if(!acc(r.accountId)){ toast('Счёт удалён — поправь шаблон'); return; }
  const n=_postRecurring(r); if(!n){ toast('Пока нечего вносить'); return; }
  save(); toast(n>1?`Внесено за ${n} мес ✓`:'Внесено ✓'); render(); }
function postAllDueRecurring(){ let n=0; state.recurring.filter(r=>r.active!==false&&acc(r.accountId)).forEach(r=>{ n+=_postRecurring(r); });
  if(n){ save(); toast(`Внесено: ${n}`); render(); } }
function toggleRecurring(id){ const r=state.recurring.find(x=>x.id===id); if(!r) return; r.active = r.active===false; save(); renderMore(); }
// Автоматически провести повторяющиеся с флагом «авто» за все пропущенные месяцы (при запуске приложения)
function autoPostDueRecurring(){ let n=0; state.recurring.filter(r=>r.auto&&r.active!==false&&acc(r.accountId)).forEach(r=>{ n+=_postRecurring(r); }); if(n) save(); return n; }

/* ---------- Календарь платежей (предстоящие обязательства) ---------- */
function payAgendaItems(){
  const today=todayISO(); const ym=today.slice(0,7); const nextYm=ymNext(ym); const todayD=+today.slice(8,10);
  const items=[];
  for(const r of state.recurring){ if(r.active===false) continue;
    for(const y of [ym,nextYm]){ if(y===ym && r.lastPosted===ym) continue;
      const dueNow=(y===ym && Math.min(r.day||1,daysInMonth(ym))<=todayD && acc(r.accountId));
      items.push({date:recurDate(r,y), kind:'recur', id:r.id, type:r.type, amount:r.amount, currency:r.currency,
        title:r.note||catById(r.categoryId)?.name||(r.type==='income'?'Доход':'Платёж'), canPost:!!dueNow}); } }
  for(const d of state.debts){ const rem=debtRemaining(d); if(rem<=0.005||!d.dueDate) continue;
    items.push({date:d.dueDate, kind:'debt', id:d.id, type:d.direction==='iowe'?'expense':'income', amount:rem, currency:d.currency,
      title:(d.direction==='iowe'?'Вернуть долг · ':'Ждут возврат · ')+(d.counterparty||'—')}); }
  items.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return items;
}
function renderPayCalendar(el){
  const today=todayISO(); const ym=today.slice(0,7); const items=payAgendaItems();
  const overdue=items.filter(i=>i.date<today), upcoming=items.filter(i=>i.date>=today);
  const monExp=round2(upcoming.filter(i=>i.type==='expense'&&i.date.slice(0,7)===ym).reduce((s,i)=>s+toBase(i.amount,i.currency),0));
  const monInc=round2(upcoming.filter(i=>i.type==='income'&&i.date.slice(0,7)===ym).reduce((s,i)=>s+toBase(i.amount,i.currency),0));
  const itemRow=i=>{ const ic=i.kind==='debt'?'🤝':(i.type==='income'?'↓':'↑'); const cls=i.type==='income'?'green':'red'; const sign=i.type==='income'?'+':'−';
    const btn=i.canPost?`<button class="btn small sec" style="margin-top:6px" onclick="postRecurring('${i.id}')">Внести</button>`:'';
    return `<div style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px">

  const groupByDate=list=>{ const g={}; for(const i of list)(g[i.date] ||= []).push(i); return Object.keys(g).sort().map(dt=>`<div class="day-head"><span class="d">${dayHead(dt)}</span></div>${g[dt].map(itemRow).join('')}`).join(''); };

    <div class="card tight"><div class="row"><span class="muted">До конца месяца к оплате</span><span class="red" style="font-weight:800">${fmtBase(monExp)}</span></div>
      ${monInc>0.5?`<div class="row"><span class="muted">Ожидается доход</span><span class="green" style="font-weight:800">${fmtBase(monInc)}</span></div>`:''}</div>
    ${overdue.length?`<div class="section-title" style="color:var(--red)">Просрочено / пора внести</div>${overdue.map(itemRow).join('')}`:''}
    ${upcoming.length?`<div class="section-title">Предстоит</div>${groupByDate(upcoming)}`:(overdue.length?'':`<div class="empty"><div class="big">📅</div>Нет запланированных платежей. Добавь регулярные платежи (в «Ещё») или долг со сроком — и они появятся здесь.</div>`)}
    <div class="small-note" style="margin-top:12px">Показаны регулярные платежи (этот и следующий месяц) и долги со сроком. «Внести» проводит платёж сразу.</div>`;
}
function renderRecurring(el){

  const items=state.recurring.map(r=>{
    const c=catById(r.categoryId), a=acc(r.accountId);
    const posted=r.lastPosted===ym, dueDay=Math.min(r.day||1, daysInMonth(ym)), due=r.active!==false&&!posted&&dueDay<=today&&a;

    return `<div class="list-item">

  el.innerHTML = `<button class="back-btn" onclick="backMore()">‹ Назад</button><h2 style="margin:0 4px 12px">Повторяющиеся платежи</h2>

}

let recForm=null;
function openRecurring(id){
  if(!activeAccounts().length){ toast('Сначала добавь счёт'); return; }
  const r=id?state.recurring.find(x=>x.id===id):null; const accs=activeAccounts();
  recForm={ id:id||null, type:r?r.type:'expense', amount:r?r.amount:'', accountId:(r&&acc(r.accountId))?r.accountId:accs[0].id,
    envelopeId:(r&&r.envelopeId)?r.envelopeId:activeEnvelopes()[0]?.id, categoryId:r?r.categoryId:null, day:r?r.day:1, note:r?(r.note||''):'', auto:r?!!r.auto:false };
  if(!recForm.categoryId||catById(recForm.categoryId)?.kind!==recForm.type) recForm.categoryId=state.categories.find(c=>c.kind===recForm.type)?.id;
  renderRecurringForm();

function captureRec(){ const g=id=>document.getElementById(id);
  if(g('rec-amt')) recForm.amount=g('rec-amt').value;
  if(g('rec-day')) recForm.day=g('rec-day').value;
  if(g('rec-note')) recForm.note=g('rec-note').value;
  if(g('rec-env')) recForm.envelopeId=g('rec-env').value;
  if(g('rec-cat')) recForm.categoryId=g('rec-cat').value;
  if(g('rec-auto')) recForm.auto=g('rec-auto').checked; }
function recSetType(t){ captureRec(); recForm.type=t; if(catById(recForm.categoryId)?.kind!==t) recForm.categoryId=state.categories.find(c=>c.kind===t)?.id; renderRecurringForm(); }
function recSetAcc(id){ captureRec(); recForm.accountId=id; renderRecurringForm(); }
function renderRecurringForm(){
  const f=recForm, a=acc(f.accountId), inv=a?.investment;
  const cats=state.categories.filter(c=>c.kind===f.type);
  const accOpts=activeAccounts().map(x=>`<option value="${x.id}" ${x.id===f.accountId?'selected':''}>${esc(x.name)} (${x.currency})</option>`).join('');

  const catOpts=cats.map(c=>`<option value="${c.id}" ${c.id===f.categoryId?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
  openSheet(`<h2>${f.id?'Изменить шаблон':'Новый повторяющийся платёж'}</h2>
    <div class="seg" style="margin-bottom:14px"><button class="${f.type==='expense'?'active':''}" onclick="recSetType('expense')">Расход</button><button class="${f.type==='income'?'active':''}" onclick="recSetType('income')">Доход</button></div>

    ${(f.type==='expense'&&!inv)?`<label class="field"><span>Конверт (бюджет)</span><select class="input" id="rec-env">${envOpts}</select></label>`:''}

    <label class="field"><span>День месяца (1–31)</span><input class="input" id="rec-day" type="number" inputmode="numeric" min="1" max="31" value="${f.day}" onchange="captureRec();renderRecurringForm()"></label>
    ${!f.id?`<div class="small-note" style="margin:-6px 2px 10px">${(()=>{ const dd=Math.max(1,Math.min(31,parseInt(f.day)||1)); const ym=todayISO().slice(0,7); const td=+todayISO().slice(8,10); const eff=Math.min(dd,daysInMonth(ym)); return td<eff ? `Первое списание: <b>${String(eff).padStart(2,'0')}.${ym.slice(5)}</b> — в этом месяце.` : `⚠️ День ${dd} в этом месяце уже прошёл (сегодня ${td}-е). При «авто» спишется <b>сразу за текущий месяц</b>. Чтобы начать со следующего — поставь день больше ${td}.`; })()}</div>`:''}
    <label class="field"><span>Название / комментарий</span><input class="input" id="rec-note" value="${esc(f.note)}" placeholder="Например: Аренда"></label>
    <label class="field" style="display:flex;align-items:center;gap:10px;flex-direction:row">
      <input type="checkbox" id="rec-auto" ${f.auto?'checked':''} style="width:20px;height:20px"><span style="margin:0">Проводить автоматически (без ручного «Внести»)</span></label>
    ${f.type==='income'?'<div class="small-note" style="margin:-4px 2px 12px">Доход при внесении распределится по конвертам по их процентам.</div>':''}

    ${f.id?`<button class="btn danger" style="margin-top:10px" onclick="deleteRecurring('${f.id}')">Удалить шаблон</button>`:''}`);
}
function saveRecurring(){
  captureRec(); const f=recForm, a=acc(f.accountId);
  if(!a){ toast('Выбери счёт'); return; }
  const amount=round2(parseFloat(f.amount)||0); if(amount<=0){ toast('Введи сумму'); return; }
  const day=Math.max(1, Math.min(31, parseInt(f.day)||1));
  const obj={ type:f.type, amount, currency:a.currency, accountId:f.accountId,
    envelopeId:(f.type==='expense'&&!a.investment)?f.envelopeId:null, categoryId:f.categoryId, day, note:(f.note||'').trim(), auto:!!f.auto };
  if(f.id){ const r=state.recurring.find(x=>x.id===f.id); if(r) Object.assign(r,obj); }
  else { obj.id=uid(); obj.active=true; obj.lastPosted=null; state.recurring.push(obj); }
  save(); closeSheet(); toast('Сохранено'); moreView='recurring'; renderMore();
}
async function deleteRecurring(id){ if(!await confirmSheet('Удалить шаблон? Уже проведённые операции останутся.',{okText:'Удалить',danger:true}))return;
  state.recurring=state.recurring.filter(r=>r.id!==id); save(); closeSheet(); toast('Удалено'); moreView='recurring'; renderMore(); }

function setDebtDir(dir){ document.getElementById('dbt-dir').value=dir; document.getElementById('dbt-iowe').classList.toggle('active',dir==='iowe'); document.getElementById('dbt-owed').classList.toggle('active',dir==='owed'); }
function debtAccChanged(){ const sel=document.getElementById('dbt-acc'), cur=document.getElementById('dbt-cur'); if(!sel||!cur)return; if(sel.value){ cur.value=accCur(sel.value); cur.disabled=true; } else cur.disabled=false; }
function saveDebt() {
  const dir=document.getElementById('dbt-dir').value, who=document.getElementById('dbt-who').value.trim();
  const amt=parseFloat(document.getElementById('dbt-amt').value); let code=document.getElementById('dbt-cur').value;

  state.debts.push({id:uid(),direction:dir,counterparty:who,currency:code,amount:round2(amt),accountId:accId,date:todayISO(),dueDate:due,rate,note,payments:[]});

function openDebtPay(id){ const d=state.debts.find(x=>x.id===id); if(!d)return; const rem=debtRemaining(d);

function saveDebtPay(id){ const d=state.debts.find(x=>x.id===id); if(!d)return; const amt=parseFloat(document.getElementById('pay-amt').value);

function pickIcon(fieldId,boxId,em){ document.getElementById(fieldId).value=em; document.querySelectorAll('#'+boxId+' [data-e]').forEach(d=>d.style.border='2px solid '+(d.dataset.e===em?'var(--accent)':'transparent')); }

function saveAccount(id) {
  const name=document.getElementById('acc-name').value.trim(), icon=document.getElementById('acc-icon').value, color=document.getElementById('acc-color').value;
  const currency=document.getElementById('acc-cur').value;
  const inv=document.getElementById('acc-inv').checked, off=inv?Math.max(0,Math.min(100,parseFloat(document.getElementById('acc-offtop').value)||0)):0;

/* ---------- Автообновление курсов ---------- */
async function updateRates() {
  const btn=document.getElementById('ratesBtn'); if(btn){ btn.textContent='⏳ Обновляю…'; btn.style.pointerEvents='none'; }
  try {
    const res=await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(state.baseCurrency), {cache:'no-store'});
    const data=await res.json();
    if(!data || data.result!=='success' || !data.rates) throw new Error('bad');
    let n=0, missing=[];
    state.currencies.forEach(c=>{
      if(c.code===state.baseCurrency){ c.rate=1; return; }
      const per=data.rates[c.code];               // сколько c.code за 1 базовую
      if(per>0){ c.rate=Math.round((1/per)*10000)/10000; n++; }   // база за 1 единицу c.code
      else missing.push(c.code);
    });
    (state.rateHistory ||= {})[todayISO()]=Object.fromEntries(state.currencies.map(c=>[c.code, c.rate]));   // снимок курсов на сегодня для исторической аналитики
    state.ratesUpdated=new Date().toISOString(); save();
    toast(n ? `Курсы обновлены${missing.length?` · без ${missing.join(', ')}`:''} ✓` : 'Не нашлось валют для обновления');
    if (currentTab==='more' && moreView==='currencies') renderMore();
  } catch(e) {
    if(btn){ btn.textContent='🔄 Обновить курсы'; btn.style.pointerEvents='auto'; }
    toast('Не удалось обновить (нет сети или сервис недоступен)');
  }
}

/* ---------- Экспорт / импорт / сброс ---------- */
/* ================= Синхронизация через GitHub Gist =================
   Данные хранятся в приватном Gist пользователя. Токен — только локально (в Gist НЕ уходит).
   Модель слияния: last-write-wins по state.rev (wall-clock). Перед заменой локальных данных — бэкап. */
const SYNC_KEY='konverty_sync';         // {token, gistId}
const SYNC_TS_KEY='konverty_sync_at';   // когда последний раз синхронизировались (для UI)
const SYNC_FILE='konverty_state.json';
let _syncTimer=null, _syncing=false;
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); }catch(e){ return null; } }
function syncSetCfg(c){ try{ if(c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }catch(e){} }
function syncConfigured(){ const c=syncCfg(); return !!(c && c.token && c.gistId); }
function syncMarkAt(){ try{ localStorage.setItem(SYNC_TS_KEY, String(Date.now())); }catch(e){} }
function syncLastAt(){ try{ return +localStorage.getItem(SYNC_TS_KEY)||0; }catch(e){ return 0; } }
function _gh(path, opts){ opts=opts||{}; const c=syncCfg();
  const headers=Object.assign({'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}, opts.headers||{});
  if(c&&c.token) headers['Authorization']='Bearer '+c.token;
  return fetch('https://api.github.com'+path, Object.assign({}, opts, {headers})); }
async function syncConnect(token){
  token=(token||'').trim(); if(!token){ toast('Вставь токен'); return false; }
  syncSetCfg({token, gistId:null});
  try{
    const r=await _gh('/gists?per_page=100'); if(!r.ok) throw new Error('auth');
    const list=await r.json();
    let gistId=(list.find(g=>g.files && g.files[SYNC_FILE])||{}).id || null;
    if(!gistId){
      const body={description:'Конверты — синхронизация (не редактировать вручную)', public:false, files:{[SYNC_FILE]:{content:JSON.stringify(state)}}};
      const cr=await _gh('/gists',{method:'POST', body:JSON.stringify(body)}); if(!cr.ok) throw new Error('create'); const g=await cr.json(); gistId=g.id;
    }
    syncSetCfg({token, gistId});
    await syncNow(false);
    return true;
  }catch(e){ syncSetCfg(null); toast('Не удалось подключить (проверь токен и право «gist»)'); return false; }
}
async function syncPull(){ const c=syncCfg(); if(!c||!c.gistId) return null;
  const r=await _gh('/gists/'+c.gistId); if(!r.ok) throw new Error('pull'); const g=await r.json();
  const f=g.files&&g.files[SYNC_FILE]; if(!f) return null;
  let content=f.content; if(f.truncated && f.raw_url){ const rr=await fetch(f.raw_url); content=await rr.text(); }
  try{ return JSON.parse(content); }catch(e){ return null; } }
async function syncPush(){ const c=syncCfg(); if(!c||!c.gistId) return false;
  const body={files:{[SYNC_FILE]:{content:JSON.stringify(state)}}};
  const r=await _gh('/gists/'+c.gistId,{method:'PATCH', body:JSON.stringify(body)}); if(!r.ok) throw new Error('push'); return true; }
async function syncNow(silent){
  if(!syncConfigured()){ if(!silent) toast('Синхронизация не подключена'); return; }
  if(_syncing) return; _syncing=true;
  try{
    const remote=await syncPull();
    const localRev=+state.rev||0, remoteRev=remote?(+remote.rev||0):-1;
    if(remote && remoteRev>localRev){
      try{ await createBackup('pre-sync'); }catch(e){}
      state=remote; normalize(); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} dataStamp++; _balCache=null; render();
      syncMarkAt(); toast('Загружено с облака ✓');
    } else if(!remote || localRev>remoteRev){
      await syncPush(); syncMarkAt(); if(!silent) toast('Выгружено в облако ✓');
    } else { syncMarkAt(); if(!silent) toast('Уже синхронизировано'); }
    // Авто-платежи проводим ПОСЛЕ синхронизации, на свежем общем состоянии — иначе устройства
    // (особенно при разнице часовых поясов) задваивают/расходятся по одному и тому же платежу.
    try{ const n=autoPostDueRecurring(); if(n){ _balCache=null; render(); await syncPush(); syncMarkAt(); toast(`Автоматически проведено: ${n}`); } }catch(e){}
    if(currentTab==='more'&&moreView==='sync') renderMore();
  }catch(e){ if(!silent) toast('Ошибка синхронизации — проверь сеть и токен'); }
  finally{ _syncing=false; }
}
function syncPushDebounced(){ if(!syncConfigured()) return; clearTimeout(_syncTimer); _syncTimer=setTimeout(()=>{ syncPush().then(syncMarkAt).catch(()=>{}); }, 2500); }
function syncOnLoad(){ if(syncConfigured()) setTimeout(()=>syncNow(true), 400); }
function syncDisconnect(){ syncSetCfg(null); try{ localStorage.removeItem(SYNC_TS_KEY); }catch(e){} toast('Синхронизация отключена'); renderMore(); }
function renderSync(el){
  const cfg=syncConfigured(); const last=syncLastAt();
  const lastStr=last?new Date(last).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'ещё не было';
  el.innerHTML=`<button class="back-btn" onclick="backMore()">‹ Назад</button><h2 style="margin:0 4px 12px">☁️ Синхронизация</h2>
    ${cfg?`
      <div class="card tight"><div class="row"><span class="muted">Статус</span><span class="green" style="font-weight:700">подключено</span></div>
        <div class="row"><span class="muted">Последняя синхронизация</span><span style="font-weight:600">${lastStr}</span></div></div>
      <button class="btn" onclick="syncNow(false)">🔄 Синхронизировать сейчас</button>
      <button class="btn sec" style="margin-top:10px" onclick="syncDisconnect()">Отключить на этом устройстве</button>
      <div class="small-note" style="margin-top:12px">Данные в твоём приватном GitHub Gist. Приложение выгружает изменения само и подтягивает их при запуске. Если менял на двух устройствах офлайн — побеждает более позднее изменение (перед заменой создаётся резервная копия).</div>
      <div class="small-note" style="margin-top:8px">Второе устройство: открой этот экран там и вставь <b>тот же токен</b> — оно найдёт тот же Gist автоматически.</div>
    `:`
      <div class="small-note" style="margin-bottom:12px">Синхронизация ПК↔телефон через твой приватный <b>GitHub Gist</b>. Нужен токен с правом «gist» — он хранится только на этом устройстве и в сам Gist не попадает.</div>
      <div class="card tight" style="margin-bottom:12px">
        <div style="font-weight:700;margin-bottom:6px">Как получить токен (~1 минута)</div>
        <div class="small-note">1. Открой <b>github.com/settings/tokens</b> → Generate new token → <b>Tokens (classic)</b>.<br>2. В Scopes отметь только <b>gist</b>.<br>3. Скопируй токен (вида <code>ghp_…</code>) и вставь ниже.</div></div>
      <label class="field"><span>Токен GitHub (ghp_…)</span><input class="input" id="sync-token" type="password" placeholder="ghp_..." autocomplete="off"></label>
      <button class="btn" onclick="syncConnectUI()">Подключить</button>
      <div class="small-note" style="margin-top:10px">На втором устройстве вставь <b>тот же</b> токен — данные подтянутся сами.</div>
    `}`;
}
function syncConnectUI(){ const t=document.getElementById('sync-token'); if(!t) return; const btn=event&&event.target; if(btn){ btn.disabled=true; btn.textContent='Подключаю…'; } syncConnect(t.value).then(ok=>{ if(ok){ toast('Подключено ✓'); moreView='sync'; renderMore(); } else if(btn){ btn.disabled=false; btn.textContent='Подключить'; } }); }
function exportData() {

function parseCSV(text){

  const nl=text.indexOf('\n'); const firstLine=nl>-1?text.slice(0,nl):text;
  const delim=(firstLine.split(';').length>firstLine.split(',').length)?';':',';
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch; }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

  if(m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/)){ let y=m[3]; if(y.length===2) y='20'+y;
    const d=order==='mdy'?m[2]:m[1], mo=order==='mdy'?m[1]:m[2]; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }

function parseCsvAmount(s){ if(s==null) return null; s=String(s).trim().replace(/[\s ]/g,'').replace(/[^\d.,\-]/g,'');

async function runCsvImport(){
  const d=csvData; if(!d) return; const a=acc(d.accountId); if(!a){ toast('Выбери счёт'); return; }

  const keyOf=(date,amt,note,isInc)=>`${date}|${amt}|${note.trim().toLowerCase()}|${isInc?'i':'e'}`;
  const existing={};
  state.transactions.forEach(t=>{ if(t.type!=='income'&&t.type!=='expense') return; const k=keyOf(t.date,round2(t.amount),(t.note||''),t.type==='income'); existing[k]=(existing[k]||0)+1; });
  const batch={};
  // Этап 3: авто-категоризация по истории (payee memory) — описание из прошлых операций → категория.
  const noteCat={}; state.transactions.forEach(t=>{ if((t.type==='expense'||t.type==='income')&&t.note&&t.categoryId){ const k=t.note.trim().toLowerCase(); if(k) noteCat[k]={cat:t.categoryId,inc:t.type==='income'}; } });
  let added=0,dup=0,catn=0;
  try{ await createBackup('pre-import'); }catch(e){}
  for(const r of d.body){ const dt=parseCsvDate(r[d.map.date],d.dateOrder), am=parseCsvAmount(r[d.map.amount]); if(!dt||am==null||Math.abs(am)<0.0001) continue;
    const note=d.map.note>=0?String(r[d.map.note]||'').trim():''; const amt=round2(Math.abs(am));
    const isInc=d.sign==='income'||(d.sign==='auto'&&am>0);
    const key=keyOf(dt,amt,note,isInc); const done=batch[key]||0;
    if(done < (existing[key]||0)){ batch[key]=done+1; dup++; continue; }   // такое количество уже есть в истории
    batch[key]=done+1;
    const hit=note?noteCat[note.toLowerCase()]:null; const catId=(hit&&hit.inc===isInc)?hit.cat:null; if(catId) catn++;
    let tx;
    if(isInc) tx={id:uid(),type:'income',date:dt,currency:code,amount:amt,categoryId:catId,note,accountCredits:{[d.accountId]:{amt,cur:code}},plan:{},distribution:{}};
    else tx={id:uid(),type:'expense',date:dt,currency:code,amount:amt,accountId:d.accountId,envelopeId:inv?null:(d.envelopeId||null),categoryId:catId,note};
    state.transactions.push(tx); added++; }
  save(); csvData=null; toast(`Импортировано: ${added}${catn?` · категорий распознано ${catn}`:''}${dup?` · дублей ${dup}`:''} ✓`); moreView=null; render();
}

/* ---------- Добавление операции из текста SMS/уведомления банка (пункт 4) ---------- */
function parseSmsAmount(text){
  text=String(text).replace(/ /g,' ');
  // 1) число рядом с валютой — самый надёжный признак суммы
  const re=/(\d[\d\s]{0,12}(?:[.,]\d{1,2})?)\s*(₸|тг|тнг|тенге|руб|₽|грн|₴|\$|usd|eur|€|kzt|rub|uah)/gi;
  let m, best=null; while((m=re.exec(text))){ const n=parseFloat(m[1].replace(/\s/g,'').replace(',','.')); if(!isNaN(n)) best=n; }
  if(best!=null) return round2(best);
  // 2) запасной вариант — самое большое число, не являющееся маской карты (*1234)
  const nums=[]; let mm; const re2=/(^|[^\d*])(\d[\d\s]{0,12}(?:[.,]\d{1,2})?)/g;
  while((mm=re2.exec(text))){ const n=parseFloat(mm[2].replace(/\s/g,'').replace(',','.')); if(!isNaN(n)) nums.push(n); }
  return nums.length? round2(Math.max(...nums)) : null;
}
function smsMerchant(text){
  let s=String(text).replace(/ /g,' ').replace(/https?:\/\/\S+/g,' ');
  s=s.replace(/\d[\d\s.,:*\/-]*\d/g,' ').replace(/[₸₽₴$€]/g,' ').replace(/\b(kzt|rub|usd|eur|uah|тг|тнг|руб|грн)\b/gi,' ');
  s=s.replace(/\b(списан[а-я]*|зачислен[а-я]*|оплат[а-я]*|покупк[а-я]*|перевод[а-я]*|карт[а-я]*|сч[её]т[а-я]*|баланс[а-я]*|доступно|available|card|бонус[а-я]*|к[эе]шб[э]к[а-я]*|pokupka|oplata|dostupno|balance)\b/gi,' ');
  const words=s.split(/[^\p{L}]+/u).filter(w=>w.length>2);
  return words.slice(0,3).join(' ').trim();
}

}

function saveGoal(id){ const name=document.getElementById('g-name').value.trim(); if(!name){toast('Введи название');return;}

  const {envBal,accBal}=computeBalances();

    const discBurn=Math.max(0, round2((expenseAct-recExpPosted)/Math.max(1,todayD)));
    const whatIf=planDailyWhatIf!==''?Math.max(0,round2(parseFloat(planDailyWhatIf)||0)):null;

    const recIncF=rec.filter(r=>r.type==='income'&&r.lastPosted!==ym).map(r=>({day:Math.min(r.day||1,dim),amt:toBase(r.amount,r.currency)}));
    const recExpF=rec.filter(r=>r.type==='expense'&&r.lastPosted!==ym).map(r=>({day:Math.min(r.day||1,dim),amt:toBase(r.amount,r.currency)}));
    let bal=spendNow, zeroDay=null;
    recIncF.forEach(r=>{ if(r.day<=todayD) bal=round2(bal+r.amt); });
    recExpF.forEach(r=>{ if(r.day<=todayD) bal=round2(bal-r.amt); });
    if(bal<0) zeroDay=todayD;
    for(let d=todayD+1; d<=dim; d++){ bal=round2(bal-burn); recIncF.forEach(r=>{ if(r.day===d) bal=round2(bal+r.amt); }); recExpF.forEach(r=>{ if(r.day===d) bal=round2(bal-r.amt); }); if(bal<0 && zeroDay===null) zeroDay=d; }
    const end=round2(bal), gen=MONTHS_GEN[+ym.split('-')[1]-1];

      : `<div class="info-line">Денег на счетах хватит до конца месяца. Останется примерно <b>${fmtBase(end)}</b>.</div>`;
    const incF=recIncF.reduce((s,r)=>s+r.amt,0);

      <div class="row"><span class="muted">Расход в день${whatIf!==null?' (сценарий)':' (текущий темп)'}</span><span style="font-weight:800${whatIf!==null?';color:var(--accent-d)':''}">${fmtBase(burn)}</span></div>
      ${incF>0?`<div class="row"><span class="muted">Ожидается доход в этом месяце</span><span style="font-weight:800" class="green">+${fmtBase(incF)}</span></div>`:''}

      <div style="margin-top:10px">${runway}</div>
      <label class="field" style="margin-top:12px"><span>Что если тратить в день (${state.baseCurrency})</span>
        <input class="input" type="number" inputmode="decimal" placeholder="${Math.round(discBurn)} — текущий темп" value="${planDailyWhatIf}" onchange="planDailyWhatIf=this.value.trim(); renderMore()"></label>
      ${whatIf!==null?`<button class="btn sec small" style="margin-top:8px" onclick="planDailyWhatIf='';renderMore()">Сбросить сценарий</button>`:''}
      <div class="small-note" style="margin-top:8px">Оценка по темпу трат и будущим повторяющимся платежам. Курсы и категории учтены приблизительно.</div></div>`;
  }
  el.innerHTML=`<button class="back-btn" onclick="backMore()">‹ Назад</button><h2 style="margin:0 4px 12px">План на ${monthLabel(ym)}</h2>
    <div class="card">
      <div class="plan-row"><span class="lab">💰 Доход${incExpected>0?' (факт + ожидается)':' (факт)'}</span><span class="green" style="font-weight:800">+${fmtBase(incomeTotal)}</span></div>
      <div class="plan-row"><span class="lab">🔁 Обязательные · ${billCount}</span><span style="font-weight:700">−${fmtBase(billsPlan)}</span></div>
      <div class="plan-row"><span class="lab">🎯 Отложить в цели</span><span style="font-weight:700">−${fmtBase(goalsPlan)}</span></div>
      <div class="plan-row total"><span class="lab">Свободно распределить</span><span class="${freeAlloc>=0?'green':'red'}">${freeAlloc<0?'−':''}${fmtBase(Math.abs(freeAlloc))}</span></div></div>
    <div class="card tight">
      <div class="row"><span class="muted">Фактически потрачено за месяц</span><span style="font-weight:800">${fmtBase(expenseAct)}</span></div>
      ${gRes>0.005?`<div class="row"><span class="muted">🎯 Зарезервировано в целях</span><span style="font-weight:800">${fmtBase(gRes)}</span></div>`:''}
      <div class="row"><span class="muted">Свободно${gRes>0.005?' (за вычетом целей)':''}</span><span style="font-weight:800" class="${free<-0.005?'red':''}">${fmtBase(free)}</span></div>
      ${isCur?`<div class="row"><span class="muted">📅 Можно тратить в день (осталось ${daysLeftInMonth()} дн.)</span><span style="font-weight:800" class="green">${fmtBase(round2(Math.max(0,free)/daysLeftInMonth()))}</span></div>`:''}</div>
    ${forecastCard}

/* =================================================================
   Погашение долгов (снежный ком / лавина)
   ================================================================= */
function debtRemainingBase(d){ return toBase(Math.max(0,debtRemaining(d)), d.currency); }
function debtOrder(list, strategy){ const a=list.slice();
  if(strategy==='avalanche') a.sort((x,y)=>(y.rate-x.rate)||(x.rem-y.rem));
  else if(strategy==='duedate') a.sort((x,y)=>((x.due<y.due?-1:x.due>y.due?1:0))||(x.rem-y.rem));
  else a.sort((x,y)=>x.rem-y.rem);   // snowball — от меньшего
  return a; }
function simulateDebtPayoff(strategy, monthlyBase){
  const items=state.debts.filter(d=>d.direction==='iowe' && debtRemaining(d)>0.005)
    .map(d=>({name:d.counterparty||'—', rem:debtRemainingBase(d), rate:d.rate||0, due:d.dueDate||'9999-99'}));
  if(!items.length) return {empty:true};
  const order=debtOrder(items,strategy).map(i=>i.name);
  if(monthlyBase<=0) return {order, need:true};
  let month=0;
  while(items.some(i=>i.rem>0.005) && month<600){
    month++;
    items.forEach(i=>{ if(i.rem>0) i.rem=round2(i.rem + i.rem*(i.rate||0)/1200); });
    let pay=monthlyBase;
    for(const i of debtOrder(items,strategy)){ if(pay<=0.005) break; if(i.rem<=0) continue; const p=Math.min(pay,i.rem); i.rem=round2(i.rem-p); pay=round2(pay-p); }
  }
  const done=!items.some(i=>i.rem>0.005);
  return { order, months: done?month:null, impossible:!done };
}
function planMonthsLabel(n){ let [y,m]=todayISO().slice(0,7).split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12)+1; return `${MONTHS_NOM[m-1]} ${y}`; }
function setDebtStrategy(s){ state.debtStrategy=s; save(); renderMore(); }
function setDebtBudget(v){ state.debtBudget=round2(parseFloat(v)||0); save(); renderMore(); }
function debtPayoffCard(){
  const iowe=state.debts.filter(d=>d.direction==='iowe' && debtRemaining(d)>0.005);
  if(iowe.length<1) return '';
  const strat=state.debtStrategy||'snowball';
  const sim=simulateDebtPayoff(strat, state.debtBudget||0);
  const stratName={snowball:'снежный ком',avalanche:'лавина',duedate:'по сроку'}[strat];
  const orderHtml=(sim.order||[]).map((n,i)=>`<div class="preview-line"><span>${i+1}. ${esc(n)}</span></div>`).join('');
  let res='';
  if(sim.need) res=`<div class="info-line" style="margin-top:8px">Укажи сумму в месяц — посчитаю, когда закроешь все долги.</div>`;
  else if(sim.impossible) res=`<div class="info-line" style="background:var(--red-soft);color:var(--red);margin-top:8px">При такой сумме долги почти не уменьшаются (проценты съедают). Увеличь ежемесячный платёж.</div>`;
  else if(sim.months!=null) res=`<div class="info-line" style="margin-top:8px">Закроешь все долги за <b>${sim.months} мес</b> — примерно к <b>${planMonthsLabel(sim.months)}</b>.</div>`;
  return `<div class="card"><div class="section-title" style="margin:0 0 8px">План погашения</div>
    <div class="mini-seg"><button class="${strat==='snowball'?'active':''}" onclick="setDebtStrategy('snowball')">Снежный ком</button>
      <button class="${strat==='avalanche'?'active':''}" onclick="setDebtStrategy('avalanche')">Лавина</button>
      <button class="${strat==='duedate'?'active':''}" onclick="setDebtStrategy('duedate')">По сроку</button></div>
    <div class="small-note" style="margin:0 2px 8px">${strat==='snowball'?'Сначала гасим самый маленький долг — быстрый эффект.':strat==='avalanche'?'Сначала гасим долг с самым высоким % (укажи ставку у долга).':'Сначала гасим ближайшие по сроку.'}</div>
    <label class="field" style="margin-bottom:10px"><span>Готов направлять на долги в месяц (${state.baseCurrency})</span>
      <input class="input" type="number" inputmode="decimal" value="${state.debtBudget||''}" placeholder="0" onchange="setDebtBudget(this.value)"></label>
    <div class="small-note" style="margin:0 2px 4px">Порядок выплат (${stratName}):</div>
    <div class="preview-box">${orderHtml}</div>${res}</div>`;
}

/* =================================================================
   Теги и наблюдение (вотчлисты)
   ================================================================= */
function txTags(t){ if(!t||!t.note) return []; const out=[]; const re=/#([\p{L}\p{N}_]+)/gu; let m; while((m=re.exec(t.note))) out.push(m[1].toLowerCase()); return [...new Set(out)]; }
function watchSpent(w, ym){ const list=state.transactions.filter(t=>t.date.slice(0,7)===ym && t.type==='expense');
  if(w.type==='category') return list.reduce((s,t)=>{ for(const p of txParts(t)){ if(p.categoryId===w.value) s=s+toBaseAt(p.amount,t.currency,t.date); } return s; },0);
  return list.filter(t=>txTags(t).includes(w.value)).reduce((s,t)=>s+toBaseAt(t.amount,t.currency,t.date),0); }
function renderWatch(el){
  const curYm=todayISO().slice(0,7); const useYm=viewMonth;
  const months=[]; { let [y,m]=curYm.split('-').map(Number); for(let i=0;i<3;i++){ m--; if(m<1){m=12;y--;} months.unshift(`${y}-${String(m).padStart(2,'0')}`); } }
  const daysNow=new Date().getDate();

    const color=w.type==='category'?(catById(w.value)?.color||'#94a3b8'):'#7b5cff';
    const spent=watchSpent(w,useYm);
    const proj=(useYm===curYm&&daysNow>0)?round2(spent/daysNow*daysInMonth(useYm)):spent;
    const avg=round2(months.reduce((s,mm)=>s+watchSpent(w,mm),0)/3);
    const over=w.target>0&&proj>w.target, pct=w.target>0?Math.min(100,Math.round(spent/w.target*100)):0;

        <button class="icon-btn" onclick="openWatch('${w.id}')">✏️</button></div>

      <div class="small-note" style="margin-top:8px">Среднее за 3 мес: ${fmtBase(avg)}${(avg>0&&useYm===curYm)?` · прогноз ${proj>avg?'<span class="red">выше</span>':'<span class="green">ниже</span>'} среднего`:''}</div></div>`; }).join('');

    ${items||'<div class="empty"><div class="big">🚦</div>Пока нет лимитов и наблюдений</div>'}
    <button class="btn" onclick="openWatch()">＋ Добавить лимит / наблюдение</button>`;
}

/* ---------- Напоминания (пункт 7). На file:// работают только при открытом приложении. ---------- */
const NOTIFY_KEY='konverty_notify', NOTIFY_LAST='konverty_notify_last';
function notifySupported(){ return typeof Notification!=='undefined'; }
function notifyEnabled(){ try{ return localStorage.getItem(NOTIFY_KEY)==='1'; }catch(e){ return false; } }
function notifyGranted(){ return notifySupported() && Notification.permission==='granted'; }
function showNotify(title, body){ try{ if(notifyGranted()) new Notification(title, {body:body||'', icon:'./icon.svg'}); }catch(e){} }
async function enableNotifications(){
  if(!notifySupported()){ toast('Браузер не поддерживает уведомления'); return; }
  try{ const p=await Notification.requestPermission();
    if(p==='granted'){ localStorage.setItem(NOTIFY_KEY,'1'); toast('Напоминания включены ✓'); fireDueNotification(true); }
    else toast('Доступ к уведомлениям не выдан');
  }catch(e){ toast('Не удалось включить уведомления'); }
  openNotifySettings();
}
function disableNotifications(){ try{ localStorage.setItem(NOTIFY_KEY,'0'); }catch(e){} toast('Напоминания выключены'); openNotifySettings(); }
function fireDueNotification(force){
  if(!notifyEnabled() || !notifyGranted()) return;
  const today=todayISO();
  if(!force){ try{ if(localStorage.getItem(NOTIFY_LAST)===today) return; }catch(e){} }
  const items=payAgendaItems();
  const duePay=items.filter(i=>i.type==='expense' && i.date<=today);              // к оплате: просрочено + сегодня
  const tmr=(()=>{ const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  const soon=items.filter(i=>i.type==='expense' && i.date===tmr);                 // завтра
  const {envBal}=computeBalances();
  const negEnv=activeEnvelopes().map(e=>({e,base:envelopeBase(envBal,e.id)})).filter(x=>x.base<-0.5);
  const parts=[];
  if(duePay.length){ const sum=round2(duePay.reduce((s,i)=>s+toBase(i.amount,i.currency),0)); parts.push(`К оплате: ${duePay.length} на ${fmtBase(sum)}`); }
  if(soon.length) parts.push(`Завтра: ${soon.length} ${plural(soon.length,'платёж','платежа','платежей')}`);
  if(negEnv.length) parts.push(`${negEnv.length} ${plural(negEnv.length,'конверт в минусе','конверта в минусе','конвертов в минусе')}`);
  if(!parts.length){ if(force) toast('Сейчас напоминать не о чем 👍'); return; }
  showNotify('Конверты — напоминание', parts.join(' · '));
  try{ localStorage.setItem(NOTIFY_LAST, today); }catch(e){}
}
function openNotifySettings(){
  const supp=notifySupported(), on=notifyEnabled()&&notifyGranted();
  openSheet(`<h2>🔔 Напоминания</h2>
    <div class="small-note" style="margin-bottom:12px">Системные уведомления о том, что пора внести повторяющийся платёж или что конверт ушёл в минус.</div>
    ${!supp?`<div class="info-line" style="background:var(--red-soft);color:var(--red)">Этот браузер не поддерживает уведомления.</div>`
      :on?`<div class="info-line">Напоминания включены ✓</div><div class="btn-grid" style="margin-top:10px"><button class="btn sec" onclick="disableNotifications()">Выключить</button><button class="btn" onclick="fireDueNotification(true)">Проверить сейчас</button></div>`
      :`<button class="btn" onclick="enableNotifications()">Включить напоминания</button>`}
    <div class="small-note" style="margin-top:14px">⚠️ Приложение открыто как локальный файл, поэтому напоминания приходят только когда оно открыто (при запуске и возврате на вкладку). Чтобы получать их в фоне при закрытом приложении, нужно разместить приложение на HTTPS-хостинге.</div>`);
}

/* Свайп по операции влево — быстрое удаление (с возможностью отмены) */
let swEl=null, swX0=0, swY0=0, swDx=0, swAct=false;
document.addEventListener('touchstart', e=>{ const op=e.target.closest('.op'); if(!op){ swEl=null; return; }
  swEl=op; swX0=e.touches[0].clientX; swY0=e.touches[0].clientY; swDx=0; swAct=false; }, {passive:true});
document.addEventListener('touchmove', e=>{ if(!swEl) return;
  const dx=e.touches[0].clientX-swX0, dy=e.touches[0].clientY-swY0;
  if(!swAct){ if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)+4){ swAct=true; swEl.classList.add('swiping'); }
    else if(Math.abs(dy)>10){ swEl=null; return; } }
  if(swAct){ swDx=Math.min(0, dx); swEl.style.transform=`translateX(${swDx}px)`;
    swEl.style.opacity = String(Math.max(.4, 1+swDx/240)); e.preventDefault(); } }, {passive:false});
document.addEventListener('touchend', ()=>{ if(!swEl) return; const el=swEl, dx=swDx; swEl=null;
  el.classList.remove('swiping');
  if(swAct && dx<-80){ const id=el.dataset.id; el.style.transition='transform .18s,opacity .18s'; el.style.transform='translateX(-100%)'; el.style.opacity='0'; haptic(15); setTimeout(()=>{ if(id) deleteTx(id); }, 160); }
  else { el.style.transform=''; el.style.opacity=''; } });

/* Долгое нажатие на счёт/конверт — корректировка текущей суммы */
let lpTimer=null, lpFiredAt=0, lpX0=0, lpY0=0;
function lpStart(e){ const el=(e.target.closest&&e.target.closest('.acc,.env')); if(!el) return;
  const kind=el.classList.contains('acc')?'account':'envelope', id=el.dataset.id;
  const p=e.touches?e.touches[0]:e; lpX0=p.clientX; lpY0=p.clientY;
  clearTimeout(lpTimer); lpTimer=setTimeout(()=>{ lpFiredAt=Date.now(); haptic(22); openCorrection(kind,id); }, 500); }
function lpCancel(){ clearTimeout(lpTimer); lpTimer=null; }
function lpMove(e){ if(!lpTimer) return; const p=e.touches?e.touches[0]:e; if(Math.abs(p.clientX-lpX0)>8||Math.abs(p.clientY-lpY0)>8) lpCancel(); }
document.addEventListener('touchstart', lpStart, {passive:true});
document.addEventListener('touchmove', lpMove, {passive:true});
document.addEventListener('mousemove', lpMove, {passive:true});
document.addEventListener('touchend', lpCancel);
document.addEventListener('mousedown', lpStart);
document.addEventListener('mouseup', lpCancel);
document.addEventListener('mouseleave', lpCancel);
document.addEventListener('scroll', lpCancel, {passive:true});

/* H6: делаем div-«кнопки» доступными с клавиатуры (role/tabindex + Enter/Space) и озвучиваем иконки (aria-label) */
(function(){
  const SEL='.op,.acc,.env,.menu-item,.cat-item,.fund-row,.echip,.chip,.theme-card,.cat-line';
  const markOne=el=>{ if(el.nodeType!==1||!el.matches) return;
    if(el.matches(SEL)&&!el.hasAttribute('role')){ el.setAttribute('role','button'); el.tabIndex=0; }
    if(el.matches('.icon-btn[title]')&&!el.hasAttribute('aria-label')) el.setAttribute('aria-label', el.getAttribute('title')); };
  const pass=root=>{ if(!root||root.nodeType!==1) return; markOne(root); root.querySelectorAll&&root.querySelectorAll(SEL+',.icon-btn[title]').forEach(markOne); };
  try{ const obs=new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(pass)));
    ['main','#sheet'].forEach(s=>{ const r=document.querySelector(s); if(r){ pass(r); obs.observe(r,{childList:true,subtree:true}); } });
  }catch(e){}
  document.addEventListener('keydown', e=>{ const t=e.target;
    if((e.key==='Enter'||e.key===' ') && t && t.getAttribute && t.getAttribute('role')==='button' && !['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(t.tagName)){ e.preventDefault(); t.click(); } });
})();

setTimeout(()=>{ const s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(()=>s.remove(),500); } }, 820);
applyTheme(); load();
let autoN=0;
try { if(!syncConfigured()) autoN=autoPostDueRecurring(); switchTab('home'); }   // при синхронизации авто-платежи проводятся ПОСЛЕ пула (см. syncNow), чтобы устройства не задваивали
catch(err){ console.error('render error', err);
  try{ const o=document.getElementById('screen-ops'); if(o) o.innerHTML='<div class="empty"><div class="big">⚠️</div>Не удалось отобразить данные. Открой «Ещё → Резервные копии», чтобы восстановить последнюю копию, либо «Экспорт», чтобы сохранить файл.</div>'; }catch(e){} }
ensurePersist(); dailyBackup(); syncOnLoad();
try{ const _t=todayISO(); state.rateHistory ||= {}; if(!state.rateHistory[_t]){ state.rateHistory[_t]=Object.fromEntries(state.currencies.map(c=>[c.code, c.rate])); save(); } }catch(e){}   // ежедневный снимок курсов
if (autoN) setTimeout(()=>toast(`Автоматически проведено: ${autoN}`), 1100);
// Онбординг только для новой установки; существующему пользователю тихо ставим флаг.
try{ if(!localStorage.getItem(ONB_KEY)){ if(state.transactions.length===0) setTimeout(showOnboarding, 950); else localStorage.setItem(ONB_KEY,'1'); } }catch(e){}
setTimeout(()=>fireDueNotification(false), 1600);   // напоминания при запуске (если включены)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(()=>fireDueNotification(false), 300); });   // и при возврате в приложение (не чаще раза в день)
if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
