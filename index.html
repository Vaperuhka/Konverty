<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3bb8ab" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Конверты — учёт денег</title>
<script>
  /* Применяем тему как можно раньше — чтобы не было вспышки светлого фона. */
  (function(){ try{
    var t = localStorage.getItem('konverty_theme') || 'auto';
    var eff = t==='auto' ? ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light') : t;
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){} })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6fb;
    --card: #ffffff;
    --card2: #f2f4f9;
    --card-border: transparent;
    --line: #eef0f6;
    --txt: #2b2f39;
    --muted: #6b7280;
    --accent: #3bb8ab;
    --accent-d: #2fa093;
    --accent-soft: #e6f7f4;
    --green: #1f9d77;
    --red: #e0434e;
    --red-soft: #fdeaea;
    --blue: #5b8def;
    --amber: #f0b429;
    /* Акцентные градиенты и свечения (шапка, кнопки, тотал-карточка) */
    --grad1: #46c4b6;
    --grad2: #34a89b;
    --on-accent: #ffffff;
    --accent-glow: rgba(59,184,171,.30);
    --accent-glow-strong: rgba(59,184,171,.50);
    --header-shadow: rgba(52,168,155,.28);
    --input-focus-bg: #ffffff;
    --toast-bg: #2a2e37;
    --toast-txt: #ffffff;
    --danger-bg: #fdecec;
    --danger-txt: #ef5f68;
    --warn-bg: #fff8e8;
    --warn-line: #f4e6bf;
    --warn-txt: #946b12;
    --inv-bg: #fdf3dc;
    --inv-txt: #a9760a;
    --shadow: 0 3px 14px rgba(40,50,80,.05), 0 1px 4px rgba(40,50,80,.04);
    --shadow-lift: 0 8px 24px rgba(40,50,80,.10);
    /* Дизайн-система: единая шкала радиусов, отступов, зон нажатия и переходов (одинаково во всех темах) */
    --r-xs: 8px; --r-sm: 11px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
    --sp-1: 6px; --sp-2: 10px; --sp-3: 14px; --sp-4: 18px; --sp-5: 24px;
    --tap: 44px; --ease: .18s cubic-bezier(.2,.7,.3,1);
    --radius: 18px;
    --sbw: 256px;              /* ширина боковой навигации на ПК */
    --content-max: 1140px;     /* макс. ширина контента на ПК */
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  /* ===== Тёмная — тёплый графит с фирменной бирюзой ===== */
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c;
    --card: #1e222b;
    --card2: #262b36;
    --card-border: #2c313d;
    --line: #2a2f3a;
    --txt: #e7eaf0;
    --muted: #8b93a3;
    --accent: #3ec7b8;
    --accent-d: #2fa093;
    --accent-soft: #163430;
    --green: #35c692;
    --red: #f4707a;
    --red-soft: #3a2226;
    --grad1: #2f9e91;
    --grad2: #26837a;
    --header-shadow: rgba(0,0,0,.45);
    --accent-glow: rgba(0,0,0,.35);
    --accent-glow-strong: rgba(20,120,110,.45);
    --input-focus-bg: #262b36;
    --toast-bg: #f0f2f6;
    --toast-txt: #1a1d24;
    --danger-bg: #3a2226;
    --danger-txt: #f4707a;
    --warn-bg: #322a17;
    --warn-line: #4d4223;
    --warn-txt: #e6c56a;
    --inv-bg: #3a3018;
    --inv-txt: #e6c56a;
    --shadow: 0 3px 14px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.24);
    --shadow-lift: 0 10px 30px rgba(0,0,0,.45);
  }

  /* ===== Полночь — глубокий индиго с синим акцентом ===== */
  html[data-theme="midnight"] {
    color-scheme: dark;
    --bg: #0f1226;
    --card: #181c39;
    --card2: #21274a;
    --card-border: #2a3057;
    --line: #262c50;
    --txt: #e6e9f7;
    --muted: #8b91c0;
    --accent: #6c8cff;
    --accent-d: #5872e6;
    --accent-soft: #1c2350;
    --green: #4bd0a0;
    --red: #ff7b8a;
    --red-soft: #35203a;
    --grad1: #6c8cff;
    --grad2: #7b5cff;
    --on-accent: #ffffff;
    --header-shadow: rgba(0,0,0,.5);
    --accent-glow: rgba(108,140,255,.28);
    --accent-glow-strong: rgba(108,140,255,.5);
    --input-focus-bg: #21274a;
    --toast-bg: #eef0fb;
    --toast-txt: #171a33;
    --danger-bg: #35203a;
    --danger-txt: #ff7b8a;
    --warn-bg: #2c2740;
    --warn-line: #443c66;
    --warn-txt: #d7b56a;
    --inv-bg: #2f2a4a;
    --inv-txt: #d7b56a;
    --shadow: 0 3px 14px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.26);
    --shadow-lift: 0 10px 30px rgba(0,0,0,.5);
  }

  /* ===== Сепия — тёплая бумага с терракотой ===== */
  html[data-theme="sepia"] {
    color-scheme: light;
    --bg: #f3ece0;
    --card: #fbf6ee;
    --card2: #efe6d6;
    --card-border: #e7dcc8;
    --line: #eadfce;
    --txt: #43382a;
    --muted: #7a6a4f;
    --accent: #c8794a;
    --accent-d: #b0653a;
    --accent-soft: #f6e6d7;
    --green: #5e8749;
    --red: #c0463e;
    --red-soft: #f6ddd6;
    --grad1: #d08a53;
    --grad2: #c06f3c;
    --header-shadow: rgba(176,101,58,.28);
    --accent-glow: rgba(200,121,74,.28);
    --accent-glow-strong: rgba(200,121,74,.45);
    --input-focus-bg: #fbf6ee;
    --toast-bg: #43382a;
    --toast-txt: #fbf6ee;
    --danger-bg: #f6ddd6;
    --danger-txt: #cf5b52;
    --warn-bg: #f7ecd2;
    --warn-line: #e6d3a6;
    --warn-txt: #8a6d29;
    --inv-bg: #f2e2c4;
    --inv-txt: #9a7526;
    --shadow: 0 3px 14px rgba(120,90,50,.08), 0 1px 4px rgba(120,90,50,.05);
    --shadow-lift: 0 8px 24px rgba(120,90,50,.14);
  }

  /* ===== Океан — светлая с прохладным синим ===== */
  html[data-theme="ocean"] {
    color-scheme: light;
    --bg: #eef4f8;
    --card: #ffffff;
    --card2: #e7eef4;
    --card-border: transparent;
    --line: #e2eaf1;
    --txt: #23323f;
    --muted: #5f7688;
    --accent: #2f8fd6;
    --accent-d: #2678b8;
    --accent-soft: #e0f0fb;
    --green: #1c9578;
    --red: #e0434e;
    --red-soft: #fdeaea;
    --grad1: #3aa0e0;
    --grad2: #2f7fc4;
    --header-shadow: rgba(47,127,196,.26);
    --accent-glow: rgba(47,143,214,.28);
    --accent-glow-strong: rgba(47,143,214,.45);
    --input-focus-bg: #ffffff;
    --toast-bg: #23323f;
    --toast-txt: #ffffff;
    --danger-bg: #fdecec;
    --danger-txt: #ef5f68;
    --warn-bg: #fff5df;
    --warn-line: #f2e2b6;
    --warn-txt: #8a6d1e;
    --inv-bg: #fdf3dc;
    --inv-txt: #a9760a;
    --shadow: 0 3px 14px rgba(30,70,110,.06), 0 1px 4px rgba(30,70,110,.05);
    --shadow-lift: 0 8px 24px rgba(30,70,110,.12);
  }

  /* ===== Монарх — глубокий индиго с коралловым акцентом ===== */
  html[data-theme="monarch"] {
    color-scheme: dark;
    --bg:#0e1424; --card:#18203a; --card2:#222c4d; --card-border:#2b3659; --line:#273152;
    --txt:#e8ebf7; --muted:#8d96b8;
    --accent:#ff6a5d; --accent-d:#e8513f; --accent-soft:#3a2230;
    --green:#3fd08a; --red:#fb6f84; --red-soft:#3a2026;
    --grad1:#ff7a5e; --grad2:#ee5a46; --on-accent:#ffffff;
    --header-shadow:rgba(0,0,0,.5); --accent-glow:rgba(255,106,93,.28); --accent-glow-strong:rgba(255,106,93,.5);
    --input-focus-bg:#222c4d; --toast-bg:#eef0fb; --toast-txt:#141a2e;
    --danger-bg:#3a2026; --danger-txt:#fb6f84; --warn-bg:#332a14; --warn-line:#4d4223; --warn-txt:#e6c56a;
    --inv-bg:#2f2a4a; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.26); --shadow-lift:0 10px 30px rgba(0,0,0,.5);
  }

  /* ===== Уголь — почти чёрный графит с лаймовым акцентом ===== */
  html[data-theme="charcoal"] {
    color-scheme: dark;
    --bg:#0c0e10; --card:#16191d; --card2:#1e2227; --card-border:#272c32; --line:#23282d;
    --txt:#e9edea; --muted:#8a938c;
    --accent:#b6e34b; --accent-d:#9ccb3a; --accent-soft:#232f19;
    --green:#4ccf9b; --red:#ff6b73; --red-soft:#331f22;
    --grad1:#242a30; --grad2:#15181c; --on-accent:#17230a;
    --header-shadow:rgba(0,0,0,.5); --accent-glow:rgba(182,227,75,.22); --accent-glow-strong:rgba(182,227,75,.42);
    --input-focus-bg:#1e2227; --toast-bg:#eef0ee; --toast-txt:#16191d;
    --danger-bg:#331f22; --danger-txt:#ff6b73; --warn-bg:#2e2914; --warn-line:#4a4223; --warn-txt:#e6c56a;
    --inv-bg:#2b2a18; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3); --shadow-lift:0 10px 30px rgba(0,0,0,.55);
  }

  /* ===== Аметист — глубокий фиолетовый ===== */
  html[data-theme="amethyst"] {
    color-scheme: dark;
    --bg:#15102a; --card:#1e1740; --card2:#281f52; --card-border:#342a63; --line:#2e2558;
    --txt:#ece8fb; --muted:#9a90c8;
    --accent:#a06bff; --accent-d:#8657e6; --accent-soft:#241a4a;
    --green:#4bd0a0; --red:#ff7b8a; --red-soft:#351f3a;
    --grad1:#8a5cff; --grad2:#6c3fd6; --on-accent:#ffffff;
    --header-shadow:rgba(0,0,0,.5); --accent-glow:rgba(160,107,255,.3); --accent-glow-strong:rgba(160,107,255,.5);
    --input-focus-bg:#281f52; --toast-bg:#efecfb; --toast-txt:#1a1333;
    --danger-bg:#351f3a; --danger-txt:#ff7b8a; --warn-bg:#2f2740; --warn-line:#473c66; --warn-txt:#d7b56a;
    --inv-bg:#2f2a4a; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.34), 0 1px 3px rgba(0,0,0,.28); --shadow-lift:0 10px 30px rgba(0,0,0,.52);
  }

  /* ===== Изумруд — глубокий зелёный с тёплым золотом ===== */
  html[data-theme="emerald"] {
    color-scheme: dark;
    --bg:#0b1512; --card:#122420; --card2:#1a302a; --card-border:#243f37; --line:#203a33;
    --txt:#e6f0ea; --muted:#8aa89b;
    --accent:#e0b24a; --accent-d:#c89a32; --accent-soft:#2e2714;
    --green:#3fd0a0; --red:#ff7b84; --red-soft:#331f22;
    --grad1:#1d6b54; --grad2:#134a3b; --on-accent:#241c08;
    --header-shadow:rgba(0,0,0,.45); --accent-glow:rgba(224,178,74,.28); --accent-glow-strong:rgba(224,178,74,.5);
    --input-focus-bg:#1a302a; --toast-bg:#eaf0ec; --toast-txt:#122420;
    --danger-bg:#331f22; --danger-txt:#ff7b84; --warn-bg:#2e2914; --warn-line:#4a4223; --warn-txt:#e6c56a;
    --inv-bg:#2b2a18; --inv-txt:#d7b56a;
    --shadow:0 3px 14px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3); --shadow-lift:0 10px 30px rgba(0,0,0,.52);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:16px; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased; }
  body { padding-bottom: calc(78px + var(--safe-b)); }
  h1,h2,h3 { margin:0; font-weight:700; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select, textarea { font-family:inherit; font-size:16px; }
  .muted { color:var(--muted); } .green { color:var(--green); } .red { color:var(--red); }
  .hidden { display:none !important; } a { color:var(--accent); }
  /* Доступность: видимый фокус с клавиатуры (WCAG 2.4.7) */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  [role="button"], .op, .acc, .env, .menu-item, .cat-item, .fund-row, .theme-card { -webkit-tap-highlight-color:transparent; }
  /* Состояние disabled для кнопок */
  .btn[disabled], .btn.off { opacity:.5; pointer-events:none; }
  /* Единые плавные переходы для интерактивных поверхностей */
  .op,.acc,.env,.menu-item,.list-item,.btn,.echip,.chip,.theme-card,.icon-btn,.seg button,.mini-seg button,.scope-btn,.notice-btn { transition: background var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease), filter var(--ease), color var(--ease); }
  /* Наведение мышью (только там, где есть настоящий hover) */
  @media (hover:hover){
    .op:hover, .acc:hover, .env:hover, .menu-item:hover, .list-item:hover { background:var(--card2); }
    .btn:hover { filter:brightness(1.04); }
    .echip:hover, .chip:hover, .cat-item:hover, .theme-card:hover { border-color:var(--accent); }
  }

  header { position:sticky; top:0; z-index:20; color:#fff;
    background: linear-gradient(135deg, var(--grad1), var(--grad2));
    padding: calc(var(--safe-t) + 14px) 18px 16px; border-radius:0 0 var(--r-xl) var(--r-xl); box-shadow:0 4px 18px var(--header-shadow); }
  header .h-top { display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:19px; letter-spacing:.2px; font-weight:800; }
  .month-nav { display:flex; align-items:center; gap:2px; }
  .month-nav button { color:#fff; font-size:22px; width:var(--tap); height:var(--tap); border-radius:var(--r-md); display:grid; place-items:center; opacity:.95; }
  .month-nav button:active { background:rgba(255,255,255,.22); transform:scale(.94); }
  .month-nav .mlabel { font-weight:700; min-width:112px; text-align:center; font-size:14.5px; }
  .h-sum { display:flex; gap:10px; margin-top:14px; }
  .h-sum .box { flex:1; background:rgba(255,255,255,.16); border-radius:var(--r-md); padding:10px 13px; }
  .h-sum .box .l { font-size:11.5px; opacity:.9; }
  .h-sum .box .v { font-weight:800; font-size:16px; margin-top:2px; }
  .h-free { margin-top:9px; display:flex; gap:8px; flex-wrap:wrap; }
  .h-free .hf { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); border-radius:var(--r-md); padding:8px 13px; min-height:40px; font-size:12.5px; cursor:pointer; }
  .h-free .hf b { font-size:13.5px; font-weight:800; }
  .h-free .hf:active { background:rgba(255,255,255,.26); }

  main { padding:14px; max-width:640px; margin:0 auto; }
  .screen { display:none; } .screen.active { display:block; animation:fade .22s ease; }
  /* Экраны без оранжевого баннера — учитываем вырез/статус-бар телефона сверху */
  #screen-home, #screen-accounts, #screen-more { padding-top: var(--safe-t); }
  @keyframes fade { from{opacity:0; transform:translateY(4px)} to{opacity:1;transform:none} }

  .card { background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card.tight { padding:12px 15px; }
  .section-title { font-size:12.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:20px 6px 9px; font-weight:700; }

  .ops-filter { margin-bottom:6px; }
  .search-row { display:flex; gap:8px; align-items:stretch; }
  .search-inp { flex:1; }
  .scope-btn { flex:0 0 auto; background:var(--card2); color:var(--muted); font-weight:700; border-radius:var(--r-md); padding:0 15px; font-size:13px; white-space:nowrap; }
  .scope-btn:active { transform:scale(.98); }
  /* Полоса выбора периода (под баннером на Операциях/Анализе) */
  .period-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .per-nav { display:flex; align-items:center; gap:2px; background:var(--card2); border-radius:var(--r-md); padding:3px; }
  .per-nav button { width:36px; height:36px; border-radius:var(--r-sm); color:var(--txt); font-size:20px; display:grid; place-items:center; }
  .per-nav button:disabled { opacity:.3; pointer-events:none; }
  .per-nav button:not(:disabled):active { background:var(--card); transform:scale(.94); }
  .per-nav span { font-weight:700; font-size:14px; min-width:124px; text-align:center; }
  .per-all { background:var(--card2); color:var(--muted); font-weight:700; border-radius:var(--r-md); padding:0 15px; min-height:42px; font-size:13px; white-space:nowrap; }
  .per-all.active { background:var(--accent-soft); color:var(--accent-d); }
  .per-all:active { transform:scale(.98); }
  .due-box { background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:var(--r-lg); padding:12px 14px; margin-bottom:12px; }
  .due-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; color:var(--warn-txt); font-size:14px; }
  .due-row { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px dashed var(--warn-line); }
  .due-row:first-of-type { border-top:none; }

  .day-head { display:flex; justify-content:space-between; padding:15px 6px 7px; }
  .day-head .d { font-weight:700; font-size:13.5px; }
  .day-head .s { color:var(--muted); font-size:13px; }
  .op { display:flex; align-items:center; gap:12px; padding:12px 15px; background:var(--card); border-radius:var(--r-lg); margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer; }
  .op:active { background:var(--card2); transform:scale(.995); }
  .cat-ic { width:44px; height:44px; border-radius:var(--r-md); display:grid; place-items:center; font-size:21px; flex:0 0 auto; color:#fff; }
  .op .oi { flex:1; min-width:0; }
  .op .ot { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .op .os { color:var(--muted); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .op .oa { font-weight:800; white-space:nowrap; font-size:15.5px; }
  /* Разделяем соседние иконки-кнопки, чтобы не промахиваться (особенно удаление рядом с восстановлением) */
  .icon-btn + .icon-btn { margin-left:8px; }
  /* Аффорданс свайп-удаления операции: при свайпе строка краснеет и показывает 🗑 */
  .op.swiping { background:var(--red-soft) !important; }
  .op.swiping::after { content:'🗑'; position:absolute; top:0; bottom:0; right:16px; display:flex; align-items:center; font-size:18px; opacity:.85; pointer-events:none; }

  .empty { text-align:center; color:var(--muted); padding:44px 20px; }
  .empty .big { font-size:44px; margin-bottom:10px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--accent); color:var(--on-accent);
    font-weight:700; border-radius:var(--r-md); padding:14px 16px; font-size:15px; width:100%; min-height:var(--tap); box-shadow:0 4px 12px var(--accent-glow); }
  .btn:active { transform:scale(.98); }
  .btn.sec { background:var(--card2); color:var(--txt); box-shadow:none; }
  .btn.danger { background:var(--danger-bg); color:var(--danger-txt); box-shadow:none; }
  .btn.small { padding:9px 13px; font-size:13.5px; width:auto; min-height:0; box-shadow:none; }
  .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* Account & envelope rows */
  .acc { display:flex; align-items:center; gap:13px; padding:14px 15px; background:var(--card); border-radius:var(--r-lg); margin-bottom:9px; box-shadow:var(--shadow); }
  .acc .info { flex:1; min-width:0; }
  .acc .name { font-weight:600; display:flex; gap:7px; align-items:center; }
  .acc .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .acc .bal { text-align:right; font-weight:800; white-space:nowrap; }
  .acc .bal small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .env { display:flex; align-items:center; gap:12px; padding:12px 15px; background:var(--card); border-radius:var(--r-lg); margin-bottom:8px; box-shadow:var(--shadow); }
  .env .dot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .env .info { flex:1; min-width:0; }
  .env .name { font-weight:600; }
  .env .pct { color:var(--muted); font-size:12px; margin-top:2px; }
  .env .bal { text-align:right; font-weight:700; white-space:nowrap; }
  .env .bal small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .badge { font-size:10.5px; padding:3px 8px; border-radius:999px; background:var(--card2); color:var(--muted); font-weight:700; }
  .badge.inv { color:var(--inv-txt); background:var(--inv-bg); }

  .total-card { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color:#fff; border-color:transparent; box-shadow:0 8px 22px var(--header-shadow); }
  .total-card .l { opacity:.92; font-size:13px; }
  .total-card .a { font-size:clamp(26px,8vw,34px); font-weight:800; margin-top:3px; letter-spacing:-.5px; overflow-wrap:anywhere; }
  .total-card .cur { margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; }
  .total-card .cur .b { background:rgba(255,255,255,.2); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row + .row { margin-top:10px; }

  /* Analysis */
  .donut-wrap { display:flex; justify-content:center; padding:6px 0 2px; }
  .cat-line { display:flex; align-items:center; gap:12px; padding:10px 2px; }
  .cat-line .ci { width:36px; height:36px; border-radius:var(--r-md); display:grid; place-items:center; font-size:17px; color:#fff; flex:0 0 auto; }
  .cat-line .cinfo { flex:1; min-width:0; }
  .cat-line .cname { font-weight:600; font-size:14.5px; display:flex; justify-content:space-between; gap:8px; }
  .cat-line .bar { height:7px; border-radius:4px; background:var(--card2); margin-top:6px; overflow:hidden; }
  .cat-line .bar > i { display:block; height:100%; border-radius:4px; }
  .cat-line .cpct { color:var(--muted); font-size:12px; font-weight:700; min-width:46px; text-align:right; }
  .mchart { display:flex; align-items:flex-end; gap:6px; height:120px; padding:6px 2px 0; }
  .mcol { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; cursor:pointer; padding-top:4px; }
  .mcol.active { background:var(--card2); border-radius:var(--r-md); }
  .mcol .mbars { flex:1; display:flex; align-items:flex-end; gap:3px; width:100%; justify-content:center; }
  .mcol .mb { width:30%; max-width:15px; border-radius:5px 5px 0 0; min-height:2px; }
  .mcol .mb.inc { background:var(--green); } .mcol .mb.exp { background:var(--red); }
  .mcol .mlab { font-size:11px; color:var(--muted); font-weight:600; }
  .mcol.active .mlab { color:var(--txt); }
  .legend { display:flex; gap:16px; justify-content:center; margin-top:8px; font-size:12px; color:var(--muted); }
  .legend .lg { display:flex; align-items:center; gap:5px; }
  .legend .lg i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .mini-seg { display:flex; gap:4px; margin-bottom:8px; background:var(--card2); border-radius:var(--r-md); padding:4px; }
  .mini-seg button { flex:1; padding:8px; border-radius:var(--r-sm); font-size:12.5px; font-weight:700; color:var(--muted); background:transparent; }
  .mini-seg button.active { background:var(--card); color:var(--txt); box-shadow:var(--shadow); }

  .seg { display:flex; background:var(--card2); border-radius:var(--r-md); padding:4px; gap:4px; }
  .seg button { flex:1; padding:11px; border-radius:var(--r-sm); font-weight:700; font-size:14px; color:var(--muted); }
  .seg button.active { background:var(--card); color:var(--txt); box-shadow:var(--shadow); }

  label.field { display:block; margin-bottom:14px; }
  label.field > span { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .input, select.input, textarea.input { width:100%; background:var(--card2); border:1.5px solid transparent; color:var(--txt);
    border-radius:var(--r-md); padding:13px 14px; outline:none; }
  .input:focus { border-color:var(--accent); background:var(--input-focus-bg); }
  textarea.input { resize:vertical; min-height:60px; }
  .two { display:grid; grid-template-columns:1fr 116px; gap:10px; }
  .three { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  nav.tabbar { position:fixed; left:50%; transform:translateX(-50%); width:100%; max-width:640px; bottom:0; z-index:25; background:var(--card);
    border-top:1px solid var(--line); display:flex; padding:7px 4px calc(7px + var(--safe-b)); align-items:center;
    box-shadow:0 -2px 16px rgba(40,50,80,.05); }
  nav.tabbar button.tab { flex:1; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; padding:4px; font-weight:600; }
  nav.tabbar button.tab .ti { font-size:20px; line-height:1; }
  nav.tabbar button.tab.active { color:var(--accent); }
  .addbtn { flex:0 0 auto; width:56px; height:56px; border-radius:50%; margin:0 8px;
    background: linear-gradient(135deg, var(--grad1), var(--accent-d)); color:#fff; font-size:30px; display:grid; place-items:center;
    box-shadow:0 8px 20px var(--accent-glow-strong); }
  .addbtn:active { transform:scale(.94); }

  /* ===== Боковая навигация (только ПК) ===== */
  .sidenav { display:none; }
  .sidenav .sn-brand { display:flex; align-items:center; gap:11px; padding:2px 10px 20px; font-weight:800; font-size:18px; letter-spacing:.2px; }
  .sidenav .sn-logo { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-size:19px; color:#fff;
    background:linear-gradient(135deg,var(--grad1),var(--grad2)); box-shadow:0 6px 16px var(--header-shadow); flex:0 0 auto; }
  .sidenav .snav { display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:11px 14px; border-radius:var(--r-md);
    color:var(--muted); font-weight:600; font-size:14.5px; min-height:46px; }
  .sidenav .snav .si { font-size:19px; width:24px; text-align:center; flex:0 0 auto; }
  .sidenav .snav.active { background:var(--accent-soft); color:var(--accent-d); font-weight:700; }
  .sidenav .sn-sp { flex:1 1 auto; min-height:8px; }
  .sidenav .sn-add { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:12px; width:100%;
    background:linear-gradient(135deg,var(--grad1),var(--accent-d)); color:#fff; font-weight:700; font-size:15px;
    border-radius:var(--r-md); padding:14px; min-height:var(--tap); box-shadow:0 8px 20px var(--accent-glow-strong); }
  .sidenav .sn-add:active { transform:scale(.98); }
  .sidenav .sn-ver { text-align:center; color:var(--muted); font-size:11px; opacity:.7; padding-top:14px; }
  @media (hover:hover){ .sidenav .snav:not(.active):hover { background:var(--card2); color:var(--txt); } .sidenav .sn-add:hover { filter:brightness(1.05); } }

  /* ===== Десктопная раскладка: сайдбар + широкий контент, нижний таб-бар скрыт ===== */
  @media (min-width:980px) {
    nav.tabbar { display:none !important; }
    .sidenav { display:flex; flex-direction:column; gap:3px; position:fixed; top:0; left:0; bottom:0; width:var(--sbw);
      background:var(--card); border-right:1px solid var(--line); padding:22px 14px calc(18px + var(--safe-b)); z-index:30; overflow-y:auto; }
    body { padding-bottom:28px; padding-left:var(--sbw); }
    /* Шапка — аккуратный баннер в колонке контента, а не заливка на всю ширину */
    header { position:static; max-width:var(--content-max); margin:18px auto 0; padding:18px 24px;
      border-radius:var(--r-xl); box-shadow:0 10px 28px var(--header-shadow); }
    header .h-top, header .h-sum, header .h-free { padding-left:0; padding-right:0; }
    main { max-width:var(--content-max); padding:18px 24px 44px; margin:0 auto; }
    .sheet { left:var(--sbw); max-width:560px; border-radius:var(--r-xl); }
    .cf-back { left:var(--sbw); }
    /* Счета — две колонки: слева сводка, справа счета/конверты */
    .acc-cols { display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:start; }
    /* Анализ — карточки в две колонки (masonry) */
    .ana-cols { column-count:2; column-gap:18px; }
    .ana-cols > * { break-inside:avoid; }
  }

  /* ===== Главная (дашборд) ===== */
  .home-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:2px 2px 16px; }
  .home-title { font-size:24px; font-weight:800; letter-spacing:.2px; }
  /* Лёгкий заголовок экрана в контенте (вместо оранжевого баннера на Счетах/Ещё) */
  .scr-title { font-size:24px; font-weight:800; letter-spacing:.2px; margin:2px 2px 16px; }
  .home-subtitle { color:var(--muted); font-size:13px; margin-top:2px; }
  .home-acts { display:flex; gap:9px; flex:0 0 auto; }
  .home-act { width:42px; height:42px; border-radius:50%; background:var(--card2); display:grid; place-items:center; font-size:18px; box-shadow:var(--shadow); }
  .home-act:active { transform:scale(.94); }

  .home-hero { background:linear-gradient(135deg,var(--grad1),var(--grad2)); color:#fff; border-radius:var(--r-xl);
    padding:20px; box-shadow:0 10px 28px var(--header-shadow); margin-bottom:12px; }
  .home-hero .hh-l { display:flex; align-items:center; justify-content:space-between; font-size:14px; opacity:.95; }
  .home-hero .hh-eye { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center; font-size:15px; color:#fff; }
  .home-hero .hh-eye:active { background:rgba(255,255,255,.28); }
  .home-hero .hh-amt { font-size:clamp(30px,9vw,42px); font-weight:800; letter-spacing:-1px; margin-top:4px; overflow-wrap:anywhere; }
  .home-hero .hh-div { height:1px; background:rgba(255,255,255,.22); margin:15px 0; }
  .home-hero .hh-limit { display:flex; align-items:center; gap:12px; }
  .home-hero .hl-ic { width:40px; height:40px; border-radius:var(--r-md); background:rgba(255,255,255,.16); display:grid; place-items:center; font-size:18px; flex:0 0 auto; }
  .home-hero .hl-main { flex:1; min-width:0; }
  .home-hero .hl-cap { font-size:12.5px; opacity:.9; }
  .home-hero .hl-val { font-weight:700; font-size:14.5px; margin:1px 0 7px; }
  .home-hero .hh-bar { height:7px; border-radius:5px; background:rgba(255,255,255,.22); overflow:hidden; }
  .home-hero .hh-bar > i { display:block; height:100%; border-radius:5px; background:#fff; transition:width .3s; }
  .home-hero .hl-pill { flex:0 0 auto; background:rgba(255,255,255,.18); border-radius:var(--r-lg); padding:9px 14px; text-align:center; line-height:1.15; }
  .home-hero .hl-pill b { font-size:14.5px; font-weight:800; white-space:nowrap; }
  .home-hero .hl-pill small { display:block; font-weight:600; font-size:11px; opacity:.9; margin-top:1px; }
  .home-hero.masked .hh-amt, .home-hero.masked .hl-val, .home-hero.masked .hl-pill b { filter:blur(10px); }

  .home-ie { display:flex; align-items:stretch; gap:0; }
  .home-ie .ie-col { flex:1; display:flex; align-items:center; gap:11px; padding:6px 2px; min-width:0; }
  .home-ie .ie-col + .ie-col { border-left:1px solid var(--line); padding-left:16px; margin-left:2px; }
  .ie-ic { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:19px; font-weight:800; flex:0 0 auto; }
  .ie-ic.up { background:var(--accent-soft); color:var(--green); }
  .ie-ic.down { background:var(--red-soft); color:var(--red); }
  .ie-cap { font-size:12px; color:var(--muted); }
  .ie-val { font-weight:800; font-size:16px; overflow-wrap:anywhere; }
  .ie-delta { font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; display:inline-block; margin-top:3px; }

  .home-sec { display:flex; align-items:center; justify-content:space-between; margin:22px 4px 11px; }
  .home-sec h3 { font-size:17px; font-weight:800; }
  .home-sec a { font-size:13.5px; font-weight:700; color:var(--accent); cursor:pointer; white-space:nowrap; }

  .he-row { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:var(--r-lg); padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer; }
  .he-ic { width:44px; height:44px; border-radius:var(--r-md); display:grid; place-items:center; font-size:19px; color:#fff; flex:0 0 auto; }
  .he-main { flex:1 1 auto; min-width:0; }
  .he-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .he-sub { color:var(--muted); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .he-bar { flex:0 0 100px; height:7px; }
  @media (max-width:440px){ .he-row .he-bar { flex-basis:64px; } }
  .he-pct { font-weight:800; font-size:14px; flex:0 0 auto; min-width:42px; text-align:right; }
  .he-chev { color:var(--muted); font-size:18px; flex:0 0 auto; }

  .home-duo { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .duo-card { background:var(--card); border-radius:var(--r-lg); padding:15px; box-shadow:var(--shadow); }
  .duo-head { display:flex; align-items:center; gap:9px; font-weight:800; font-size:14.5px; margin-bottom:8px; }
  .duo-head .dh-ic { width:34px; height:34px; border-radius:var(--r-sm); background:var(--accent-soft); display:grid; place-items:center; font-size:16px; flex:0 0 auto; }
  .duo-head a { margin-left:auto; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; }
  .duo-item { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .duo-item + .duo-item { border-top:1px solid var(--line); }
  .duo-dic { width:34px; height:34px; border-radius:var(--r-sm); background:var(--card2); display:grid; place-items:center; font-size:15px; flex:0 0 auto; }
  .duo-t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .duo-goal { padding:8px 0; }
  .duo-goal + .duo-goal { border-top:1px solid var(--line); }
  @media (max-width:560px){ .home-duo { grid-template-columns:1fr; } }

  .backdrop { position:fixed; inset:0; background:rgba(30,35,50,.38); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
  .backdrop.show { opacity:1; pointer-events:auto; }
  .cf-back { position:fixed; inset:0; z-index:60; background:rgba(30,35,50,.45); display:flex; align-items:center; justify-content:center; padding:24px; animation:fade .15s ease; }
  .cf-box { background:var(--card); border-radius:var(--r-lg); padding:20px; max-width:360px; width:100%; box-shadow:var(--shadow-lift); animation:cfpop .16s ease; }
  @keyframes cfpop { from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none} }
  .cf-msg { font-size:14.5px; line-height:1.5; color:var(--txt); margin-bottom:16px; }
  .cf-btns { display:flex; gap:10px; }
  .cf-btns .btn { flex:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0;
    padding:8px 16px calc(20px + var(--safe-b)); max-height:94vh; overflow-y:auto; transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.9,.25,1); max-width:640px; margin:0 auto; box-shadow:var(--shadow-lift); }
  .sheet.show { transform:translateY(0); }
  .sheet .grabber { width:40px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 14px; }
  .sheet h2 { font-size:18px; margin-bottom:14px; }

  .amount-disp { text-align:center; font-size:clamp(28px,9vw,40px); font-weight:800; letter-spacing:-1px; padding:2px 0; overflow-wrap:anywhere; }
  .amount-disp .c { font-size:19px; color:var(--muted); margin-left:5px; }
  .chips-row { display:flex; gap:8px; overflow-x:auto; padding:8px 2px 4px; }
  .chips-row::-webkit-scrollbar { display:none; }
  .echip { flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:9px 14px; min-height:var(--tap); border-radius:999px; background:var(--card);
    border:1.5px solid var(--line); font-size:13.5px; font-weight:600; white-space:nowrap; box-shadow:var(--shadow); }
  .echip .d { width:9px; height:9px; border-radius:50%; }
  .echip.active { border-color:var(--accent); background:var(--accent-soft); }
  .cat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 4px; margin:8px 0 4px; }
  .cat-item { display:flex; flex-direction:column; align-items:center; gap:5px; padding:2px 0; }
  .cat-item .cc { width:52px; height:52px; border-radius:var(--r-lg); display:grid; place-items:center; font-size:24px; color:#fff; border:3px solid transparent; transition:.12s; }
  .cat-item.active .cc { border-color:var(--txt); transform:scale(1.06); }
  .cat-item .cl { font-size:11px; color:var(--muted); text-align:center; line-height:1.15; max-width:66px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat-item.active .cl { color:var(--txt); font-weight:600; }
  .cat-toggle { display:block; width:100%; text-align:center; margin:2px 0 4px; padding:9px; border-radius:var(--r-sm);
    background:var(--card2); color:var(--accent-d); font-size:13px; font-weight:700; }
  .cat-toggle:active { background:var(--accent-soft); }
  .icon-btn.fav { color:#e0a80b; }
  .fund-list { display:flex; flex-direction:column; gap:7px; }
  .fund-row { display:flex; align-items:center; gap:11px; padding:11px 14px; background:var(--card); border:1.5px solid var(--line);
    border-radius:var(--r-md); box-shadow:var(--shadow); cursor:pointer; font-weight:600; }
  .fund-row.on { border-color:var(--accent); background:var(--accent-soft); }
  .fund-row .chk { width:24px; height:24px; border-radius:var(--r-xs); border:2px solid var(--line); display:grid; place-items:center;
    color:var(--on-accent); font-size:14px; flex:0 0 auto; }
  .fund-row.on .chk { background:var(--accent); border-color:var(--accent); }
  .amt-clear-wrap { text-align:center; min-height:22px; margin-bottom:2px; }
  .amt-clear { color:var(--muted); font-size:12.5px; font-weight:600; padding:3px 11px; border-radius:var(--r-xs); background:var(--card2); }
  .amt-clear:active { background:var(--accent-soft); color:var(--accent-d); }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:4px; max-width:320px; margin-left:auto; margin-right:auto; }
  .keypad button { background:var(--card); border-radius:var(--r-md); padding:14px 0; font-size:22px; font-weight:600; box-shadow:var(--shadow); }
  .keypad button:active { background:var(--card2); transform:scale(.97); }
  .keypad button.kp-sec { background:var(--card2); color:var(--muted); box-shadow:none; }
  .keypad button.kp-sec:active { background:var(--accent-soft); color:var(--accent-d); }
  .entry-bar { display:flex; gap:8px; margin-top:12px; }
  .sheet .entry-bar .input { padding:10px 12px; font-size:14px; border-radius:var(--r-sm); }
  .sheet .entry-note { padding:10px 12px; font-size:14px; border-radius:var(--r-sm); margin-top:8px; }
  .sheet .entry-save { padding:12px 16px; font-size:14.5px; margin-top:10px; }

  .list-item { display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child { border-bottom:none; }
  .ins-row { display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:13.5px; line-height:1.42; border-top:1px solid var(--line); }

    background:var(--toast-bg); color:var(--toast-txt); padding:12px 18px; border-radius:var(--r-md); z-index:60; font-size:14px; font-weight:600; opacity:0; transition:.25s;

<script>
"use strict";
/* =================================================================
   Конверты — учёт денег. Счета + конверты. Локальное хранение.
   ================================================================= */
const LS_KEY = 'konverty_state_v3';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

/* ---------- Категории (в стиле ZenMoney) ---------- */
const CATEGORY_SEED = [
  ['Продукты','🛒','#17a877','expense'],['Кафе и рестораны','🍽️','#f59e0b','expense'],
  ['Транспорт','🚌','#3b82f6','expense'],['Автомобиль','🚗','#64748b','expense'],
  ['Жильё и ЖКХ','🏠','#8b5cf6','expense'],['Связь и интернет','📱','#06b6d4','expense'],
  ['Одежда и обувь','👕','#ec4899','expense'],['Здоровье','💊','#ef4444','expense'],
  ['Красота','💇','#f472b6','expense'],['Развлечения','🎬','#f43f5e','expense'],
  ['Путешествия','✈️','#0ea5e9','expense'],['Техника','💻','#6366f1','expense'],
  ['Образование','📚','#eab308','expense'],['Дети','🧸','#f97316','expense'],
  ['Спорт','🏋️','#84cc16','expense'],['Питомцы','🐾','#a16207','expense'],
  ['Подарки','🎁','#d946ef','expense'],['Подписки','🔄','#14b8a6','expense'],
  ['Прочее','💸','#94a3b8','expense'],
  ['Зарплата','💰','#17a877','income'],['Аванс','💵','#10b981','income'],
  ['Премия','🏆','#f59e0b','income'],['Подработка','🧑‍💻','#3b82f6','income'],
  ['Проценты и вклады','📈','#22c55e','income'],['Подарок','🎁','#ec4899','income'],
  ['Кэшбэк и возвраты','↩️','#06b6d4','income'],['Прочее','➕','#94a3b8','income']
];
// P6: сразу отмечаем самые частые категории как «основные» (⭐), чтобы первый ввод не был стеной иконок.
const FAV_SEED = new Set(['Продукты','Кафе и рестораны','Транспорт','Жильё и ЖКХ','Развлечения','Зарплата']);
const buildCategories = () => CATEGORY_SEED.map(([name,icon,color,kind]) => ({id:uid(),name,icon,color,kind,fav:FAV_SEED.has(name)}));

function defaultState() {
  const e = (name,percent,color) => ({id:uid(),name,percent,color,archived:false});
  const a = (name,icon,color,currency,investment,offTopPercent) => ({id:uid(),name,icon,color,currency,investment,offTopPercent,archived:false});
  return {
    version: 3,
    categoriesVersion: 3,
    baseCurrency: 'KZT',
    currencies: [ {code:'KZT',symbol:'₸',rate:1}, {code:'USD',symbol:'$',rate:480}, {code:'EUR',symbol:'€',rate:520} ],
    accounts: [
      a('Карта','💳','#5b8def','KZT',false,0),
      a('Наличные','💵','#29b083','KZT',false,0),
      a('Инвест/крипта','📈','#e0a80b','USD',true,10)
    ],
    envelopes: [
      e('Обязательные',50,'#5b8def'),
      e('Продукты',25,'#29b083'),
      e('Развлечения',10,'#ef5f68'),
      e('Цели / накопления',15,'#7b5cff')
    ],
    categories: buildCategories(),
    transactions: [],
    debts: [],
    recurring: [],
    goals: [],
    watchlists: [],
    debtBudget: 0,
    debtStrategy: 'snowball',
    overAllocBaseline: 0,
    ratesUpdated: null
  };
}

/* ---------- Загрузка / сохранение ---------- */
let state;
let dataStamp=0, _balCache=null, _balCacheAt=-1;   // штамп изменений данных + мемоизация балансов
const APP_VERSION='0.4.3';   // пререлиз (major 0). Патч — мелкая правка, минор — крупное изменение.
const BUILD='2026-11-01';    // дата сборки — меняется каждый релиз, чтобы было видно, подгрузилось ли обновление
function load() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { state = JSON.parse(raw); normalize(); return; } } catch(e){ console.warn(e); }
  state = defaultState(); save();
}
function normalize() {
  const d = defaultState();
  state = Object.assign({}, d, state);
  state.currencies ||= d.currencies;
  state.accounts ||= d.accounts;
  state.envelopes ||= d.envelopes;
  state.categories ||= d.categories;
  state.transactions ||= [];
  state.debts ||= [];
  state.recurring ||= [];
  state.goals ||= [];
  state.watchlists ||= [];
  state.debtStrategy ||= 'snowball';
  state.debtBudget = state.debtBudget || 0;
  state.overAllocBaseline = state.overAllocBaseline || 0;
  state.rev = +state.rev || 0;   // ревизия данных (wall-clock) для синхронизации — побеждает более позднее изменение
  state.rateHistory = (state.rateHistory && typeof state.rateHistory==='object') ? state.rateHistory : {};
  { const rk=Object.keys(state.rateHistory).sort(); if(rk.length>800) for(const k of rk.slice(0,rk.length-800)) delete state.rateHistory[k]; }
  // H3: санитайзинг иконок/цветов (импорт/бэкап могут содержать HTML → stored XSS). Всё, что рендерится сырым, чистим здесь.
  const cleanColor=(c,def)=>/^#[0-9a-fA-F]{3,8}$/.test(String(c||''))?c:def;
  const cleanIcon=(s,def)=>{ s=String(s==null?'':s); return (/[<>&"']/.test(s)||s.length>6)?def:(s||def); };
  state.accounts.forEach(a => { a.archived=!!a.archived; a.investment=!!a.investment; a.excluded=!!a.excluded; a.offTopPercent=Math.max(0,Math.min(100,a.offTopPercent||0)); a.deposit=!!a.deposit; a.rate=Math.max(0,Math.min(1000,+a.rate||0)); a.currency = a.currency || state.baseCurrency; a.color=cleanColor(a.color,'#5b8def'); a.icon=cleanIcon(a.icon,'💳'); a.group=String(a.group||'').slice(0,40); });
  state.envelopes.forEach(e => { e.archived=!!e.archived; e.noOwe=!!e.noOwe; delete e.offTop; e.color=cleanColor(e.color,'#5b8def'); e.monthlyTarget=Math.max(0, round2(e.monthlyTarget||0)); e.monthlyLimit=Math.max(0, round2(e.monthlyLimit||0)); e.icon=e.icon||'✉️'; });
  state.categories.forEach(c => { if (c.kind==='expense') c.limit = c.limit||0; c.fav = !!c.fav; c.color=cleanColor(c.color,'#94a3b8'); c.icon=cleanIcon(c.icon,'🏷️'); });
  // P8: разовая миграция старых «лимитов категорий» в единый инструмент «Лимиты и наблюдение».
  state.categories.forEach(c => { if(c.kind==='expense' && c.limit>0){ if(!state.watchlists.some(w=>w.type==='category'&&w.value===c.id)) state.watchlists.push({id:uid(),type:'category',value:c.id,target:round2(c.limit)}); c.limit=0; } });
  state.recurring.forEach(r => { r.active = r.active!==false; r.day = Math.max(1, Math.min(31, r.day||1)); });
  state.goals.forEach(g => { g.saved = round2(g.saved||0); g.target = round2(g.target||0); g.currency = g.currency || state.baseCurrency; g.log ||= []; g.color=cleanColor(g.color,'#7b5cff'); g.icon=cleanIcon(g.icon,'🎯'); if(g.envelopeId && !state.envelopes.some(e=>e.id===g.envelopeId)) delete g.envelopeId; });
  state.debts.forEach(d => { d.rate = d.rate||0; d.payments ||= []; d.accountId = (d.accountId && acc(d.accountId)) ? d.accountId : null; d.payments.forEach(p=>{ p.accountId = (p.accountId && acc(p.accountId)) ? p.accountId : null; }); });
  // M6: выбросить повреждённые транзакции (без типа/даты), иначе рендер падает в пустой экран.
  state.transactions = state.transactions.filter(t => t && typeof t==='object' && t.type && /^\d{4}-\d{2}-\d{2}$/.test(String(t.date||'')));
  // Санитайз split-расходов: валидные ссылки, положительные суммы; split имеет смысл от 2 частей.
  state.transactions.forEach(t=>{ if(t.type==='expense' && Array.isArray(t.splits)){
    t.splits = t.splits.map(s=>({ categoryId:(s.categoryId&&catById(s.categoryId))?s.categoryId:null, envelopeId:(s.envelopeId&&env(s.envelopeId))?s.envelopeId:null, amount:Math.max(0,round2(s.amount||0)) })).filter(s=>s.amount>0);
    if(t.splits.length<2) delete t.splits;
  }});
  migrateCategories();
}
function migrateCategories() {
  if (state.categoriesVersion === 3) return;
  const have = new Set(state.categories.map(c => c.kind+'|'+c.name));
  for (const [name,icon,color,kind] of CATEGORY_SEED) if (!have.has(kind+'|'+name)) state.categories.push({id:uid(),name,icon,color,kind});
  state.categoriesVersion = 3;
}
let saveTimer, savePending=false;
function save() { dataStamp++; state.rev=Date.now(); savePending=true; clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); savePending=false; }catch(e){ toast('Ошибка сохранения'); } maybeAutoBackup(); syncPushDebounced(); }, 50); }
// M7: немедленно дописать отложенное сохранение при закрытии/сворачивании вкладки (иначе дебаунс 50мс теряется).
function flushSave(){ if(!savePending) return; clearTimeout(saveTimer); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); savePending=false; }catch(e){} }
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

/* =================================================================
   Резервные копии (IndexedDB, с фолбэком в localStorage).
   Хранятся локально; создаются раз в день и перед импортом/сбросом/восстановлением.
   ================================================================= */
const IDB_NAME='konverty_db', IDB_STORE='backups', BK_KEEP_AUTO=12, LS_BK='konverty_backups';
let _idbPromise=null, _lastAutoBk=0;
function idbOpen(){ if(_idbPromise) return _idbPromise;
  _idbPromise=new Promise((res,rej)=>{ try{
    if(!self.indexedDB){ rej(new Error('no-idb')); return; }
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }catch(e){ rej(e); } });
  return _idbPromise; }
function _req(rq){ return new Promise((res,rej)=>{ rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function _bkStore(mode){ const db=await idbOpen(); const tx=db.transaction(IDB_STORE,mode);
  return { store:tx.objectStore(IDB_STORE), done:new Promise((res,rej)=>{ tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }) }; }
function _lsBackupsGet(){ try{ return JSON.parse(localStorage.getItem(LS_BK)||'[]'); }catch(e){ return []; } }
function _lsBackupsPut(list){ try{ localStorage.setItem(LS_BK, JSON.stringify(list.slice(-3))); }catch(e){} }

async function createBackup(reason){
  const snap={ id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7), ts:new Date().toISOString(), reason:reason||'auto', app:APP_VERSION, data:JSON.stringify(state) };
  try{
    // 1) сохранить снапшот (отдельная транзакция)
    { const {store,done}=await _bkStore('readwrite'); store.put(snap); await done; }
    // 2) вычислить лишние авто-копии (чтение — своя транзакция)
    const all=await getBackups();
    const autos=all.filter(b=>b.reason==='auto').sort((a,b)=>a.ts.localeCompare(b.ts)); // старые первыми
    const toDel = autos.length>BK_KEEP_AUTO ? autos.slice(0, autos.length-BK_KEEP_AUTO).map(b=>b.id) : [];

/* ---------- Деньги / валюты ---------- */
const cur = code => state.currencies.find(c=>c.code===code) || {code,symbol:code,rate:1};
const round2 = n => Math.round((n+Number.EPSILON)*100)/100;
function fmt(amount, code) { const c=cur(code); const n=round2(amount);
  return `${n.toLocaleString('ru-RU',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2})} ${c.symbol}`; }
const toBase = (amount,code) => amount * cur(code).rate;
// Исторические курсы: курс валюты (база за 1 единицу) на дату — по ближайшему снимку ≤ даты, иначе текущий.
function rateAt(code, date){ if(code===state.baseCurrency) return 1; const h=state.rateHistory||{}; let best=null;
  for(const d in h){ if(d<=date && (best===null||d>best)) best=d; }
  if(best!==null && h[best] && h[best][code]>0) return h[best][code];
  const c=cur(code); return (c&&c.rate)||1; }
const toBaseAt = (amount, code, date) => amount * rateAt(code, date);
const fmtBase = amount => fmt(amount, state.baseCurrency);
// Перевод суммы из одной валюты в другую по заданным курсам
const convert = (amount, from, to) => from===to ? round2(amount) : round2(amount * cur(from).rate / cur(to).rate);
const accCur = id => acc(id)?.currency || state.baseCurrency;

const acc = id => state.accounts.find(a=>a.id===id);
const env = id => state.envelopes.find(e=>e.id===id);
const catById = id => state.categories.find(c=>c.id===id);
// Части расхода по категориям/конвертам: split-операция даёт свои части, обычная — одну.
const txParts = t => (t.type==='expense' && Array.isArray(t.splits) && t.splits.length) ? t.splits : [{categoryId:t.categoryId, envelopeId:t.envelopeId, amount:t.amount}];
const activeAccounts = () => state.accounts.filter(a=>!a.archived);
const spendableAccounts = () => activeAccounts().filter(a=>!a.investment && !a.excluded);
const investmentAccounts = () => activeAccounts().filter(a=>a.investment);
const activeEnvelopes = () => state.envelopes.filter(e=>!e.archived);

/* ---------- Балансы ---------- */
function _computeBalances() {
  const envBal={}, accBal={}, owedBal={};
  state.envelopes.forEach(e=>{ envBal[e.id]={}; owedBal[e.id]={}; }); state.accounts.forEach(a=>accBal[a.id]={});
  const addEnv=(id,c,delta)=>{ (envBal[id] ||= {}); envBal[id][c]=round2((envBal[id][c]||0)+delta); };
  const addAcc=(id,c,delta)=>{ (accBal[id] ||= {}); accBal[id][c]=round2((accBal[id][c]||0)+delta); };
  const addOwed=(id,c,delta)=>{ (owedBal[id] ||= {}); owedBal[id][c]=round2((owedBal[id][c]||0)+delta); };
  for (const t of state.transactions) {
    if (t.type==='income') {
      // accountCredits: {id:{amt,cur}} (новый формат) или {id:число} (старый)
      if (t.accountCredits) for (const [id,cr] of Object.entries(t.accountCredits)) {
        if (typeof cr==='number') addAcc(id,t.currency,cr); else addAcc(id,cr.cur,cr.amt);
      }
      if (t.distribution) for (const [id,amt] of Object.entries(t.distribution)) addEnv(id,t.currency,amt);
      // Долг конвертам = запланировано (plan) минус фактически оплачено (distribution)
      if (t.plan) for (const [id,p] of Object.entries(t.plan)) {
        const d=(t.distribution&&t.distribution[id])||0, short=round2(p-d);
        if (Math.abs(short)>0.005) addOwed(id,t.currency,short);
      }
    } else if (t.type==='expense') {
      if (t.accountId) addAcc(t.accountId,t.currency,-t.amount);
      if (Array.isArray(t.splits) && t.splits.length) { for(const s of t.splits){ if(s.envelopeId) addEnv(s.envelopeId,t.currency,-s.amount); } }
      else if (t.envelopeId) addEnv(t.envelopeId,t.currency,-t.amount);
    } else if (t.type==='transfer') {
      if (t.fromAmount!=null) { addAcc(t.fromAccountId,t.fromCurrency,-t.fromAmount); addAcc(t.toAccountId,t.toCurrency,t.toAmount); }
      else { addAcc(t.fromAccountId,t.currency,-t.amount); addAcc(t.toAccountId,t.currency,t.amount); }
    } else if (t.type==='envtransfer') {
      addEnv(t.fromEnvelopeId,t.currency,-t.amount); addEnv(t.toEnvelopeId,t.currency,t.amount);
    } else if (t.type==='envfund') {
      // Пополнение конверта из свободных денег: бюджет конверта растёт, долг падает (счета не трогаем)
      addEnv(t.envelopeId,t.currency,t.amount); addOwed(t.envelopeId,t.currency,-t.amount);
    } else if (t.type==='adjust') {
      // Корректировка баланса счёта (разница до нужной суммы), конверты не трогаем
      addAcc(t.accountId,t.currency,t.amount);
    } else if (t.type==='envadjust') {
      // Корректировка суммы в конверте (счета не трогаем). Пополнение (+) гасит долг конверта, как envfund.
      addEnv(t.envelopeId,t.currency,t.amount);
      if (t.amount>0.005) addOwed(t.envelopeId,t.currency,-t.amount);
    }
  }
  // Долги, привязанные к счёту: тело долга и возвраты реально двигают деньги на счёте.
  // Это НЕ доход/расход (в аналитику не попадает) и конверты не трогает — только баланс счёта.
  for (const d of state.debts) {
    if (!d.accountId || !acc(d.accountId)) continue;
    const sign = d.direction==='iowe' ? 1 : -1;   // мне дали в долг → +на счёт; я дал в долг → −со счёта
    addAcc(d.accountId, accCur(d.accountId), sign * convert(d.amount, d.currency, accCur(d.accountId)));
    for (const p of (d.payments||[])) {
      const pa = (p.accountId && acc(p.accountId)) ? p.accountId : d.accountId;
      addAcc(pa, accCur(pa), -sign * convert(p.amount, d.currency, accCur(pa)));   // возврат — в обратную сторону
    }
  }
  return { envBal, accBal, owedBal };
}
// Мемоизация: пересчитываем балансы только когда данные менялись (save/import/reset двигают dataStamp).
function computeBalances(){ if(_balCache && _balCacheAt===dataStamp) return _balCache; _balCache=_computeBalances(); _balCacheAt=dataStamp; return _balCache; }
const sumBase = m => Object.entries(m||{}).reduce((s,[c,a])=>s+toBase(a,c),0);
const accountBase = (accBal,id) => sumBase(accBal[id]);
const envelopeBase = (envBal,id) => sumBase(envBal[id]);
const owedBase = (owedBal,id) => sumBase(owedBal[id]);
const totalNet = accBal => state.accounts.filter(a=>!a.excluded).reduce((s,a)=>s+accountBase(accBal,a.id),0);
const spendableTotal = accBal => spendableAccounts().reduce((s,a)=>s+accountBase(accBal,a.id),0);
const envelopesTotal = envBal => state.envelopes.reduce((s,e)=>s+envelopeBase(envBal,e.id),0);
const totalOwed = owedBal => state.envelopes.reduce((s,e)=>s+(e.noOwe?0:Math.max(0,owedBase(owedBal,e.id))),0);
// Пункт 5: деньги, отложенные в цели-накопления (в базовой валюте) — реально резервируются из свободных.
// M2: привязанные к конверту цели НЕ вычитаем повторно — их деньги уже в конверте (committedEnvelopes).
const goalsReservedBase = () => (state.goals||[]).filter(g=>!g.archived && !(g.envelopeId&&env(g.envelopeId))).reduce((s,g)=>s+toBase(g.saved||0, g.currency||state.baseCurrency),0);
// H1/M3: закреплено в конвертах = сумма ТОЛЬКО положительных бюджетов (перерасход не считается «занятым», иначе минус конверта раздувал бы «Свободно»).
const committedEnvelopes = envBal => state.envelopes.reduce((s,e)=>s+Math.max(0, envelopeBase(envBal,e.id)),0);
// Единый источник «Свободно»: тратимые деньги − закреплённое в конвертах − резерв целей.
const freeMoney = (accBal, envBal) => round2(spendableTotal(accBal) - committedEnvelopes(envBal) - goalsReservedBase());
// «Не разложено по конвертам» (для уведомления на «Счета» и определения перекоса): без вычета целей.
const unallocated = (accBal, envBal) => round2(spendableTotal(accBal) - committedEnvelopes(envBal));
// Target: сколько РЕАЛЬНО пополнено в конверт за месяц ym (в базовой валюте) — учитываются все каналы пополнения,
// кроме трат: распределение дохода (funded-часть), envfund, envtransfer (вход − выход), envadjust. Расходы прогресс не уменьшают.
// Потрачено из конверта за месяц (в базовой валюте) — расходы, привязанные к конверту, включая части split.
function envSpentInMonth(envId, ym){ let s=0;
  for(const t of state.transactions){ if(t.type!=='expense'||(t.date||'').slice(0,7)!==ym) continue;
    for(const p of txParts(t)){ if(p.envelopeId===envId) s+=toBase(p.amount, t.currency); } }
  return round2(s); }
function envFundedInMonth(envId, ym){ let s=0;
  for(const t of state.transactions){ if((t.date||'').slice(0,7)!==ym) continue;
    if(t.type==='income'){ if(t.distribution && t.distribution[envId]) s+=toBase(t.distribution[envId], t.currency); }
    else if(t.type==='envfund'){ if(t.envelopeId===envId) s+=toBase(t.amount, t.currency); }
    else if(t.type==='envadjust'){ if(t.envelopeId===envId) s+=toBase(t.amount, t.currency); }
    else if(t.type==='envtransfer'){ if(t.toEnvelopeId===envId) s+=toBase(t.amount,t.currency); if(t.fromEnvelopeId===envId) s-=toBase(t.amount,t.currency); }
  }
  return round2(s); }
// Этап 3: средний дневной расход за последние N дней (в базовой валюте).
function avgDailySpendBase(days){ days=days||90; const c=new Date(); c.setDate(c.getDate()-days);
  const cutISO=`${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
  const sum=state.transactions.filter(t=>t.type==='expense'&&t.date>=cutISO).reduce((s,t)=>s+toBase(t.amount,t.currency),0);
  return sum>0? round2(sum/days) : 0; }

/* ---------- Распределение дохода ---------- */
function distribute(amount) {
  const act = activeEnvelopes(); const dist={};
  const totalW = act.reduce((s,e)=>s+(e.percent||0),0);
  if (totalW>0 && act.length) {
    let a=0;
    act.forEach((e,i)=>{ let v = i===act.length-1 ? round2(amount-a) : round2(amount*(e.percent||0)/totalW); if(i<act.length-1) a=round2(a+v); dist[e.id]=v; });
  } else if (act.length) dist[act[0].id]=round2(amount);
  return dist;
}
// Доход: off-top на инвест-счета, остаток на выбранный счёт + распределение по конвертам
function computeIncome(amount, mainAccountId) {
  const main = acc(mainAccountId);
  const mainCur = main?.currency || state.baseCurrency;
  if (main && main.investment) {
    // Прямое пополнение инвест-счёта (например проценты Binance) — без off-top и без конвертов
    return { accountCredits:{[mainAccountId]:{amt:round2(amount),cur:mainCur}}, distribution:{}, distCurrency:mainCur, remainder:0, offTop:{}, mainCur };
  }
  // Доход в валюте основного счёта. Off-top на инвест-счета — с конвертацией в их валюту.
  const offTop={}; let offSumMain=0;
  investmentAccounts().forEach(a=>{ if(a.offTopPercent>0 && !a.excluded){
    const amtMain = round2(amount*a.offTopPercent/100);          // в валюте дохода
    offTop[a.id] = { amtMain, amt: convert(amtMain, mainCur, a.currency), cur: a.currency };
    offSumMain += amtMain;
  }});
  // Защита: суммарный off-top не может превышать доход (несколько инвест-счетов >100%) — масштабируем вниз.
  if (offSumMain>amount && offSumMain>0){ const k=amount/offSumMain;
    for (const o of Object.values(offTop)){ o.amtMain=round2(o.amtMain*k); o.amt=convert(o.amtMain, mainCur, o.cur); }
    offSumMain=amount;
  }
  const remainder = round2(Math.max(0, amount - offSumMain));    // в валюте дохода
  const accountCredits = {};
  for (const [id,o] of Object.entries(offTop)) accountCredits[id] = { amt:o.amt, cur:o.cur };
  accountCredits[mainAccountId] = { amt:remainder, cur:mainCur };
  return { accountCredits, distribution: distribute(remainder), distCurrency:mainCur, remainder, offTop, mainCur };
}

function opRow(t) {

    title=t.note||(c?c.name:'Доход');

    const planCount=t.plan?Object.keys(t.plan).length:0;
    const isDeposit=!planCount && creditIds.length===1;
    if (isDeposit) sub = `Пополнение · ${acc(creditIds[0])?.name||'счёт'}`;
    else { const mainId=creditIds.find(id=>!acc(id)?.investment);
      const fundedCount=t.distribution?Object.keys(t.distribution).filter(id=>t.distribution[id]>0.005).length:0;
      sub = planCount ? `Доход → ${acc(mainId)?.name||'счёт'} · конверты ${fundedCount}/${planCount}` : `Доход → ${acc(mainId)?.name||'счёт'} + конверты`; }
    amt='+'+fmt(t.amount,t.currency); amtCls='green';
  } else if (t.type==='transfer') {

    sub=`${env(t.fromEnvelopeId)?.name||'?'} → ${env(t.toEnvelopeId)?.name||'?'}`; amt=fmt(t.amount,t.currency); amtCls='muted';

    sub=acc(t.accountId)?.name||'?'; amt=(t.amount>=0?'+':'−')+fmt(Math.abs(t.amount),t.currency); amtCls=t.amount>=0?'green':'';
  } else if (t.type==='envadjust') {

    sub=`«${env(t.envelopeId)?.name||'?'}»`; amt=(t.amount>=0?'+':'−')+fmt(Math.abs(t.amount),t.currency); amtCls='muted';
  } else if (Array.isArray(t.splits) && t.splits.length) {
    ic='✂️'; color='#94a3b8'; title=t.note||'Покупка (разделена)';
    sub=`${t.splits.length} ${plural(t.splits.length,'часть','части','частей')} · ${acc(t.accountId)?.name||'—'}`;
    amt='−'+fmt(t.amount,t.currency); amtCls='';
  } else {
    const c=catById(t.categoryId); ic=c?c.icon:'💸'; color=c?c.color:'#94a3b8';
    title=t.note||(c?c.name:'Расход');
    sub=[acc(t.accountId)?.name, env(t.envelopeId)?.name].filter(Boolean).join(' · ')||'—';

// Множественное число (рус.): plural(5,'день','дня','дней') → 'дней'
function plural(n,one,few,many){ const a=Math.abs(n)%100, b=a%10; if(a>10&&a<20)return many; if(b>1&&b<5)return few; if(b===1)return one; return many; }
// Стрик ведения учёта: сколько дней подряд (заканчивая сегодня/вчера) есть хотя бы одна операция.
function computeStreak(){
  const days=new Set(); for(const t of state.transactions){ if(!t.hidden && t.date) days.add(t.date); }
  if(!days.size) return {cur:0,best:0};
  const OD=86400000; const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  const t0=todayISO().split('-').map(Number); let d=new Date(t0[0],t0[1]-1,t0[2]);
  if(!days.has(iso(d))) d=new Date(d.getTime()-OD);   // сегодня ещё не отмечено — не рвём стрик
  let cur=0; while(days.has(iso(d))){ cur++; d=new Date(d.getTime()-OD); }
  const sorted=[...days].sort(); let best=0,run=0,prev=null;
  for(const ds of sorted){ if(prev){ const diff=Math.round((new Date(ds)-new Date(prev))/OD); run = diff===1?run+1:1; } else run=1; best=Math.max(best,run); prev=ds; }
  return {cur,best};
}
function opFilterMatch(t){

  return parts.filter(Boolean).some(s=>String(s).toLowerCase().includes(q));
}

// Чистый капитал (сумма всех счетов, кроме исключённых) на конец указанного дня, в базовой валюте.
// Пересчёт по курсу НА ту дату (rateAt), если есть снимок; иначе по текущему.
function netWorthAt(cutoff){
  const bal={};
  const add=(id,c,d)=>{ if(!id||!c) return; (bal[id] ||= {}); bal[id][c]=round2((bal[id][c]||0)+d); };
  for (const t of state.transactions) {
    if (t.date>cutoff) continue;
    if (t.type==='income') { if(t.accountCredits) for(const [id,cr] of Object.entries(t.accountCredits)){ if(typeof cr==='number') add(id,t.currency,cr); else add(id,cr.cur,cr.amt); } }
    else if (t.type==='expense') { add(t.accountId,t.currency,-t.amount); }
    else if (t.type==='transfer') { if(t.fromAmount!=null){ add(t.fromAccountId,t.fromCurrency,-t.fromAmount); add(t.toAccountId,t.toCurrency,t.toAmount); } else { add(t.fromAccountId,t.currency,-t.amount); add(t.toAccountId,t.currency,t.amount); } }
    else if (t.type==='adjust') { add(t.accountId,t.currency,t.amount); }
  }
  let sum=0;
  for (const a of state.accounts){ if(a.excluded) continue; const m=bal[a.id]||{}; for(const [c,v] of Object.entries(m)) sum+=toBaseAt(v,c,cutoff); }
  return round2(sum);
}
function netWorthChartSVG(pts){
  const W=300,H=104,pad=8;
  const vals=pts.map(p=>p.val); const min=Math.min(...vals), max=Math.max(...vals); const span=(max-min)||1;
  const x=i=> pad + i*((W-2*pad)/Math.max(1,pts.length-1));
  const y=v=> (H-pad) - ((v-min)/span)*(H-2*pad);

  }

  const {envBal}=computeBalances();

  const tot=fmtBase(total); const fs=Math.max(8, Math.min(15, Math.round(150/Math.max(6,tot.length))));   // подгоняем шрифт, чтобы сумма влезала в кольцо
  return `<svg width="180" height="180" viewBox="0 0 160 160"><g transform="rotate(-90 ${cx} ${cy})">

    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${analysisKind==='expense'?'Расход':'Доход'}</text>
    <text x="${cx}" y="${cy+6+fs/2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="var(--txt)">${tot}</text></svg>`;
}

/* ---------- Счета + конверты ---------- */
function renderAccounts() {
  const el=document.getElementById('screen-accounts');
  const {envBal,accBal,owedBal}=computeBalances();
  const net=totalNet(accBal);
  const byCur={}; state.accounts.filter(a=>!a.excluded).forEach(a=>Object.entries(accBal[a.id]||{}).forEach(([c,v])=>byCur[c]=round2((byCur[c]||0)+v)));
  const curB=Object.entries(byCur).filter(([,v])=>Math.abs(v)>0.005).map(([c,v])=>`<span class="b">${fmt(v,c)}</span>`).join('')||'<span class="b">—</span>';

  const accRow = a => {
    const parts=Object.entries(accBal[a.id]||{}).filter(([,v])=>Math.abs(v)>0.005);
    const base=accountBase(accBal,a.id);
    const main=parts.length?parts.map(([c,v])=>fmt(v,c)).join(' · '):fmt(0,state.baseCurrency);
    const sub=(parts.length>1||(parts[0]&&parts[0][0]!==state.baseCurrency))?`<small>≈ ${fmtBase(base)}</small>`:'';
    const badges=`${a.investment?`<span class="badge inv">инвест · ${a.offTopPercent}% сверху</span>`:''}${a.excluded?`<span class="badge">не в балансе</span>`:''}${a.archived?`<span class="badge">архив</span>`:''}`;
    return `<div class="acc" data-id="${a.id}" onclick="openAccountOps('${a.id}')" style="cursor:pointer;${(a.excluded||a.archived)?'opacity:.72':''}"><div class="cat-ic" style="background:${a.color}">${a.icon}</div>
      <div class="info"><div class="name">${esc(a.name)} ${badges}</div>
        <div class="sub">${a.currency} · ${a.archived?'в архиве, но учитывается в балансе':a.excluded?'не входит в общий баланс':a.investment?'проценты вносишь вручную':'тратится по конвертам'}</div></div>
      <div class="bal ${base<-0.005?'red':''}">${main}${sub}</div></div>`;
  };
  // Группы счетов: каждая группа показывается отдельной секцией со своим итогом; «Всего денег» = все невключённые excluded.
  const grpSub = list => fmtBase(list.reduce((s,a)=>s+accountBase(accBal,a.id),0));
  const secHead = (title, list, note) => `<div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>${esc(title)}${note?` · <span style="text-transform:none;letter-spacing:0;font-weight:600">${note}</span>`:''}</span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:700">${grpSub(list)}</span></div>`;
  const activeAcc = activeAccounts();
  const mainAcc = activeAcc.filter(a=>!a.group && !a.excluded);
  const groupNames = [...new Set(activeAcc.filter(a=>a.group).map(a=>a.group))];
  const exclAcc = activeAcc.filter(a=>!a.group && a.excluded);
  let accHtml='';
  if(!activeAcc.length) accHtml=`<div class="empty">Нет счетов. Добавь в «Ещё → Счета».</div>`;
  else {
    if(mainAcc.length) accHtml += secHead('Счета', mainAcc) + mainAcc.map(accRow).join('');
    for(const g of groupNames){ const list=activeAcc.filter(a=>a.group===g); accHtml += secHead(g, list, list.every(a=>a.excluded)?'вне общего баланса':'') + list.map(accRow).join(''); }
    if(exclAcc.length) accHtml += secHead('Вне общего баланса', exclAcc) + exclAcc.map(accRow).join('');
  }
  // B11: архивные счета с ненулевым остатком — отдельной секцией (учитываются в «Всего денег», если не excluded).
  const archivedAcc = state.accounts.filter(a=>a.archived && Math.abs(accountBase(accBal,a.id))>0.005);
  if(archivedAcc.length) accHtml += secHead('Архив', archivedAcc);
  if(archivedAcc.length) accHtml += archivedAcc.map(accRow).join('');

  const envHtml = activeEnvelopes().map(e=>{
    const parts=Object.entries(envBal[e.id]||{}).filter(([,v])=>Math.abs(v)>0.005);
    const base=envelopeBase(envBal,e.id);
    const owe=e.noOwe?0:owedBase(owedBal,e.id);
    const main=parts.length?parts.map(([c,v])=>fmt(v,c)).join(' · '):fmt(0,state.baseCurrency);
    const sub=(parts.length>1||(parts[0]&&parts[0][0]!==state.baseCurrency))?`<small>≈ ${fmtBase(base)}</small>`:'';
    const oweBadge = owe>0.5 ? `<div class="pct" style="color:var(--red)">🔴 нужно доложить ${fmtBase(owe)}</div>` : '';
    const tgtHtml = e.monthlyTarget>0 ? (()=>{ const f=envFundedInMonth(e.id, todayISO().slice(0,7)); const pc=Math.min(100,Math.round(f/e.monthlyTarget*100)); const done=f>=e.monthlyTarget-0.005; const rem=Math.max(0,round2(e.monthlyTarget-f));
      return `<div class="pct" style="color:${done?'var(--green)':'var(--muted)'}">🎯 ${fmtBase(f)} / ${fmtBase(e.monthlyTarget)}${done?' ✓':` · ещё ${fmtBase(rem)}`}</div>
        <div class="prog" style="margin-top:4px;height:4px;max-width:170px"><i style="width:${Math.max(2,pc)}%;background:${done?'var(--green)':'var(--accent)'}"></i></div>`; })() : '';
    const spentHtml = e.monthlyLimit>0 ? (()=>{ const sp=envSpentInMonth(e.id, todayISO().slice(0,7)); const pc=Math.min(100,Math.round(sp/e.monthlyLimit*100)); const over=sp>e.monthlyLimit+0.005; const col=over?'var(--red)':pc>=80?'var(--warn-txt)':'var(--muted)';
      return `<div class="pct" style="color:${col}">🧾 ${fmtBase(sp)} / ${fmtBase(e.monthlyLimit)}${over?' · перерасход':''}</div>
        <div class="prog" style="margin-top:4px;height:4px;max-width:170px"><i style="width:${Math.max(2,pc)}%;background:${col}"></i></div>`; })() : '';
    return `<div class="env" data-id="${e.id}" onclick="openEnvManage('${e.id}')" style="cursor:pointer"><div class="cat-ic" style="background:${e.color};font-size:19px">${e.icon||'✉️'}</div>
      <div class="info"><div class="name">${esc(e.name)}</div><div class="pct">${e.percent}% от распределяемого</div>${oweBadge}${tgtHtml}${spentHtml}</div>
      <div class="bal ${base<-0.005?'red':''}">${main}${sub}</div></div>`;
  }).join('')||`<div class="empty">Нет конвертов</div>`;

  const oweSum = totalOwed(owedBal);
  const unalloc = unallocated(accBal, envBal);          // тратимые − закреплённое в конвертах (перерасход не раздувает)
  const over = round2(-unalloc);                       // насколько конверты превышают счета (может быть ≤0)
  const baseline = round2(state.overAllocBaseline||0); // принятый «старый» перекос
  const effOver = round2(over - baseline);             // перекос сверх принятого
  let noticeLine = '';
  if (oweSum>0.5) noticeLine = unalloc>0.5
    ? `<div class="info-line" style="background:var(--red-soft);color:var(--red)">Конвертам нужно доложить: ${fmtBase(oweSum)}. Свободно на счетах: ${fmtBase(unalloc)} — нажми на конверт, чтобы разложить.</div>`
    : `<div class="info-line" style="background:var(--red-soft);color:var(--red)">Конвертам нужно доложить: ${fmtBase(oweSum)}, но свободных денег на счетах нет — пополни счёт или уменьши бюджеты конвертов.</div>`;
  else if (unalloc>0.5) noticeLine = `<div class="info-line">Не разложено по конвертам: ${fmtBase(unalloc)}. Нажми на конверт, чтобы разложить.</div>`;
  else if (effOver>0.5) noticeLine = `<div class="info-line" style="background:var(--red-soft);color:var(--red);display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="flex:1">Конверты превышают деньги на счетах на ${fmtBase(effOver)} — стоит подправить.</span><button class="notice-btn" onclick="acceptOverAlloc(event)">Так и должно</button></div>`;
  else if (baseline>0.5 && over>0.5) noticeLine = `<div class="small-note" style="margin:2px 2px 8px">Старый перекос конвертов учтён (${fmtBase(baseline)}). <a class="notice-link" onclick="resetOverAlloc(event)">пересчитать</a></div>`;

  const iowe=sumDebts('iowe'), owed=sumDebts('owed');
  // P7: сводка распределения денег + сворачиваемый список конвертов
  const free=freeMoney(accBal,envBal), committed=committedEnvelopes(envBal), gRes=goalsReservedBase();
  const envCollapsed=(()=>{ try{ return localStorage.getItem('konverty_envcollapsed')==='1'; }catch(e){ return false; } })();
  const breakdown=`<div class="card tight">
    <div class="row"><span class="muted">💼 Свободно</span><span class="${free<-0.005?'red':'green'}" style="font-weight:800">${fmtBase(free)}</span></div>
    <div class="row"><span class="muted">✉️ В конвертах (бюджет)</span><span style="font-weight:700">${fmtBase(committed)}</span></div>
    ${gRes>0.5?`<div class="row"><span class="muted">🎯 В целях</span><span style="font-weight:700">${fmtBase(gRes)}</span></div>`:''}
    ${oweSum>0.5?`<div class="row"><span class="muted">🔴 Долг конвертам</span><span class="red" style="font-weight:700">${fmtBase(oweSum)}</span></div>`:''}
    ${(()=>{ const b=borrowedInBalance(); return b>0.5?`<div class="row"><span class="muted">🤝 Из них заёмные (нужно вернуть)</span><span class="red" style="font-weight:700">${fmtBase(b)}</span></div>`:''; })()}
    ${(()=>{ const ad=avgDailySpendBase(90), sp=spendableTotal(accBal); if(ad<=0||sp<=0) return ''; const d=Math.round(sp/ad); return `<div class="row"><span class="muted">📆 Запас хода</span><span style="font-weight:700">~${d} ${plural(d,'день','дня','дней')} <span class="muted" style="font-weight:400">(${fmtBase(ad)}/день)</span></span></div>`; })()}</div>`;
  const envHeader=`<div class="section-title" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleEnvSection()" role="button" tabindex="0">
    <span>Конверты (бюджет) · ${activeEnvelopes().length}</span>
    <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:700">${fmtBase(committed)} ${envCollapsed?'▾':'▴'}</span></div>`;
  el.innerHTML = `
    <div class="scr-title">Счета</div>
    <div class="acc-cols">
      <div class="acc-col">
        <div class="card total-card"><div class="l">Всего денег (в ${state.baseCurrency})</div>
          <div class="a">${fmtBase(net)}</div><div class="cur">${curB}</div></div>
        ${breakdown}
        <div class="btn-grid"><button class="btn" onclick="openEntry('income')">＋ Доход</button>
          <button class="btn sec" onclick="openEntry('transfer')">🔁 Перевод</button></div>
      </div>
      <div class="acc-col">
        ${accHtml}
        ${envHeader}${noticeLine}${envCollapsed?'':envHtml}
        ${goalsSummaryHtml()}
        ${(iowe>0||owed>0)?`<div class="section-title">Долги</div><div class="card tight">
          <div class="row"><span class="muted">Я должен</span><span class="red">${fmtBase(iowe)}</span></div>
          <div class="row"><span class="muted">Мне должны</span><span class="green">${fmtBase(owed)}</span></div></div>`:''}
      </div>
    </div>
  `;
}

function toggleEnvSection(){ try{ const v=localStorage.getItem('konverty_envcollapsed')==='1'; localStorage.setItem('konverty_envcollapsed', v?'0':'1'); }catch(e){} render(); }

function acceptOverAlloc(ev){ if(ev) ev.stopPropagation();
  const {accBal,envBal}=computeBalances();
  const unalloc=unallocated(accBal,envBal);
  state.overAllocBaseline=Math.max(0, round2(-unalloc)); save(); render();
  toast('Ок, старый перекос учтён'); }
function resetOverAlloc(ev){ if(ev) ev.stopPropagation();
  state.overAllocBaseline=0; save(); render(); toast('Перекос пересчитан'); }
