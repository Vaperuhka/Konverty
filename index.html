    { const u=accountUsage(id);
      if(a.currency!==currency && (u.history||u.recurring||u.templates)){
        toast('Валюту счёта менять нельзя: он используется в '+[u.history&&'операциях/долгах',u.recurring&&'регулярных платежах',u.templates&&'шаблонах'].filter(Boolean).join(', ')+' — суммы были бы истолкованы в другой валюте. Создай новый счёт в нужной валюте.'); currency=a.currency; } }

  else state.accounts.push({id:uid(),name,icon,color,currency,investment:inv,offTopPercent:off,excluded,deposit,rate,group,archived:false});

}
async function deleteAccount(id) {
  const u=accountUsage(id);   // операции + долги/возвраты (H6: двигают баланс) + регулярные платежи (P1.6B: остались бы без счёта); шаблоны удаляются вместе со счётом
  const used=u.history||u.recurring;
  if(used){
    // H2: не удаляем счёт с операциями/долгами — иначе деньги «висят» на orphan-id и итоги разъезжаются. Только архив.
    if(await confirmSheet('По этому счёту есть операции — удалить нельзя (итоги разъедутся). Отправить в архив? Он скроется из списков, но останется в истории и балансе.',{okText:'В архив'})){ const a=acc(id); if(a){ a.archived=true; save(); toast('Счёт в архиве'); } renderMore(); }

  if(!await confirmSheet('Удалить счёт?',{okText:'Удалить',danger:true}))return;
  state.templates=(state.templates||[]).filter(t=>!(t.accountId===id||t.fromAccountId===id||t.toAccountId===id||t.incomeAccountId===id));   // P1: шаблоны не остаются с мёртвым счётом

}

async function deleteEnvelope(id) {
  const used=state.transactions.some(t=>t.envelopeId===id||t.fromEnvelopeId===id||t.toEnvelopeId===id||(t.distribution&&t.distribution[id])||(t.plan&&t.plan[id])||(Array.isArray(t.splits)&&t.splits.some(s=>s.envelopeId===id)))   // H6: учитываем split-части
    ||(state.goals||[]).some(g=>g.envelopeId===id)         // P1.6A: привязанная цель

    ||(state.recurring||[]).some(r=>r.envelopeId===id)     // P1: регулярный платёж, привязанный к конверту
    ||(state.templates||[]).some(t=>t.envelopeId===id||t.fromEnvelopeId===id||t.toEnvelopeId===id);   // P1.5: шаблоны
  if(used){

function saveCategory(id) {

async function deleteCategory(id) {
  const used=state.transactions.some(t=>t.categoryId===id||(Array.isArray(t.splits)&&t.splits.some(s=>s.categoryId===id)));   // H6: учитываем split-части
  if(!await confirmSheet(used?'По категории есть операции. Они останутся без категории. Удалить?':'Удалить категорию?',{okText:'Удалить',danger:true}))return;
  if(used) state.transactions.forEach(t=>{ if(t.categoryId===id) t.categoryId=null; if(Array.isArray(t.splits)) t.splits.forEach(s=>{ if(s.categoryId===id) s.categoryId=null; }); });   // чистим ссылки → в отчётах «Без категории»
  (state.recurring||[]).forEach(r=>{ if(r.categoryId===id) r.categoryId=null; });   // P1: регулярный платёж не остаётся с мёртвой категорией
  (state.templates||[]).forEach(t=>{ if(t.categoryId===id) t.categoryId=null; });   // P1.6: шаблон не остаётся с мёртвой категорией
  state.watchlists=(state.watchlists||[]).filter(w=>!(w.type==='category'&&w.value===id));   // P1.6C: убираем лимит на удалённую категорию, чтобы он не висел «вслепую»
  state.categories=state.categories.filter(c=>c.id!==id); tomb(id); save(); toast('Удалено'); renderMore();
}

/* ---------- Валюты (формы) ---------- */
function openCurrency(code) {
  const c=code?cur(code):null; const isBase=c&&c.code===state.baseCurrency;
  openSheet(`<h2>${c?'Изменить валюту':'Новая валюта'}</h2>
    <div class="three"><label class="field"><span>Код</span><input class="input u-tt-uppercase" id="cur-code" value="${c?c.code:''}" placeholder="USD" ${c?'disabled':''} maxlength="5" ></label>
      <label class="field"><span>Символ</span><input class="input" id="cur-sym" value="${c?c.symbol:''}" placeholder="$" maxlength="3"></label></div>
    ${isBase?`<div class="small-note u-mb-14" >Базовая валюта, её курс = 1.</div>`:`<label class="field"><span>Курс: 1 единица = сколько ${state.baseCurrency}</span><input class="input" id="cur-rate" type="number" inputmode="decimal" value="${c?c.rate:''}" placeholder="480"></label>
    <label class="field u-d-flex_ai-center_g-10_fd-row" >
      <input type="checkbox" id="cur-manual" ${c&&c.manual?'checked':''} class="u-w-20_h-20"><span class="u-m-0">Курс задан вручную — не обновлять автоматически</span></label>
    <div class="small-note u-m-n6-2-10" >Если изменить курс, он станет «ручным» сам. Сними флажок, чтобы снова обновлять эту валюту автоматически.</div>`}
    <button class="btn" onclick="saveCurrency('${code||''}')">Сохранить</button>
    ${(!c||isBase)?'':`<button class="btn sec u-mt-10"  onclick="makeBase('${c.code}')">Сделать базовой</button>`}`);
}
function saveCurrency(code) {
  const newCode=document.getElementById('cur-code').value.trim().toUpperCase(), sym=document.getElementById('cur-sym').value.trim()||newCode, rateEl=document.getElementById('cur-rate');
  const mEl=document.getElementById('cur-manual'), wantManual=!!(mEl && mEl.checked===true);   // флажок «задан вручную»
  if(code){ const c=cur(code); c.symbol=sym; let rateChanged=false;
    if(rateEl){ const r=parseFloat(rateEl.value);
      if(r>0 && isFinite(r)){ rateChanged = Math.abs(r-c.rate) > 1e-12*Math.max(1,Math.abs(c.rate)); c.rate=r; }
      else if(rateEl.value.trim()!=='') toast('Курс должен быть больше нуля — прежний курс сохранён'); }   // «-5»/«0» раньше записывались и «отравляли» историю курсов
    // Курс, заданный пользователем, отделён от автоматически обновляемого (аудит 1.0.6, P1): изменил число и не трогал флажок → курс становится «ручным»;
    // явно переключил флажок → слушаемся флажка (снял — валюта снова обновляется автоматически).
    const was=c.manual===true; const manual = (rateChanged && wantManual===was) ? true : wantManual;
    if(manual) c.manual=true; else if(was) c.manual=false;   // снял пометку у ручной валюты → явное manual:false (иначе слияние с устройством, не знающим об этом, вернуло бы «вручную»); у никогда не ручной поле не заводим
    if(rateChanged) (state.rateHistory ||= {})[todayISO()]=rateSnapshot(); }   // сегодняшний снимок истории должен совпадать с новым курсом
  else { if(!newCode){toast('Введи код');return;}
    if(!/^[A-Z0-9]{1,5}$/.test(newCode)){ toast('Код валюты — от 1 до 5 латинских букв или цифр (например USD). Проверь раскладку клавиатуры'); return; }   // кириллический/иной код normalize() молча выбрасывал бы вместе с валютой
    if(state.currencies.some(x=>x.code===newCode)){toast('Уже есть');return;}
    const rate=parseFloat(rateEl.value); if(!rate||rate<=0||!isFinite(rate)){toast('Введи курс');return;}
    state.currencies.push(Object.assign({code:newCode,symbol:sym,rate}, wantManual?{manual:true}:{}));   // новая валюта по умолчанию обновляется автоматически (введённый курс — стартовый)
    (state.rateHistory ||= {})[todayISO()]=rateSnapshot(); }
  save(); closeSheet(); toast('Сохранено'); renderMore();
}
function makeBase(code){ const nb=cur(code); if(!nb||nb.rate<=0){toast('Сначала задай курс');return;}
  // H6/P1.3: смена базы НЕ мигрирует суммы, заданные в старой базе — блокируем не только при операциях/долгах,
  // но и при любых денежных настройках (цели/лимиты конвертов, бюджет долгов, лимиты наблюдения, базлайн, снимки курсов).
  const hasMoneySettings =
    (state.envelopes||[]).some(e=>(+e.monthlyTarget>0)||(+e.monthlyLimit>0)) ||
    (+state.debtBudget>0) ||
    (state.watchlists||[]).some(w=>+w.target>0) ||
    (+state.overAllocBaseline>0) ||
    (state.rateHistory && Object.keys(state.rateHistory).length>0);
  if((state.transactions&&state.transactions.length)||(state.debts&&state.debts.length)||hasMoneySettings){ toast('Сменить базовую валюту можно только пока нет операций, долгов и денежных настроек (цели/лимиты/бюджеты/курсы) — иначе суммы в старой базе исказятся.'); return; }
  // у базовой курс всегда 1 — пометка «вручную» теряет смысл, поэтому снимаем её
  const factor=nb.rate; state.currencies.forEach(c=>{ c.rate=c.code===code?1:c.rate/factor; if(c.code===code) delete c.manual; }); state.baseCurrency=code;
  save(); closeSheet(); toast('Базовая: '+code); renderMore(); }
async function deleteCurrency(code){ if(code===state.baseCurrency){toast('Нельзя удалить базовую');return;}
  if(state.accounts.some(a=>a.currency===code)){ toast('Валюта используется счётом'); return; }
  if(state.goals.some(g=>g.currency===code)){ toast('Валюта используется целью'); return; }   // M17
  const used=state.transactions.some(t=>t.currency===code||t.fromCurrency===code||t.toCurrency===code)
    ||state.debts.some(d=>d.currency===code)
    ||(state.events||[]).some(ev=>ev.currency===code)       // P1.4
    ||(state.templates||[]).some(tp=>tp.currency===code);   // P1.4
  if(used){ toast('Валюта есть в операциях/долгах/событиях/шаблонах — удалить нельзя (иначе история пересчитается по курсу 1).'); return; }   // H6: не оставляем историю без курса
  if(!await confirmSheet('Удалить валюту?',{okText:'Удалить',danger:true}))return;
  state.currencies=state.currencies.filter(c=>c.code!==code); save(); toast('Удалено'); renderMore(); }

/* ---------- Автообновление курсов ---------- */
// Снимок курсов на дату: только валюты с положительным курсом (rateAt() всё равно игнорирует прочие, а нулевой курс в истории нельзя поправить из интерфейса).
function rateSnapshot(){ return Object.fromEntries(state.currencies.filter(c=>c.rate>0).map(c=>[c.code, c.rate])); }
async function updateRates() {
  const btn=document.getElementById('ratesBtn'); if(btn){ btn.textContent='⏳ Обновляю…'; btn.style.pointerEvents='none'; }
  try {
    const res=await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(state.baseCurrency), {cache:'no-store'});
    const data=await res.json();
    if(!data || data.result!=='success' || !data.rates) throw new Error('bad');
    let n=0; const missing=[], manual=[];
    state.currencies.forEach(c=>{
      if(c.code===state.baseCurrency){ c.rate=1; return; }
      if(c.manual===true){ manual.push(c.code); return; }   // курс задан владельцем вручную — автообновление его НЕ затирает (аудит 1.0.6, P1)
      const per=data.rates[c.code];               // сколько c.code за 1 базовую
      if(per>0){ const r=Number((1/per).toPrecision(8)); if(r>0 && isFinite(r)){ c.rate=r; n++; } else missing.push(c.code); }   // база за 1 единицу c.code. 8 значащих цифр, а не 4 знака после запятой: иначе малая валюта при дорогой базе округлялась до 0 (или с ошибкой 25%)
      else missing.push(c.code);
    });
    (state.rateHistory ||= {})[todayISO()]=rateSnapshot();   // снимок курсов на сегодня для исторической аналитики
    if(n>0) state.ratesUpdated=new Date().toISOString();   // «Обновлено …» — только если хоть один курс реально обновился (все ручные / сервис не знает валют → обновления не было)
    save();
    toast(n ? `Курсы обновлены${missing.length?` · без ${missing.join(', ')}`:''}${manual.length?` · вручную (не менялись): ${manual.join(', ')}`:''} ✓` : (manual.length&&!missing.length ? 'Все курсы заданы вручную — обновлять нечего' : 'Не нашлось валют для обновления'));
    if (currentTab==='more' && moreView==='currencies') renderMore();
  } catch(e) {
    if(btn){ btn.textContent='🔄 Обновить курсы'; btn.style.pointerEvents='auto'; }
    toast('Не удалось обновить (нет сети или сервис недоступен)');
  }
}

/* ---------- Экспорт / импорт / сброс ---------- */
/* ================= Синхронизация через GitHub Gist =================
   Данные хранятся в secret-Gist пользователя (secret ≠ приватный: доступен по ссылке; БЕЗ шифрования). Токен — только локально (в Gist НЕ уходит).
   Модель слияния: last-write-wins по state.rev (wall-clock). Перед заменой локальных данных — бэкап. */
const SYNC_KEY='konverty_sync';         // {token, gistId}
const SYNC_TS_KEY='konverty_sync_at';   // когда последний раз синхронизировались (для UI)
const SYNC_BASE_KEY='konverty_sync_base'; // ревизия на момент последней синхронизации (для трёхстороннего слияния)
const SYNC_FILE='konverty_state.json';
let _syncTimer=null, _syncing=false, _syncPending=false, _syncPendingLoud=false;   // _syncPendingLoud: отложенный повтор вызван явным действием владельца (кнопка), а не фоном
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); }catch(e){ return null; } }
function syncSetCfg(c){ try{ if(c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }catch(e){} }
function syncConfigured(){ const c=syncCfg(); return !!(c && c.token && c.gistId); }
function syncMarkAt(){ try{ localStorage.setItem(SYNC_TS_KEY, String(Date.now())); }catch(e){} }
function syncLastAt(){ try{ return +localStorage.getItem(SYNC_TS_KEY)||0; }catch(e){ return 0; } }
function _gh(path, opts){ opts=opts||{}; const c=syncCfg();
  const headers=Object.assign({'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}, opts.headers||{});
  if(c&&c.token) headers['Authorization']='Bearer '+c.token;
  return fetchT('https://api.github.com'+path, Object.assign({}, opts, {headers})); }
// Запрос с таймаутом: зависший fetch держал бы замок операций (а с ним — восстановление/импорт/сброс) неопределённо долго.
// Таймер снимается, как только пришёл ответ; при обрыве — AbortError, который runSync трактует как сетевую ошибку.
function fetchT(url, opts, ms){
  if(typeof AbortController==='undefined') return fetch(url, opts);
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(), ms||25000);
  return fetch(url, Object.assign({}, opts, {signal:ac.signal})).then(r=>{ clearTimeout(t); return r; }, e=>{ clearTimeout(t); throw e; }); }
// Подключение читает локальное состояние, ждёт сеть и (на новом устройстве) ЗАМЕНЯЕТ его облачным — значит, тоже под замком.
// Итог подключения (аудит 1.0.6, P1: статусы): {ok, status}. 'connected' — ВСЕ стадии завершены (облако найдено/создано, первичная загрузка или выгрузка выполнена,
// локальная запись подтверждена, база синхронизации выставлена); 'partial' — токен принят и облако найдено, но первичная загрузка/локальное сохранение НЕ завершились
// (токен остаётся, повторить можно кнопкой «Синхронизировать сейчас»); 'failed' — подключение отменено, токен не сохранён. «Подключено ✓» — только при 'connected'.
async function syncConnect(token){
  token=(token||'').trim(); if(!token){ toast('Вставь токен'); return {ok:false, status:'failed'}; }
  const r=await withStateLock(()=>syncConnectExclusive(token), { onWait:()=>toast('Идёт синхронизация — подожду её завершения…'), timeoutMs:60000 });
  if(r===LOCK_TIMEOUT){ toast('Синхронизация занята — повтори подключение через минуту'); return {ok:false, status:'failed'}; }
  return r; }
let syncConnectIssue='';   // почему подключение не завершено ('partial'); показывается на экране «Синхронизация» (тост — одна строка на 1,7 с, причину он не удержит)
async function syncConnectExclusive(token){
  const done=(status, why)=>{ syncConnectIssue = status==='partial' ? (why||'') : ''; return {ok:status==='connected', status}; };
  // ОДИН тост с настоящей причиной: toast() — единственная строка, второй вызов подряд тут же затирает первый (раньше причина терялась, а «см. сообщение выше» ссылалось в никуда).
  const partial=why=>{ toast('Токен принят, но подключение НЕ завершено: '+why+'. Устрани причину и нажми «Синхронизировать сейчас» на экране «Синхронизация».', 7000); return done('partial', why); };
  syncSetCfg({token, gistId:null});
  try{
    const r=await _gh('/gists?per_page=100'); if(!r.ok) throw new Error('auth');
    const list=await r.json();
    let gistId=(list.find(g=>g.files && g.files[SYNC_FILE])||{}).id || null, created=false;
    if(!gistId){
      if(!localPushGate()){ syncSetCfg(null); return done('failed'); }   // 1.0.6: не создаём облако из состояния, которое не проходит проверку
      const body={description:'Конверты — синхронизация (не редактировать вручную)', public:false, files:{[SYNC_FILE]:{content:JSON.stringify(state)}}};
      const cr=await _gh('/gists',{method:'POST', body:JSON.stringify(body)}); if(!cr.ok) throw new Error('create'); const g=await cr.json(); gistId=g.id; created=true;
    }
    syncSetCfg({token, gistId});
    // Присоединение к существующему Gist → принимаем облако целиком (не сливаем — иначе задвоятся дефолтные счета/конверты нового устройства).
    const notSavedMsg='данные ушли в облако, но не сохранились на этом устройстве (проверь свободное место в браузере)';
    if(created){ const pr=await syncPush();
      if(persistState()){ syncSetBase(pr); syncMarkAt(); }   // P1.2: отметку только при реальной записи
      else return partial('облако создано, но данные не сохранились на этом устройстве (проверь свободное место в браузере)'); }
    else {
      const p=await syncPull();
      if(p.kind==='corrupt'){ syncSetCfg(null); toast('Облако повреждено — подключение отменено. Проверь gist.'+whyBad(p.detail)); return done('failed'); }   // P0: не выгружаем локальное поверх битого облака
      if(p.kind==='ok'){
        const why=await syncAdopt(p.state);
        if(why===null){ syncSetBase(+p.state.rev||0); syncMarkAt(); }
        else return partial('первичная загрузка с облака не завершена — '+why);   // P1.2/P1.3: не выдаём успех при неудачном adopt/записи
      } else {   // облака нет → выгружаем локальное (но только если оно проходит проверку)
        if(!localPushGate()){ syncSetCfg(null); return done('failed'); }
        const pr=await syncPush();
        if(persistState()){ syncSetBase(pr); syncMarkAt(); }
        else return partial(notSavedMsg); }
    }
    return done('connected');
  }catch(e){ syncSetCfg(null); toast('Не удалось подключить (проверь токен и право «gist»)'); return done('failed'); }
}
// Возвращает {kind:'missing'|'corrupt'|'ok', state?}. Сетевая ошибка пробрасывается (её обрабатывает runSync).
async function syncPull(){ const c=syncCfg(); if(!c||!c.gistId) return {kind:'missing'};
  const r=await _gh('/gists/'+c.gistId); if(!r.ok) throw new Error('pull'); const g=await r.json();
  const f=g.files&&g.files[SYNC_FILE]; if(!f) return {kind:'missing'};   // файла нет → облако «пустое»/новое (безопасно выгрузить локальное)
  let content=f.content; if(f.truncated && f.raw_url){ const rr=await fetchT(f.raw_url); content=await rr.text(); }
  let data=null; try{ data=JSON.parse(content); }catch(e){ data=null; }
  const bad=validateState(data);
  if(bad) return {kind:'corrupt', detail:bad};   // P0: файл ЕСТЬ, но содержимое битое → НЕ «нет облака», не затираем его локальным; detail — что именно не так
  return {kind:'ok', state:data}; }
async function syncPush(){ const c=syncCfg(); if(!c||!c.gistId) return 0;
  const rev=+state.rev||0;   // фиксируем выгружаемую ревизию синхронно с телом
  const body={files:{[SYNC_FILE]:{content:JSON.stringify(state)}}};
  const r=await _gh('/gists/'+c.gistId,{method:'PATCH', body:JSON.stringify(body)}); if(!r.ok) throw new Error('push'); return rev; }
// База синхронизации: ревизия, которая на момент последней синхронизации была и локально, и в облаке.
// По ней понимаем, какая сторона менялась: только местная → выгрузить; только облако → загрузить; обе → слить.
function syncBase(){ try{ return +localStorage.getItem(SYNC_BASE_KEY)||0; }catch(e){ return 0; } }
function syncSetBase(r){ try{ localStorage.setItem(SYNC_BASE_KEY, String(+r||0)); }catch(e){} }
// Короткое объяснение отказа валидатора для тостов: «(путь: причина)». Значения данных не показываем.
const whyBad = v => v ? ` (${v.path}: ${v.reason})` : '';
// Аудит 1.0.5: тот же валидатор, что стоит на ВХОДЕ из облака, стоит и на ВЫХОДЕ. Иначе устройство выгрузит состояние,
// которое другие устройства сочтут «повреждённым облаком», и синхронизация встанет у всех. Локальные данные не трогаем.

function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const nl=text.indexOf('\n'); const firstLine=nl>-1?text.slice(0,nl):text;
  const delim=(firstLine.split(';').length>firstLine.split(',').length)?';':',';
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch; }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

    if(nCol<0){ for(let c=0;c<ncols;c++){ if(c===dCol||c===aCol) continue; if(body.slice(0,10).some(r=>String(r[c]||'').trim().length>3 && !/^[\d.,\-\s]+$/.test(String(r[c]).trim()))){ nCol=c; break; } } }
    // M10: авто-определение порядка ДД.ММ vs ММ.ДД по данным колонки даты.

    { const g1=[],g2=[]; body.slice(0,30).forEach(r=>{ const mm=String(r[dc]||'').trim().match(/(\d{1,2})[.\/](\d{1,2})[.\/]\d{2,4}/); if(mm){ g1.push(+mm[1]); g2.push(+mm[2]); } });
      if(g1.some(x=>x>12)) dateOrder='dmy'; else if(g2.some(x=>x>12)) dateOrder='mdy'; }
    csvData={ headers, body, map:{date:dc,amount:Math.max(0,aCol),note:nCol<0?-1:nCol}, accountId:activeAccounts()[0].id, sign:'auto', envelopeId:activeEnvelopes()[0]?.id||'', dateOrder };

  }catch(e){ toast('Не удалось прочитать CSV'); } }; r.readAsText(file); }

async function runCsvImport(){
  const d=csvData; if(!d) return; const a=acc(d.accountId); if(!a){ toast('Выбери счёт'); return; }
  const code=a.currency||state.baseCurrency, inv=a.investment;
  // H5: дедуп по КОЛИЧЕСТВУ вхождений — одинаковые строки внутри файла импортируются; повторный импорт того же файла — нет.
  const acctCurOf=t=>{ if(t.type==='expense') return [t.accountId||'', t.currency||'']; if(t.type==='income'){ const ks=t.accountCredits?Object.keys(t.accountCredits):[]; if(ks.length===1){ const cr=t.accountCredits[ks[0]]; return [ks[0], (typeof cr==='number'?t.currency:(cr&&cr.cur))||'']; } } return ['','']; };
  const existing={};
  state.transactions.forEach(t=>{ if(t.type!=='income'&&t.type!=='expense') return; const [ai,ci]=acctCurOf(t); const k=csvDedupKey(t.date,t.amount,t.note||'',t.type==='income',ai,ci); existing[k]=(existing[k]||0)+1; });
  const batch={};
  // Этап 3: авто-категоризация по истории (payee memory) — описание из прошлых операций → категория.
  const noteCat={}; state.transactions.forEach(t=>{ if((t.type==='expense'||t.type==='income')&&t.note&&t.categoryId){ const k=t.note.trim().toLowerCase(); if(k) noteCat[k]={cat:t.categoryId,inc:t.type==='income'}; } });
  let added=0,dup=0,catn=0;
  let okbk=true; try{ await createBackup('pre-import'); }catch(e){ okbk=false; }
  if(!okbk && !await confirmSheet('Не удалось создать резервную копию. Всё равно импортировать?',{okText:'Импортировать'})) return;   // P1: проверяем копию перед CSV-импортом
  for(const r of d.body){ const dt=parseCsvDate(r[d.map.date],d.dateOrder), am=parseCsvAmount(r[d.map.amount]); if(!dt||am==null||round2(Math.abs(am))<=0) continue;
    const note=d.map.note>=0?String(r[d.map.note]||'').trim():''; const amt=round2(Math.abs(am));
    const isInc=d.sign==='income'||(d.sign==='auto'&&am>0);
    const key=csvDedupKey(dt,amt,note,isInc,d.accountId,code); const done=batch[key]||0;
    if(done < (existing[key]||0)){ batch[key]=done+1; dup++; continue; }   // такое количество уже есть в истории
    batch[key]=done+1;
    const hit=note?noteCat[note.toLowerCase()]:null; const catId=(hit&&hit.inc===isInc)?hit.cat:null; if(catId) catn++;
    let tx;
    if(isInc) tx={id:uid(),type:'income',date:dt,currency:code,amount:amt,categoryId:catId,note,accountCredits:{[d.accountId]:{amt,cur:code}},plan:{},distribution:{}};
    else tx={id:uid(),type:'expense',date:dt,currency:code,amount:amt,accountId:d.accountId,envelopeId:inv?null:(d.envelopeId||null),categoryId:catId,note};
    state.transactions.push(tx); added++; }
  save(); csvData=null; toast(`Импортировано: ${added}${catn?` · категорий распознано ${catn}`:''}${dup?` · дублей ${dup}`:''} ✓`); moreView=null; render();
}

/* ---------- Добавление операции из текста SMS/уведомления банка (пункт 4) ---------- */
function parseSmsAmount(text){
  text=String(text).replace(/ /g,' ');
  // Логика определения суммы вынесена в core.js (smsAmount) — чистая, тестируется в Deno. Берёт сумму покупки, не остаток.
  return smsAmount(text);
}
function smsMerchant(text){
  let s=String(text).replace(/ /g,' ').replace(/https?:\/\/\S+/g,' ');
  s=s.replace(/\d[\d\s.,:*\/-]*\d/g,' ').replace(/[₸₽₴$€]/g,' ').replace(/\b(kzt|rub|usd|eur|uah|тг|тнг|руб|грн)\b/gi,' ');
  s=s.replace(/\b(списан[а-я]*|зачислен[а-я]*|оплат[а-я]*|покупк[а-я]*|перевод[а-я]*|карт[а-я]*|сч[её]т[а-я]*|баланс[а-я]*|доступно|available|card|бонус[а-я]*|к[эе]шб[э]к[а-я]*|pokupka|oplata|dostupno|balance)\b/gi,' ');
  const words=s.split(/[^\p{L}]+/u).filter(w=>w.length>2);
  return words.slice(0,3).join(' ').trim();
}

function saveGoal(id){ const name=document.getElementById('g-name').value.trim(); if(!name){toast('Введи название');return;}
  const target=round2(parseFloat(document.getElementById('g-target').value)||0); if(target<=0){toast('Введи сумму цели');return;}
  const saved=round2(parseFloat(document.getElementById('g-saved').value)||0);

  const currency=envelopeId?state.baseCurrency:document.getElementById('g-cur').value, deadline=document.getElementById('g-deadline').value||'', icon=document.getElementById('g-icon').value, color=document.getElementById('g-color').value;
  const base={name,target,currency,deadline,icon,color};
  if(envelopeId) base.envelopeId=envelopeId; else base.saved=saved;   // привязанная — прогресс из конверта; иначе — свой saved

async function deleteGoal(id){ if(!await confirmSheet('Удалить цель?',{okText:'Удалить',danger:true}))return; state.goals=state.goals.filter(g=>g.id!==id); tomb(id); save(); closeSheet(); toast('Удалено'); moreView='goals'; renderMore(); }

async function saveGoalMove(id,dir){ const g=state.goals.find(x=>x.id===id); if(!g)return; const amt=round2(parseFloat(document.getElementById('gm-amt').value)||0); if(amt<=0){toast('Введи сумму');return;}
  const gc=goalCurOf(g);
  if(dir==='add'){ const {accBal,envBal}=computeBalances(); const free=freeMoney(accBal,envBal); if(toBase(amt,gc)>free+0.005){ if(!await confirmSheet(`Ты резервируешь больше, чем свободно на счетах (${fmtBase(free)}). «Свободно» уйдёт в минус. Всё равно отложить?`,{okText:'Отложить'})) return; } }

    g.saved=round2(Math.max(0, (g.saved||0)+(dir==='add'?amt:-amt))); (g.log ||= []).push({date:todayISO(),amount:dir==='add'?amt:-amt});
  }
  save(); closeSheet(); toast(dir==='add'?'Отложено ✓':'Снято'); if(currentTab==='accounts') render(); else { moreView='goals'; renderMore(); } }

let planDailyWhatIf='';   // сценарий «что если тратить N/день» на экране Плана
function renderPlan(el){
  const {envBal,accBal}=computeBalances();
  const gRes=goalsReservedBase();
  const free=freeMoney(accBal,envBal);
  const mt=monthTx(), ym=viewMonth, isCur=ym===todayISO().slice(0,7);
  const incomeAct=mt.filter(t=>t.type==='income').reduce((s,t)=>s+toBase(t.amount,t.currency),0);
  const expenseAct=mt.filter(t=>t.type==='expense').reduce((s,t)=>s+toBase(t.amount,t.currency),0);
  const rec=state.recurring.filter(r=>r.active!==false);
  const billCount=rec.filter(r=>r.type==='expense').length;
  const billsPlan=rec.filter(r=>r.type==='expense').reduce((s,r)=>s+toBase(r.amount,r.currency),0);
  const incExpected=isCur?rec.filter(r=>r.type==='income'&&r.lastPosted!==ym).reduce((s,r)=>s+toBase(r.amount,r.currency),0):0;
  const goalsPlan=activeGoals().reduce((s,g)=>s+toBase(goalMonthly(g),g.currency),0);
  const incomeTotal=round2(incomeAct+incExpected);
  const freeAlloc=round2(incomeTotal-billsPlan-goalsPlan);
  // Прогноз денежного потока до конца месяца (пункт «что если»)
  let forecastCard='';
  if(isCur){
    const dim=daysInMonth(ym), todayD=new Date().getDate();
    const spendNow=Math.max(0, round2(spendableTotal(accBal)));
    const recExpPosted=rec.filter(r=>r.type==='expense'&&r.lastPosted===ym).reduce((s,r)=>s+toBase(r.amount,r.currency),0);
    const discBurn=Math.max(0, round2((expenseAct-recExpPosted)/Math.max(1,todayD)));
    const whatIf=planDailyWhatIf!==''?Math.max(0,round2(parseFloat(planDailyWhatIf)||0)):null;
    const burn=whatIf!==null?whatIf:discBurn;
    const recIncF=rec.filter(r=>r.type==='income'&&r.lastPosted!==ym).map(r=>({day:Math.min(r.day||1,dim),amt:toBase(r.amount,r.currency)}));
    const recExpF=rec.filter(r=>r.type==='expense'&&r.lastPosted!==ym).map(r=>({day:Math.min(r.day||1,dim),amt:toBase(r.amount,r.currency)}));
    let bal=spendNow, zeroDay=null;
    recIncF.forEach(r=>{ if(r.day<=todayD) bal=round2(bal+r.amt); });
    recExpF.forEach(r=>{ if(r.day<=todayD) bal=round2(bal-r.amt); });
    if(bal<0) zeroDay=todayD;
    for(let d=todayD+1; d<=dim; d++){ bal=round2(bal-burn); recIncF.forEach(r=>{ if(r.day===d) bal=round2(bal+r.amt); }); recExpF.forEach(r=>{ if(r.day===d) bal=round2(bal-r.amt); }); if(bal<0 && zeroDay===null) zeroDay=d; }
    const end=round2(bal), gen=MONTHS_GEN[+ym.split('-')[1]-1];
    const runway = zeroDay!==null
      ? `<div class="info-line u-bg-red-soft_c-red" >При таком темпе денег хватит примерно до <b>${zeroDay} ${gen}</b> — дальше уйдёшь в минус. Стоит сбавить темп или пополнить счёт.</div>`
      : `<div class="info-line">Денег на счетах хватит до конца месяца. Останется примерно <b>${fmtBase(end)}</b>.</div>`;
    const incF=recIncF.reduce((s,r)=>s+r.amt,0);
    forecastCard=`<div class="card"><div class="section-title u-m-0-0-8" >Прогноз денег · что если</div>
      <div class="row"><span class="muted">Свободные деньги на счетах</span><span class="u-fw-800">${fmtBase(spendNow)}</span></div>
      <div class="row"><span class="muted">Расход в день${whatIf!==null?' (сценарий)':' (текущий темп)'}</span><span style="font-weight:800${whatIf!==null?';color:var(--accent-text)':''}">${fmtBase(burn)}</span></div>
      ${incF>0?`<div class="row"><span class="muted">Ожидается доход в этом месяце</span><span  class="green u-fw-800">+${fmtBase(incF)}</span></div>`:''}
      <div class="row"><span class="muted">Прогноз к концу месяца</span><span  class="${end>=0?'green':'red'} u-fw-800">${end<0?'−':''}${fmtBase(Math.abs(end))}</span></div>
      <div class="u-mt-10">${runway}</div>
      <label class="field u-mt-12" ><span>Что если тратить в день (${state.baseCurrency})</span>
        <input class="input" type="number" inputmode="decimal" placeholder="${Math.round(discBurn)} — текущий темп" value="${planDailyWhatIf}" onchange="planDailyWhatIf=this.value.trim(); renderMore()"></label>
      ${whatIf!==null?`<button class="btn sec small u-mt-8"  onclick="planDailyWhatIf='';renderMore()">Сбросить сценарий</button>`:''}
      <div class="small-note u-mt-8" >Оценка по темпу трат и будущим повторяющимся платежам. Курсы и категории учтены приблизительно.</div></div>`;
  }
  el.innerHTML=`<button class="back-btn" onclick="backMore()">${ic('chevl','sm')} Назад</button><h2 class="u-m-0-4-12">План на ${monthLabel(ym)}</h2>
    <div class="card">
      <div class="plan-row"><span class="lab">💰 Доход${incExpected>0?' (факт + ожидается)':' (факт)'}</span><span class="green u-fw-800" >+${fmtBase(incomeTotal)}</span></div>
      <div class="plan-row"><span class="lab">Обязательные · ${billCount}</span><span class="u-fw-700">−${fmtBase(billsPlan)}</span></div>
      <div class="plan-row"><span class="lab">🎯 Отложить в цели</span><span class="u-fw-700">−${fmtBase(goalsPlan)}</span></div>
      <div class="plan-row total"><span class="lab">Свободно распределить</span><span class="${freeAlloc>=0?'green':'red'}">${freeAlloc<0?'−':''}${fmtBase(Math.abs(freeAlloc))}</span></div></div>
    <div class="card tight">
      <div class="row"><span class="muted">Фактически потрачено за месяц</span><span class="u-fw-800">${fmtBase(expenseAct)}</span></div>
      ${gRes>0.005?`<div class="row"><span class="muted">🎯 Зарезервировано в целях</span><span class="u-fw-800">${fmtBase(gRes)}</span></div>`:''}
      <div class="row"><span class="muted">Свободно${gRes>0.005?' (за вычетом целей)':''}</span><span  class="${free<-0.005?'red':''} u-fw-800">${fmtBase(free)}</span></div>
      ${isCur?`<div class="row"><span class="muted">Ориентир на сегодня (осталось ${daysLeftInMonth()} дн.)</span><span  class="green u-fw-800">${fmtBase(round2(Math.max(0,free)/daysLeftInMonth()))}</span></div>`:''}</div>
    ${forecastCard}
    <div class="small-note u-m-10-6-30" >«Обязательные» — сумма активных <b>повторяющихся расходов</b>. «В цели» — рекомендуемый месячный взнос по <b>целям со сроком</b>. Настрой их в разделах «Повторяющиеся платежи» и «Цели-накопления».</div>`;
}

/* =================================================================
   Погашение долгов (снежный ком / лавина)
   ================================================================= */
function debtRemainingBase(d){ return toBase(Math.max(0,debtRemaining(d)), d.currency); }
function debtOrder(list, strategy){ const a=list.slice();
  if(strategy==='avalanche') a.sort((x,y)=>(y.rate-x.rate)||(x.rem-y.rem));
  else if(strategy==='duedate') a.sort((x,y)=>((x.due<y.due?-1:x.due>y.due?1:0))||(x.rem-y.rem));
  else a.sort((x,y)=>x.rem-y.rem);   // snowball — от меньшего
  return a; }
function simulateDebtPayoff(strategy, monthlyBase){
  const items=state.debts.filter(d=>d.direction==='iowe' && debtRemaining(d)>0.005)
    .map(d=>({name:d.counterparty||'—', rem:debtRemainingBase(d), rate:d.rate||0, due:d.dueDate||'9999-99'}));
  if(!items.length) return {empty:true};
  const order=debtOrder(items,strategy).map(i=>i.name);
  if(monthlyBase<=0) return {order, need:true};
  let month=0;
  while(items.some(i=>i.rem>0.005) && month<600){
    month++;
    items.forEach(i=>{ if(i.rem>0) i.rem=round2(i.rem + i.rem*(i.rate||0)/1200); });
    let pay=monthlyBase;
    for(const i of debtOrder(items,strategy)){ if(pay<=0.005) break; if(i.rem<=0) continue; const p=Math.min(pay,i.rem); i.rem=round2(i.rem-p); pay=round2(pay-p); }
  }
  const done=!items.some(i=>i.rem>0.005);
  return { order, months: done?month:null, impossible:!done };
}
function planMonthsLabel(n){ let [y,m]=todayISO().slice(0,7).split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12)+1; return `${MONTHS_NOM[m-1]} ${y}`; }
function setDebtStrategy(s){ state.debtStrategy=s; save(); renderMore(); }
function setDebtBudget(v){ state.debtBudget=round2(parseFloat(v)||0); save(); renderMore(); }
function debtPayoffCard(){
  const iowe=state.debts.filter(d=>d.direction==='iowe' && debtRemaining(d)>0.005);
  if(iowe.length<1) return '';
  const strat=state.debtStrategy||'snowball';
  const sim=simulateDebtPayoff(strat, state.debtBudget||0);
  const stratName={snowball:'снежный ком',avalanche:'лавина',duedate:'по сроку'}[strat];
  const orderHtml=(sim.order||[]).map((n,i)=>`<div class="preview-line"><span>${i+1}. ${esc(n)}</span></div>`).join('');
  let res='';
  if(sim.need) res=`<div class="info-line u-mt-8" >Укажи сумму в месяц — посчитаю, когда закроешь все долги.</div>`;
  else if(sim.impossible) res=`<div class="info-line u-bg-red-soft_c-red_mt-8" >При такой сумме долги почти не уменьшаются (проценты съедают). Увеличь ежемесячный платёж.</div>`;
  else if(sim.months!=null) res=`<div class="info-line u-mt-8" >Закроешь все долги за <b>${sim.months} мес</b> — примерно к <b>${planMonthsLabel(sim.months)}</b>.</div>`;
  return `<div class="card"><div class="section-title u-m-0-0-8" >План погашения</div>
    <div class="mini-seg"><button class="${strat==='snowball'?'active':''}" onclick="setDebtStrategy('snowball')">Снежный ком</button>
      <button class="${strat==='avalanche'?'active':''}" onclick="setDebtStrategy('avalanche')">Лавина</button>
      <button class="${strat==='duedate'?'active':''}" onclick="setDebtStrategy('duedate')">По сроку</button></div>
    <div class="small-note u-m-0-2-8" >${strat==='snowball'?'Сначала гасим самый маленький долг — быстрый эффект.':strat==='avalanche'?'Сначала гасим долг с самым высоким % (укажи ставку у долга).':'Сначала гасим ближайшие по сроку.'}</div>
    <label class="field u-mb-10" ><span>Готов направлять на долги в месяц (${state.baseCurrency})</span>
      <input class="input" type="number" inputmode="decimal" value="${state.debtBudget||''}" placeholder="0" onchange="setDebtBudget(this.value)"></label>
    <div class="small-note u-m-0-2-4" >Порядок выплат (${stratName}):</div>
    <div class="preview-box">${orderHtml}</div>${res}</div>`;
}

/* =================================================================

function txTags(t){ if(!t||!t.note) return []; const out=[]; const re=/#([\p{L}\p{N}_]+)/gu; let m; while((m=re.exec(t.note))) out.push(m[1].toLowerCase()); return [...new Set(out)]; }
function watchSpent(w, ym){ const list=state.transactions.filter(t=>t.date.slice(0,7)===ym && t.type==='expense');
  if(w.type==='category') return list.reduce((s,t)=>{ for(const p of txParts(t)){ if(p.categoryId===w.value) s=s+toBaseAt(p.amount,t.currency,t.date); } return s; },0);
  return list.filter(t=>txTags(t).includes(w.value)).reduce((s,t)=>s+toBaseAt(t.amount,t.currency,t.date),0); }
// Единый раздел «Бюджеты»: сводит воедино цель/лимит конвертов и лимиты категорий (watchlists). Данные НЕ мигрируются — это общий экран поверх существующих механизмов.

let reportPeriod='month';
function reportShiftYm(ym,d){ let [y,m]=ym.split('-').map(Number); m+=d; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,'0')}`; }
function reportRange(){
  const nowYm=todayISO().slice(0,7);
  if(reportPeriod==='prev'){ const p=reportShiftYm(nowYm,-1); return [p,p]; }
  if(reportPeriod==='quarter') return [reportShiftYm(nowYm,-2), nowYm];
  if(reportPeriod==='year') return [reportShiftYm(nowYm,-11), nowYm];
  if(reportPeriod==='all'){ let min=nowYm; for(const t of state.transactions){ const ym=(t.date||'').slice(0,7); if(ym && ym<min) min=ym; } return [min, nowYm]; }
  return [nowYm, nowYm];
}

// Сводка (прогресс цели/лимита) конверта — отдельно от полей ввода, чтобы обновлять её точечно, не трогая input'ы (фокус сохраняется при переходе между полями).
function budgetEnvSummary(e,ym){
  const f=envFundedInMonth(e.id,ym), sp=envSpentInMonth(e.id,ym);
  const tgtPc=e.monthlyTarget>0?Math.min(100,Math.round(f/e.monthlyTarget*100)):0;
  const over=e.monthlyLimit>0&&sp>e.monthlyLimit+0.005, limPc=e.monthlyLimit>0?Math.min(100,Math.round(sp/e.monthlyLimit*100)):0;
  return `${e.monthlyTarget>0?`<div class="small-note u-mt-8" >Наполнено: ${fmtBase(f)} / ${fmtBase(e.monthlyTarget)} · ${tgtPc}%</div><div class="prog sm"><i style="width:${Math.max(2,tgtPc)}%;background:${f>=e.monthlyTarget-0.005?'var(--green)':'var(--accent)'}"></i></div>`:''}${e.monthlyLimit>0?`<div class="small-note" style="margin-top:6px;color:${over?'var(--red)':'var(--muted)'}">Потрачено: ${fmtBase(sp)} / ${fmtBase(e.monthlyLimit)}${over?' · перерасход':` · ${limPc}%`}</div><div class="prog sm"><i style="width:${Math.max(2,limPc)}%;background:${over?'var(--red)':(limPc>=80?'var(--warn-txt)':'var(--accent)')}"></i></div>`:''}`;
}
function budgetWatchSummary(w,ym){
  const color=w.type==='category'?(catById(w.value)?.color||'#94a3b8'):'#7b5cff';
  const sp=watchSpent(w,ym); const pc=w.target>0?Math.min(100,Math.round(sp/w.target*100)):0; const over=w.target>0&&sp>w.target+0.005;
  return `${w.target>0?`<div class="small-note" style="margin-top:6px;color:${over?'var(--red)':'var(--muted)'}">Потрачено: ${fmtBase(sp)} / ${fmtBase(w.target)}${over?' · превышен':` · ${pc}%`}</div><div class="prog sm"><i style="width:${Math.max(2,pc)}%;background:${over?'var(--red)':(pc>=80?'var(--warn-txt)':color)}"></i></div>`:''}`;
}
function budgetSetEnv(id,field,v){ const e=env(id); if(!e) return; const n=Math.max(0,round2(parseFloat(v)||0)); if(field==='target') e.monthlyTarget=n; else e.monthlyLimit=n; save();
  const s=document.getElementById('bsum-env-'+id); if(s) s.innerHTML=budgetEnvSummary(e,todayISO().slice(0,7)); else renderMore(); }
function budgetSetWatch(id,v){ const w=state.watchlists.find(x=>x.id===id); if(!w) return; w.target=Math.max(0,round2(parseFloat(v)||0)); save();
  const s=document.getElementById('bsum-watch-'+id); if(s) s.innerHTML=budgetWatchSummary(w,todayISO().slice(0,7)); else renderMore(); }
function renderWatch(el){
  const curYm=todayISO().slice(0,7); const useYm=viewMonth;
  const months=[]; { let [y,m]=curYm.split('-').map(Number); for(let i=0;i<3;i++){ m--; if(m<1){m=12;y--;} months.unshift(`${y}-${String(m).padStart(2,'0')}`); } }
  const daysNow=new Date().getDate();
  const items=state.watchlists.map(w=>{
    const name=w.type==='category'?(catById(w.value)?.name||'категория'):'#'+w.value;
    const icon=w.type==='category'?(catById(w.value)?.icon||'🏷️'):'#️⃣';
    const color=w.type==='category'?(catById(w.value)?.color||'#94a3b8'):'#7b5cff';
    const spent=watchSpent(w,useYm);
    const proj=(useYm===curYm&&daysNow>0)?round2(spent/daysNow*daysInMonth(useYm)):spent;
    const avg=round2(months.reduce((s,mm)=>s+watchSpent(w,mm),0)/3);
    const over=w.target>0&&proj>w.target, pct=w.target>0?Math.min(100,Math.round(spent/w.target*100)):0;
    const col=over?'var(--red)':(w.target>0&&pct>=80)?'var(--warn-txt)':color;
    return `<div class="card">
      <div class="goal-top"><div class="goal-ic" style="background:${color};font-size:18px;width:38px;height:38px">${icon}</div>
        <div class="grow"><div class="u-fw-700">${esc(name)}</div><div class="small-note">потрачено ${fmtBase(spent)}${useYm===curYm?` · прогноз ${fmtBase(proj)}`:''}</div></div>
        <button class="icon-btn" onclick="openWatch('${w.id}')" aria-label="Изменить">${ic('pencil','sm')}</button></div>
      ${w.target>0?`<div class="prog"><i style="width:${Math.max(2,pct)}%;background:${col}"></i></div>
        <div class="row u-mt-6" ><span class="small-note" style="color:${over?'var(--red)':'var(--muted)'}">${over?'⚠️ прогноз выше лимита':'лимит '+fmtBase(w.target)}</span><span style="font-weight:800;color:${col}">${pct}%</span></div>`:''}
      <div class="small-note u-mt-8" >Среднее за 3 мес: ${fmtBase(avg)}${(avg>0&&useYm===curYm)?` · прогноз ${proj>avg?'<span class="red">выше</span>':'<span class="green">ниже</span>'} среднего`:''}</div></div>`; }).join('');
  el.innerHTML=`<button class="back-btn" onclick="backMore()">${ic('chevl','sm')} Назад</button><h2 class="u-m-0-4-12">Лимиты и наблюдение</h2>
    <div class="small-note u-m-0-4-12" >Задай месячный лимит на категорию или тег и следи за ним: прогноз к концу месяца, сравнение со средним за 3 мес, предупреждение о перерасходе. Лимиты категорий отсюда показываются и на «Анализе». Теги — пиши <b>#тег</b> в комментарии операции.</div>
    ${items||'<div class="empty"><div class="big">🚦</div>Пока нет лимитов и наблюдений</div>'}
    <button class="btn" onclick="openWatch()">${ic('plus','sm')} Добавить лимит / наблюдение</button>`;
}
let wForm=null;
function openWatch(id){ const w=id?state.watchlists.find(x=>x.id===id):null;
  wForm={id:id||null, type:w?w.type:'category', value:w?w.value:(state.categories.find(c=>c.kind==='expense')?.id||''), target:w?(w.target||''):''};
  renderWatchForm(); }
function captureW(){ const g=id=>document.getElementById(id); if(g('w-tag')) wForm.value=g('w-tag').value.replace(/^#/,'').trim().toLowerCase(); if(g('w-cat')) wForm.value=g('w-cat').value; if(g('w-target')) wForm.target=g('w-target').value; }
function wSetType(t){ captureW(); wForm.type=t; if(t==='category'&&!catById(wForm.value)) wForm.value=state.categories.find(c=>c.kind==='expense')?.id||''; if(t==='tag'&&catById(wForm.value)) wForm.value=''; renderWatchForm(); }
function renderWatchForm(){ const f=wForm; const cats=state.categories.filter(c=>c.kind==='expense');
  openSheet(`<h2>${f.id?'Изменить наблюдение':'Новое наблюдение'}</h2>
    <div class="seg u-mb-14" ><button class="${f.type==='category'?'active':''}" onclick="wSetType('category')">Категория</button><button class="${f.type==='tag'?'active':''}" onclick="wSetType('tag')">Тег</button></div>
    ${f.type==='category'?`<label class="field"><span>Категория расхода</span><select class="input" id="w-cat">${cats.map(c=>`<option value="${c.id}" ${c.id===f.value?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></label>`
      :`<label class="field"><span>Тег (без #)</span><input class="input" id="w-tag" value="${esc(f.value)}" placeholder="отпуск"></label>`}
    <label class="field"><span>Лимит за месяц, ${state.baseCurrency} (необязательно)</span><input class="input" id="w-target" type="number" inputmode="decimal" value="${f.target}" placeholder="0"></label>
    <button class="btn" onclick="saveWatch()">Сохранить</button>${f.id?`<button class="btn danger u-mt-10"  onclick="deleteWatch('${f.id}')">Удалить</button>`:''}`);
}
function saveWatch(){ captureW(); const f=wForm;
  if(f.type==='category'&&!f.value){toast('Выбери категорию');return;} if(f.type==='tag'&&!f.value){toast('Введи тег');return;}
  const target=round2(parseFloat(f.target)||0);
  if(f.id){ const w=state.watchlists.find(x=>x.id===f.id); Object.assign(w,{type:f.type,value:f.value,target}); }
  else state.watchlists.push({id:uid(),type:f.type,value:f.value,target});
  save(); closeSheet(); toast('Сохранено'); moreView='watch'; renderMore(); }
async function deleteWatch(id){ if(!await confirmSheet('Удалить наблюдение?',{okText:'Удалить',danger:true}))return; state.watchlists=state.watchlists.filter(w=>w.id!==id); tomb(id); save(); closeSheet(); toast('Удалено'); moreView='watch'; renderMore(); }

/* ---------- Утилиты ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function byDateDesc(a,b){ return (a.date<b.date?1:a.date>b.date?-1:0)||(a.id<b.id?1:-1); }
function dayHead(iso){ if(!iso)return''; const [y,m,d]=iso.split('-').map(Number); const wd=new Date(y,m-1,d).getDay(); return `${d} ${MONTHS_GEN[m-1]}, ${WEEKDAYS[wd]}`; }
let toastTimer, pendingUndo=null;
function toast(msg, ms){ const t=document.getElementById('toast'); pendingUndo=null; t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),ms||1700); }   // ms — для длинных сообщений о незавершённом подключении (по умолчанию 1,7 с)
function toastUndo(msg, undoFn){ const t=document.getElementById('toast'); pendingUndo=undoFn;
  t.innerHTML=`<span>${esc(msg)}</span><button class="toast-undo" onclick="doUndo()">Отменить</button>`;
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.classList.remove('show'); pendingUndo=null; },5000); }
function doUndo(){ const f=pendingUndo; pendingUndo=null; document.getElementById('toast').classList.remove('show'); clearTimeout(toastTimer); if(f) f(); }
function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||10); }catch(e){} }

const ONB_KEY='konverty_onboarded';
let onbStep=0;
const ONB=[
  {ic:'👛', h:'Два слоя денег', b:'<b>Счета</b> — где деньги реально лежат (карта, наличные, инвест-счёт). <b>Конверты</b> — бюджет: на что ты эти деньги планируешь потратить. Деньги на счёте и бюджет конверта — разные вещи, и это главная идея приложения.'},
  {ic:'➕', h:'Как вести', b:'Кнопкой «＋» добавляй <b>доход</b>, <b>расход</b> и <b>перевод</b>. Доход сам раскладывается по конвертам по процентам. Можно отметить, какие конверты «оплачиваешь сейчас», а остальное оставить <b>в долг конвертам</b> — деньги полежат свободно на счёте.'},
  {ic:'🔒', h:'Данные — только у тебя', b:'Всё хранится на этом устройстве, без сервера. Приложение делает <b>резервные копии</b> («Ещё → Резервные копии») и умеет экспорт в файл — делай копии, чтобы ничего не потерять.'}
];
const ONB_CURS=[['KZT','₸'],['RUB','₽'],['UAH','₴'],['USD','$'],['EUR','€'],['BYN','Br'],['KGS','с'],['UZS','сўм'],['GEL','₾'],['AMD','֏'],['AZN','₼']];
function showOnboarding(){ onbStep=0; renderOnboarding(); }
function onbNav(d){ onbStep=Math.max(0,Math.min(ONB.length+1,onbStep+d)); renderOnboarding(); }   // +2 шага: выбор валюты и быстрая настройка
function finishOnboarding(){ try{ localStorage.setItem(ONB_KEY,'1'); }catch(e){} closeSheet(); render(); }
function onbSetCurrency(code,sym){ let c=state.currencies.find(x=>x.code===code); if(!c){ c={code,symbol:sym,rate:1}; state.currencies.push(c); } c.rate=1; delete c.manual; state.baseCurrency=code; save(); renderOnboarding(); }
// Быстрая настройка (последний шаг онбординга): имя основного счёта + проценты конвертов — чистые правки state
function onbSetAccName(v){ const a=spendableAccounts()[0]||activeAccounts()[0]; if(a){ const n=(v||'').trim(); if(n) a.name=n; save(); } }
function onbSetEnvPct(id,v,inp){ const e=state.envelopes.find(x=>x.id===id); if(!e) return;
  e.percent=Math.max(0,Math.min(100,Math.round(parseFloat(v)||0))); save();
  if(inp) inp.value=e.percent;   // показать применённое (клампнутое) значение, не перерисовывая весь лист
  const el=document.getElementById('onbPctSum'); if(!el){ renderOnboarding(); return; }
  const s=activeEnvelopes().reduce((a,x)=>a+(Number(x.percent)||0),0); const bad=Math.abs(s-100)>0.5;
  el.innerHTML=`Сумма процентов: <b>${s}%</b>${bad?' — обычно делают 100%':' ✓'}`;

function renderOnboarding(){
  const total=ONB.length+2, isCurStep=onbStep===ONB.length, isSetupStep=onbStep===ONB.length+1, last=isSetupStep;
  const dots=Array.from({length:total},(_,i)=>`<span style="width:7px;height:7px;border-radius:50%;background:${i===onbStep?'var(--accent)':'var(--line)'}"></span>`).join('');

    const sp=spendableAccounts()[0]||activeAccounts()[0];

    body=`<div class="u-p-6-2-2"><div class="u-ta-center"><div class="u-fs-46">🛠️</div>

        <span class="grow">${esc(e.name)}</span>

  } else if(isCurStep){
    const chips=ONB_CURS.map(([c,sym])=>`<button class="echip ${state.baseCurrency===c?'active':''}" onclick="onbSetCurrency('${c}','${sym}')">${c} ${sym}</button>`).join('');
    body=`<div class="u-ta-center_p-6-4-2"><div class="u-fs-46">💱</div>
      <h2 class="u-m-10-0-10">Твоя валюта</h2>

      <div class="u-d-flex_fwrap-wrap_g-8_jc-center_mt-14">${chips}</div>
      <div class="u-d-flex_g-7_jc-center_m-18-0-4">${dots}</div></div>`;
  } else {
    const s=ONB[onbStep];
    body=`<div class="u-ta-center_p-6-4-2"><div class="u-fs-46">${s.ic}</div>
      <h2 class="u-m-10-0-10">${s.h}</h2>

      <div class="u-d-flex_g-7_jc-center_m-18-0-4">${dots}</div></div>`;
  }
  openSheet(body+`<div class="btn-grid">${onbStep>0?`<button class="btn sec" onclick="onbNav(-1)">‹ Назад</button>`:`<button class="btn sec" onclick="finishOnboarding()">Пропустить</button>`}
      ${last?`<button class="btn" onclick="finishOnboarding()">Начать 🎉</button>`:`<button class="btn" onclick="onbNav(1)">Далее ›</button>`}</div>`);
}

/* ---------- Напоминания (пункт 7). Хостинг HTTPS + SW: срабатывают при открытии/возврате; фоновые пуши (закрытое приложение) требуют Web Push — не подключены. ---------- */
const NOTIFY_KEY='konverty_notify', NOTIFY_LAST='konverty_notify_last';
function notifySupported(){ return typeof Notification!=='undefined'; }
function notifyEnabled(){ try{ return localStorage.getItem(NOTIFY_KEY)==='1'; }catch(e){ return false; } }
function notifyGranted(){ return notifySupported() && Notification.permission==='granted'; }
function showNotify(title, body){ try{ if(notifyGranted()) new Notification(title, {body:body||'', icon:'./icon.svg'}); }catch(e){} }
async function enableNotifications(){
  if(!notifySupported()){ toast('Браузер не поддерживает уведомления'); return; }
  try{ const p=await Notification.requestPermission();
    if(p==='granted'){ localStorage.setItem(NOTIFY_KEY,'1'); toast('Напоминания включены ✓'); fireDueNotification(true); }
    else toast('Доступ к уведомлениям не выдан');
  }catch(e){ toast('Не удалось включить уведомления'); }
  openNotifySettings();
}
function disableNotifications(){ try{ localStorage.setItem(NOTIFY_KEY,'0'); }catch(e){} toast('Напоминания выключены'); openNotifySettings(); }
function fireDueNotification(force){
  if(!notifyEnabled() || !notifyGranted()) return;
  const today=todayISO();
  if(!force){ try{ if(localStorage.getItem(NOTIFY_LAST)===today) return; }catch(e){} }
  const items=payAgendaItems();
  const duePay=items.filter(i=>i.type==='expense' && i.date<=today);              // к оплате: просрочено + сегодня
  const tmr=(()=>{ const d=new Date(today+'T00:00:00'); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  const soon=items.filter(i=>i.type==='expense' && i.date===tmr);                 // завтра
  const {envBal}=computeBalances();
  const negEnv=activeEnvelopes().map(e=>({e,base:envelopeBase(envBal,e.id)})).filter(x=>x.base<-0.5);
  const parts=[];
  if(duePay.length){ const sum=round2(duePay.reduce((s,i)=>s+toBase(i.amount,i.currency),0)); parts.push(`К оплате: ${duePay.length} на ${fmtBase(sum)}`); }
  if(soon.length) parts.push(`Завтра: ${soon.length} ${plural(soon.length,'платёж','платежа','платежей')}`);
  if(negEnv.length) parts.push(`${negEnv.length} ${plural(negEnv.length,'конверт в минусе','конверта в минусе','конвертов в минусе')}`);
  if(!parts.length){ if(force) toast('Сейчас напоминать не о чем 👍'); return; }
  showNotify('Конверты — напоминание', parts.join(' · '));
  try{ localStorage.setItem(NOTIFY_LAST, today); }catch(e){}
}
function openNotifySettings(){
  const supp=notifySupported(), on=notifyEnabled()&&notifyGranted();
  openSheet(`<h2>🔔 Напоминания</h2>
    <div class="small-note u-mb-12" >Системные уведомления о том, что пора внести повторяющийся платёж или что конверт ушёл в минус.</div>
    ${!supp?`<div class="info-line u-bg-red-soft_c-red" >Этот браузер не поддерживает уведомления.</div>`
      :on?`<div class="info-line">Напоминания включены ✓</div><div class="btn-grid u-mt-10" ><button class="btn sec" onclick="disableNotifications()">Выключить</button><button class="btn" onclick="fireDueNotification(true)">Проверить сейчас</button></div>`
      :`<button class="btn" onclick="enableNotifications()">Включить напоминания</button>`}
    <div class="small-note u-mt-14" >Напоминания приходят, когда приложение открыто или когда ты возвращаешься к нему (не чаще раза в день). Полноценные пуши при полностью закрытом приложении пока не подключены — это отдельная серверная часть (Web Push). На iPhone уведомления работают, только если добавить приложение на экран «Домой».</div>`);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) fireDueNotification(false); });

// U6: тап по «＋» — быстрый расход; долгое нажатие — выбор Расход/Доход/Перевод.
const _addbtn=document.getElementById('addbtn'); let _addLp=null, _addLpFired=false;
function addQuickSheet(){ openSheet(`<h2>Новая операция</h2>
  <div class="btn-grid u-mt-4" ><button class="btn" onclick="openEntry('expense')">➖ Расход</button>
    <button class="btn sec" onclick="openEntry('income')">${ic('plus','sm')} Доход</button></div>
  <button class="btn sec u-mt-10"  onclick="openEntry('transfer')">${ic('swap','sm')} Перевод</button>`); }
_addbtn.addEventListener('click', ()=>{ if(_addLpFired){ _addLpFired=false; return; } haptic(); openEntry('expense'); });
function _addLpStart(){ _addLpFired=false; clearTimeout(_addLp); _addLp=setTimeout(()=>{ _addLpFired=true; haptic(22); addQuickSheet(); }, 450); }
function _addLpEnd(){ clearTimeout(_addLp); }
_addbtn.addEventListener('touchstart', _addLpStart, {passive:true});
_addbtn.addEventListener('touchend', _addLpEnd);
_addbtn.addEventListener('touchmove', _addLpEnd, {passive:true});
_addbtn.addEventListener('mousedown', _addLpStart);
_addbtn.addEventListener('mouseup', _addLpEnd);
_addbtn.addEventListener('mouseleave', _addLpEnd);

/* Свайп по операции влево — быстрое удаление (с возможностью отмены) */
let swEl=null, swX0=0, swY0=0, swDx=0, swAct=false;
document.addEventListener('touchstart', e=>{ const op=e.target.closest('.op'); if(!op || !op.dataset.id || opsSelMode){ swEl=null; return; }   // свайп-удаление только на реальных операциях; в режиме мультивыбора тап=выбор, свайп отключён
  swEl=op; swX0=e.touches[0].clientX; swY0=e.touches[0].clientY; swDx=0; swAct=false; }, {passive:true});
document.addEventListener('touchmove', e=>{ if(!swEl) return;
  const dx=e.touches[0].clientX-swX0, dy=e.touches[0].clientY-swY0;
  if(!swAct){ if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)+4){ swAct=true; swEl.classList.add('swiping'); }
    else if(Math.abs(dy)>10){ swEl=null; return; } }
  if(swAct){ swDx=Math.min(0, dx); swEl.style.transform=`translateX(${swDx}px)`;
    swEl.style.opacity = String(Math.max(.4, 1+swDx/240)); e.preventDefault(); } }, {passive:false});
document.addEventListener('touchend', ()=>{ if(!swEl) return; const el=swEl, dx=swDx; swEl=null;
  el.classList.remove('swiping');
  if(swAct && dx<-80){ const id=el.dataset.id; el.style.transition='transform .18s,opacity .18s'; el.style.transform='translateX(-100%)'; el.style.opacity='0'; haptic(15); setTimeout(()=>{ if(id) deleteTx(id); }, 160); }
  else { el.style.transform=''; el.style.opacity=''; } });

/* Долгое нажатие на счёт/конверт — корректировка текущей суммы */
let lpTimer=null, lpFiredAt=0, lpX0=0, lpY0=0;
function lpStart(e){ const el=(e.target.closest&&e.target.closest('.acc,.env')); if(!el) return;
  const kind=el.classList.contains('acc')?'account':'envelope', id=el.dataset.id;
  const p=e.touches?e.touches[0]:e; lpX0=p.clientX; lpY0=p.clientY;
  clearTimeout(lpTimer); lpTimer=setTimeout(()=>{ lpFiredAt=Date.now(); haptic(22); openCorrection(kind,id); }, 500); }
function lpCancel(){ clearTimeout(lpTimer); lpTimer=null; }
function lpMove(e){ if(!lpTimer) return; const p=e.touches?e.touches[0]:e; if(Math.abs(p.clientX-lpX0)>8||Math.abs(p.clientY-lpY0)>8) lpCancel(); }
document.addEventListener('touchstart', lpStart, {passive:true});
document.addEventListener('touchmove', lpMove, {passive:true});
document.addEventListener('mousemove', lpMove, {passive:true});
document.addEventListener('touchend', lpCancel);
document.addEventListener('mousedown', lpStart);
document.addEventListener('mouseup', lpCancel);
document.addEventListener('mouseleave', lpCancel);
document.addEventListener('scroll', lpCancel, {passive:true});

/* H6: делаем div-«кнопки» доступными с клавиатуры (role/tabindex + Enter/Space) и озвучиваем иконки (aria-label) */
(function(){
  const SEL='.op,.acc,.env,.menu-item,.cat-item,.fund-row,.echip,.chip,.theme-card,.cat-line,.he-row,.duo-tap';
  const markOne=el=>{ if(el.nodeType!==1||!el.matches) return;
    if(el.matches(SEL)&&!el.hasAttribute('role')){ el.setAttribute('role','button'); el.tabIndex=0; }
    if(el.matches('.icon-btn[title]')&&!el.hasAttribute('aria-label')) el.setAttribute('aria-label', el.getAttribute('title')); };
  const pass=root=>{ if(!root||root.nodeType!==1) return; markOne(root); root.querySelectorAll&&root.querySelectorAll(SEL+',.icon-btn[title]').forEach(markOne); };
  try{ const obs=new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(pass)));
    ['main','#sheet'].forEach(s=>{ const r=document.querySelector(s); if(r){ pass(r); obs.observe(r,{childList:true,subtree:true}); } });
  }catch(e){}
  document.addEventListener('keydown', e=>{ const t=e.target;
    if((e.key==='Enter'||e.key===' ') && t && t.getAttribute && t.getAttribute('role')==='button' && !['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(t.tagName)){ e.preventDefault(); t.click(); } });
})();

// Клавиатура на ПК: Esc — закрыть лист/подэкран, Enter — сохранить ввод, ←/→ — переключить месяц (на Операциях/Анализе).
document.addEventListener('keydown', e=>{
  const sheetOpen = document.getElementById('sheet')?.classList.contains('show');
  const cfOpen = !!document.querySelector('.cf-back');
  const tag = document.activeElement?.tagName;
  const typing = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if (e.key==='Escape'){
    if (cfOpen) return;                                   // подтверждение закрывается своими кнопками
    if (sheetOpen){ e.preventDefault(); closeSheet(); return; }
    if (currentTab==='more' && moreView){ e.preventDefault(); backMore(); return; }
  }
  if (e.key==='Enter' && sheetOpen && tag!=='TEXTAREA' && tag!=='BUTTON' && tag!=='SELECT'){
    // Приоритет — кнопка сохранения ввода; иначе последняя первичная кнопка листа (форма счёта/цели/долга/шаблона и т.п.)
    let save=document.querySelector('#sheet .entry-save:not(.off)');
    if(!save){ const cands=[...document.querySelectorAll('#sheet button.btn:not(.sec):not(.danger):not(.off)')]; save=cands[cands.length-1]||null; }
    if(save){ e.preventDefault(); save.click(); return; }
  }
  if ((e.key==='ArrowLeft'||e.key==='ArrowRight') && !sheetOpen && !cfOpen && !typing){
    // Стрелки листают месяц только в помесячном режиме — в «Всё время» навигация по месяцу заблокирована
    const scope = currentTab==='ops'?opsScope : currentTab==='analysis'?analysisScope : null;
    if (scope==='month'){ e.preventDefault(); shiftMonth(e.key==='ArrowLeft'?-1:1); }
  }
});

setTimeout(()=>{ const s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(()=>s.remove(),500); } }, 820);
applyTheme(); load(); loadOpsFilter();
let autoN=0;
try { if(!syncConfigured()) autoN=autoPostDueRecurring(); switchTab('home'); }   // при синхронизации авто-платежи проводятся ПОСЛЕ пула (см. syncNow), чтобы устройства не задваивали
catch(err){ console.error('render error', err);
  try{ const o=document.getElementById('screen-ops'); if(o) o.innerHTML='<div class="empty"><div class="big">⚠️</div>Не удалось отобразить данные. Открой «Ещё → Резервные копии», чтобы восстановить последнюю копию, либо «Ещё → Импорт и экспорт», чтобы сохранить файл.</div>'; }catch(e){} }
ensurePersist(); dailyBackup(); syncOnLoad();
try{ const _t=todayISO(); state.rateHistory ||= {}; if(!state.rateHistory[_t]){ state.rateHistory[_t]=rateSnapshot(); save(); } }catch(e){}   // ежедневный снимок курсов
if (autoN) setTimeout(()=>toast(`Автоматически проведено: ${autoN}`), 1100);
// Онбординг только для новой установки; существующему пользователю тихо ставим флаг.
try{ if(!localStorage.getItem(ONB_KEY)){ if(state.transactions.length===0) setTimeout(showOnboarding, 950); else localStorage.setItem(ONB_KEY,'1'); } }catch(e){}
setTimeout(()=>fireDueNotification(false), 1600);   // напоминания при запуске (если включены)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(()=>fireDueNotification(false), 300); });   // и при возврате в приложение (не чаще раза в день)
if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
